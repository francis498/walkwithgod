 mine heart, that I might not sin against thee."]],"story_titles":["Wings Like Eagles","Fear Thou Not","Even to Your Old Age","Wounded for Us","Call the Sabbath a Delight","Josiah Finds the Book"]},{"kind":"story","day":148,"week":22,"book":"Jeremiah","title":"The Potter and the Clay","ref":"Jeremiah 18:1-6; Isaiah 64:8","story":"God sent Jeremiah to watch a potter. When the clay pot was spoiled, the potter made it again into a new pot. God can shape our lives too.","n":2,"w":"hands the potter uses","v":"We are the clay, and thou our potter; and we all are the work of thy hand.","vr":"Isaiah 64:8","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Squeeze and roll play dough or clay into a little bowl. Working clay makes hands strong!","tg":null,"q":"How has God shaped your life?","prev":"Josiah Finds the Book","joy":"Take a short walk to the mailbox or porch.","brain":"Two-hand potter: roll a clay snake with both hands together, then roll a ball with each hand separately at the same time.","trace":null},{"kind":"story","day":149,"week":22,"book":"Jeremiah","title":"Jeremiah Lifted from the Pit","ref":"Jeremiah 38:6-13; 29:11","story":"Jeremiah was thrown into a muddy pit. Kind Ebedmelech took thirty men and let down old rags and ropes, and pulled Jeremiah out.","n":30,"w":"men who helped pull Jeremiah out","v":"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil.","vr":"Jeremiah 29:11","move":"Toe taps: Keep your heels on the floor and tap your toes. Do 30 in all: 3 sets of 10 with a rest between.","craft":"Tie soft rags together into a rope. Hold one end while your helper gently pulls the other.","tg":null,"q":"Who has pulled you out of a hard time?","prev":"The Potter and the Clay","joy":"Tell your helper what you want to do first in heaven."},{"kind":"story","day":150,"week":22,"book":"Lamentations","title":"New Every Morning","ref":"Lamentations 3:22-26","story":"Even in a sad time, Jeremiah remembered: God's mercies never end. They are new every morning.","n":null,"w":"","v":"They are new every morning: great is thy faithfulness.","vr":"Lamentations 3:23","move":"Morning stretch: reach both arms up high and stretch, then bring them down. 5 times. Then roll your shoulders 5 times.","craft":"Tomorrow morning, open the curtains first thing and say, 'Thank You, Lord, for a new morning.'","tg":null,"q":"What is the best part of your morning?","prev":"Jeremiah Lifted from the Pit","joy":"Feel something new: tree bark, wool, a smooth stone.","brain":"Something new: do one ordinary thing today with your other hand: stir your drink, brush your hair, or wipe the table.","trace":null},{"kind":"story","day":151,"week":22,"book":"Daniel","title":"Daniel's Healthy Food","ref":"Daniel 1:8-20","story":"Daniel and his three friends would not eat the king's rich food. They asked for vegetables and water for ten days. They were healthier and ten times wiser than all the others!","n":10,"w":"days Daniel ate vegetables and water","v":"But Daniel purposed in his heart that he would not defile himself.","vr":"Daniel 1:8","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do it 10 times, for the number 10 in today's story.","craft":"Arrange colorful vegetables or fruit on a plate. Name each color. Enjoy a healthy snack with a glass of water.","tg":null,"q":"What healthy foods do you enjoy?","prev":"New Every Morning","joy":"Say the memory verses you remember from this week."},{"kind":"story","day":152,"week":22,"book":"Daniel","title":"The Great Statue","ref":"Daniel 2:31-45","story":"King Nebuchadnezzar dreamed of a statue: a head of gold, chest of silver, belly of brass, legs of iron, and feet of iron and clay. The four metals showed four kingdoms that would rule the world.","n":4,"w":"kingdoms shown by the metals of the statue","v":"The God of heaven set up a kingdom, which shall never be destroyed.","vr":"Daniel 2:44","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 4 times, for the number 4 in today's story.","craft":"Stack 4 papers from top to bottom: yellow (gold), gray (silver), brown (brass), black (iron). Say the metals as you stack.","tg":null,"q":"Can you name the 4 metals in order?","prev":"Daniel's Healthy Food","joy":"Draw or color something just for fun.","brain":"Head to toe: touch your head (gold) with your right hand while your left touches your feet or knees (iron and clay). Slowly move both hands toward your middle (silver, brass) until they meet. Then back out.","trace":null},{"kind":"story","day":153,"week":22,"book":"Daniel","title":"The Stone Cut Without Hands","ref":"Daniel 2:34-35, 44","story":"In the dream a stone, cut without hands, hit the statue and broke it to pieces. The stone grew into a great mountain. It is Jesus' kingdom coming soon!","n":1,"w":"stone that became a mountain","v":"But there is a God in heaven that revealeth secrets.","vr":"Daniel 2:28","move":"Hand claps: Clap your hands together, nice and steady. Do 1, rest, and repeat for 3 rounds (the number 1 from today's story).","craft":"Find a stone. Place it beside yesterday's 4 papers. Then make the tangram mountain the stone became.","tg":"mountain","q":"What kingdom will last forever?","prev":"The Great Statue","joy":"Give away something you no longer need."},{"kind":"sabbath","day":154,"week":22,"title":"Sabbath Rest","v":"Remember the sabbath day, to keep it holy.","vr":"Exodus 20:8","hymn":"Sweet Hour of Prayer","review":[["Isaiah 64:8","We are the clay, and thou our potter; and we all are the work of thy hand."],["Jeremiah 29:11","For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil."],["Lamentations 3:23","They are new every morning: great is thy faithfulness."],["Daniel 1:8","But Daniel purposed in his heart that he would not defile himself."],["Daniel 2:44","The God of heaven set up a kingdom, which shall never be destroyed."],["Daniel 2:28","But there is a God in heaven that revealeth secrets."]],"story_titles":["The Potter and the Clay","Jeremiah Lifted from the Pit","New Every Morning","Daniel's Healthy Food","The Great Statue","The Stone Cut Without Hands"]},{"kind":"story","day":155,"week":23,"book":"Daniel","title":"The Fiery Furnace","ref":"Daniel 3:13-27","story":"Three friends would not bow to a golden image. The furnace was heated seven times hotter, but the king saw four men walking in the fire. The fourth was like the Son of God!","n":4,"w":"men walking in the fire","v":"Our God whom we serve is able to deliver us from the burning fiery furnace.","vr":"Daniel 3:17","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do it 4 times, for the number 4 in today's story.","craft":"Make 4 stick people from pipe cleaners or popsicle sticks. Put red and orange paper flames around them.","tg":null,"q":"Who was the fourth man in the fire?","prev":"The Stone Cut Without Hands","joy":"Pray for your church and your pastor.","brain":"Four walking in the fire: 4 cross-over steps (hand to opposite knee), saying 'Shadrach, Meshach, Abednego, and the Son of God!'","trace":null},{"kind":"story","day":156,"week":23,"book":"Daniel","title":"The Proud King Learns","ref":"Daniel 4:28-37","story":"King Nebuchadnezzar was proud. For seven times he lived like an animal in the field. When he looked up to heaven, his mind came back, and he praised God.","n":7,"w":"times (years) the king lived in the field","v":"Now I Nebuchadnezzar praise and extol and honour the King of heaven.","vr":"Daniel 4:37","move":"Heel raises: Keep your toes on the floor and lift your heels up, then lower them. Do it 7 times, for the number 7 in today's story.","craft":"Make the tangram crown. Take it off and 'give' it to God, like the king who learned God is King.","tg":"crown","q":"Why is being humble better than being proud?","prev":"The Fiery Furnace","joy":"Pet an animal or watch the birds for a while."},{"kind":"story","day":157,"week":23,"book":"Daniel","title":"The Writing on the Wall","ref":"Daniel 5:5-28","story":"At a wild party, a hand wrote four words on the palace wall: MENE, MENE, TEKEL, UPHARSIN. Daniel read it: the kingdom would fall that very night.","n":4,"w":"words written on the wall","v":"Thou art weighed in the balances, and art found wanting.","vr":"Daniel 5:27","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 4 times, for the number 4 in today's story.","craft":"Your helper writes 4 big letters on paper. Trace over them with your finger. Jesus' goodness makes up what we lack.","tg":null,"q":"Who could read the writing?","prev":"The Proud King Learns","joy":"Listen to a sermon or Bible reading.","brain":"Two-hand writing: write the first letter of your name in the air with both hands at the same time, like a mirror. Then the next letter.","trace":null},{"kind":"story","day":158,"week":23,"book":"Daniel","title":"Daniel Prays Three Times","ref":"Daniel 6:10","story":"A new law said to pray only to the king. But Daniel went home, opened his window toward Jerusalem, and prayed to God three times a day, as he always had.","n":3,"w":"times a day Daniel prayed","v":"Evening, and morning, and at noon, will I pray, and cry aloud: and he shall hear my voice.","vr":"Psalm 55:17","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make a prayer chart: morning, noon, and evening. Put a check or a sticker each time you pray today.","tg":null,"q":"When is your favorite time to pray?","prev":"The Writing on the Wall","joy":"Remember a time God answered prayer, and tell it.","brain":"Fold the other way: fold your hands with the OTHER thumb on top. It feels strange! Pray that way morning, noon and evening today.","trace":null},{"kind":"story","day":159,"week":23,"book":"Daniel","title":"Daniel in the Lions' Den","ref":"Daniel 6:16-23","story":"Daniel was thrown into a den of hungry lions. God sent His angel to shut the lions' mouths. In the morning, Daniel was safe!","n":null,"w":"","v":"My God hath sent his angel, and hath shut the lions' mouths.","vr":"Daniel 6:22","move":"Lion face: open your mouth and eyes wide and stick out your tongue like a lion, then close and smile. 5 times. (It relaxes the face and makes everyone laugh!)","craft":"Draw a lion's face with a big mane of yellow yarn or crayon lines. Give it a gentle smile.","tg":null,"q":"Daniel was likely over 80 in the lions' den. How did he stay faithful so long?","prev":"Daniel Prays Three Times","joy":"Sort buttons, coins or beans by color."},{"kind":"story","day":160,"week":23,"book":"Daniel","title":"Four Beasts from the Sea","ref":"Daniel 7:1-18","story":"Daniel dreamed of four beasts from the sea: a lion with wings, a bear, a leopard, and a terrible beast. They were four kingdoms. But God's people will receive His kingdom forever.","n":4,"w":"beasts in Daniel's dream","v":"But the saints of the most High shall take the kingdom, and possess the kingdom for ever.","vr":"Daniel 7:18","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do it 4 times, for the number 4 in today's story.","craft":"Draw or find pictures of a lion, a bear and a leopard. Match them to the metals of the statue from Daniel 2.","tg":null,"q":"Can you name the first three beasts?","prev":"Daniel in the Lions' Den","joy":"Rest well tonight: sleep is God's good gift."},{"kind":"sabbath","day":161,"week":23,"title":"Sabbath Rest","v":"The sabbath was made for man, and not man for the sabbath.","vr":"Mark 2:27","hymn":"Nearer, My God, to Thee","review":[["Daniel 3:17","Our God whom we serve is able to deliver us from the burning fiery furnace."],["Daniel 4:37","Now I Nebuchadnezzar praise and extol and honour the King of heaven."],["Daniel 5:27","Thou art weighed in the balances, and art found wanting."],["Psalm 55:17","Evening, and morning, and at noon, will I pray, and cry aloud: and he shall hear my voice."],["Daniel 6:22","My God hath sent his angel, and hath shut the lions' mouths."],["Daniel 7:18","But the saints of the most High shall take the kingdom, and possess the kingdom for ever."]],"story_titles":["The Fiery Furnace","The Proud King Learns","The Writing on the Wall","Daniel Prays Three Times","Daniel in the Lions' Den","Four Beasts from the Sea"]},{"kind":"story","day":162,"week":24,"book":"Daniel","title":"The Sanctuary Cleansed","ref":"Daniel 8:3, 13-14","story":"Daniel saw a ram with two horns and a goat. Then an angel said, 'Unto two thousand and three hundred days; then shall the sanctuary be cleansed.' Jesus is working for us in heaven now.","n":2,"w":"horns on the ram","v":"Unto two thousand and three hundred days; then shall the sanctuary be cleansed.","vr":"Daniel 8:14","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make the tangram house as the heavenly sanctuary. Talk about Jesus our High Priest.","tg":"house","q":"What is Jesus doing for us in heaven today?","prev":"Four Beasts from the Sea","joy":"Call or send a card to someone you love."},{"kind":"story","day":163,"week":24,"book":"Daniel","title":"Seventy Weeks to Messiah","ref":"Daniel 9:18-27","story":"Daniel prayed, 'O Lord, hear; O Lord, forgive.' Angel Gabriel came and told him that in seventy weeks the Messiah would come and bring everlasting righteousness.","n":7,"w":"(70 weeks: count 7 tens)","v":"O Lord, hear; O Lord, forgive.","vr":"Daniel 9:19","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do it 7 times, for the number 7 in today's story.","craft":"Fold your hands. Say the verse slowly 3 times: once whispering, once normal, once strong.","tg":null,"q":"Who was the Messiah Daniel was promised?","prev":"The Sanctuary Cleansed","joy":"Name 3 things you are thankful for today."},{"kind":"story","day":164,"week":24,"book":"Daniel","title":"Rest, and Rise Again","ref":"Daniel 12:1-3, 13","story":"The book of Daniel has twelve chapters. At the end, the angel told old Daniel that he would rest in the grave, and then rise at the end of days to receive his reward.","n":12,"w":"chapters in the book of Daniel","v":"But go thou thy way till the end be: for thou shalt rest, and stand in thy lot at the end of the days.","vr":"Daniel 12:13","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 12 times, for the number 12 in today's story.","craft":"Draw a sunrise: a half circle with lines coming out. Resurrection morning is coming!","tg":null,"q":"What will be the first thing you do on resurrection morning?","prev":"Seventy Weeks to Messiah","joy":"Sing your favorite hymn, all the way through."},{"kind":"story","day":165,"week":24,"book":"Esther","title":"Queen Esther's Courage","ref":"Esther 4:13-17","story":"Esther's people were in danger. Mordecai said, 'Maybe you became queen for such a time as this.' Esther asked everyone to fast and pray for three days before she went to the king.","n":3,"w":"days Esther and her people fasted and prayed","v":"Who knoweth whether thou art come to the kingdom for such a time as this?","vr":"Esther 4:14","move":"Knee pats: Pat your knees with both hands. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram crown for Queen Esther.","tg":"crown","q":"God has a purpose for you right now. What might it be?","prev":"Rest, and Rise Again","joy":"Look at an old photo and tell the story behind it."},{"kind":"story","day":166,"week":24,"book":"Esther","title":"The Golden Sceptre","ref":"Esther 5:1-3; 8:3-8","story":"Esther went to the king without being called. He held out his golden sceptre, and she touched the top of it. The king listened, and God's people were saved.","n":null,"w":"","v":"The king's heart is in the hand of the LORD.","vr":"Proverbs 21:1","move":"Sceptre reach: hold your sceptre in your right hand and reach it straight out in front of you, then lower it. 6 times. Switch hands and do 6 more.","craft":"Wrap a stick or wooden spoon with yellow paper or foil to make a golden sceptre.","tg":null,"q":"Jesus always welcomes us. How does that make you feel?","prev":"Queen Esther's Courage","joy":"Pray for a neighbor by name.","brain":"Reach across: touch your right hand to your left shoulder, then your left hand to your right shoulder, like the king reaching out his sceptre. 10 times.","trace":null},{"kind":"story","day":167,"week":24,"book":"Nehemiah","title":"The Joy of the Lord","ref":"Nehemiah 8:1-10","story":"Ezra stood on a high wooden pulpit and opened God's book. All the people stood up. He read from morning till noon, and the people wept. Nehemiah said, 'The joy of the LORD is your strength.'","n":null,"w":"","v":"For the joy of the LORD is your strength.","vr":"Nehemiah 8:10","move":"Stand for God's Word: with your helper beside you, stand up from a sturdy chair and sit down slowly. Do it 3 times (or lift your arms 3 times while seated).","craft":"Your helper reads a favorite Bible chapter aloud while you listen with eyes closed.","tg":null,"q":"What Bible story brings you joy?","prev":"The Golden Sceptre","joy":"Water a plant or put out seed for the birds."},{"kind":"sabbath","day":168,"week":24,"title":"Sabbath Rest","v":"Be still, and know that I am God.","vr":"Psalm 46:10","hymn":"Face to Face","review":[["Daniel 8:14","Unto two thousand and three hundred days; then shall the sanctuary be cleansed."],["Daniel 9:19","O Lord, hear; O Lord, forgive."],["Daniel 12:13","But go thou thy way till the end be: for thou shalt rest, and stand in thy lot at the end of the days."],["Esther 4:14","Who knoweth whether thou art come to the kingdom for such a time as this?"],["Proverbs 21:1","The king's heart is in the hand of the LORD."],["Nehemiah 8:10","For the joy of the LORD is your strength."]],"story_titles":["The Sanctuary Cleansed","Seventy Weeks to Messiah","Rest, and Rise Again","Queen Esther's Courage","The Golden Sceptre","The Joy of the Lord"]},{"kind":"story","day":169,"week":25,"book":"Nehemiah","title":"Rebuilding the Wall","ref":"Nehemiah 2:17-20; 6:15","story":"Nehemiah led the people to rebuild Jerusalem's broken wall. Everyone worked together, and they finished it in just fifty-two days!","n":52,"w":"days it took to build the wall (like the 52 weeks in this book!)","v":"The God of heaven, he will prosper us; therefore we his servants will arise and build.","vr":"Nehemiah 2:20","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 52 in all: 5 sets of 10 with a rest between, then 2 more.","craft":"Build a wall of blocks, books or sugar cubes. Count each 'stone' as you place it.","tg":null,"q":"What have you built in your life that you are proud of?","prev":"The Joy of the Lord","joy":"Sit in the sunshine for 10 minutes.","brain":"Pass the brick: hold a block in your right hand, pass it to your left hand in front of you, then behind your back if you can. 10 passes.","trace":null},{"kind":"story","day":170,"week":25,"book":"Job","title":"Job's Double Blessing","ref":"Job 1:20-22; 19:25; 42:10-13","story":"Job lost everything, but he still trusted God. He said, 'I know that my redeemer liveth.' God blessed Job with twice as much, and seven sons and three daughters.","n":10,"w":"children God gave Job: 7 sons and 3 daughters","v":"For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth.","vr":"Job 19:25","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do it 10 times, for the number 10 in today's story.","craft":"Count 7 blue buttons and 3 pink ones (or any 2 colors). Put them together to make 10.","tg":null,"q":"How has God blessed you after a hard time?","prev":"Rebuilding the Wall","joy":"Drink a full glass of water, and thank God for it."},{"kind":"story","day":171,"week":25,"book":"Job","title":"When the Morning Stars Sang","ref":"Job 38:4-7, 31","story":"God asked Job, 'Where were you when I made the earth, when the morning stars sang together?' God also made the Pleiades, a group of seven stars.","n":7,"w":"stars in the Pleiades","v":"When the morning stars sang together, and all the sons of God shouted for joy.","vr":"Job 38:7","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do it 7 times, for the number 7 in today's story.","craft":"Draw 7 stars in a little cluster. Tonight, look for stars through the window.","tg":null,"q":"What part of God's creation amazes you most?","prev":"Job's Double Blessing","joy":"Give someone a kind compliment.","animal":"a_penguin"},{"kind":"story","day":172,"week":25,"book":"Psalm","title":"A Tree by the River","ref":"Psalm 1","story":"Psalm 1 shows two ways. The ungodly are like dry chaff blown away. But the one who loves God's law is like a tree planted by the rivers of water.","n":2,"w":"ways in Psalm 1: the godly and the ungodly","v":"And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season.","vr":"Psalm 1:3","move":"Toe taps: Keep your heels on the floor and tap your toes. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make the tangram tree. Put a blue strip of paper beside it as the river.","tg":"tree","q":"How are you like a tree by the river?","prev":"When the Morning Stars Sang","joy":"Tell your helper about a happy day from your childhood.","brain":"Mirror tree: hold a crayon in each hand and draw a tree with both hands at once: trunk, branches, leaves, like a mirror.","trace":null},{"kind":"story","day":173,"week":25,"book":"Psalm","title":"Under His Shadow","ref":"Psalm 91:1-7","story":"Psalm 91 says we can live under the shadow of God's wings. A thousand may fall at your side and ten thousand at your right hand, but God keeps His children.","n":10,"w":"(10,000 at your right hand: count 10)","v":"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.","vr":"Psalm 91:1","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do it 10 times, for the number 10 in today's story.","craft":"Make a little 'shelter' with your hands cupped over a small stone. God covers you like that.","tg":null,"q":"Where do you feel God's protection?","prev":"A Tree by the River","joy":"Listen to some beautiful music.","animal":"a_goose"},{"kind":"story","day":174,"week":25,"book":"Psalm","title":"Forget Not His Benefits","ref":"Psalm 103:1-5","story":"David told his soul to remember five good things God does: He forgives, He heals, He redeems, He crowns us with love, and He satisfies us with good things.","n":5,"w":"benefits: forgives, heals, redeems, crowns, satisfies","v":"Bless the LORD, O my soul, and forget not all his benefits.","vr":"Psalm 103:2","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do it 5 times, for the number 5 in today's story.","craft":"Trace your hand. On each finger, your helper writes one benefit. Say them back, finger by finger.","tg":null,"q":"Can you remember all 5 benefits? Try counting on your fingers.","prev":"Under His Shadow","joy":"Smell a flower, a spice, or a piece of fresh fruit.","brain":"Five benefits, both hands: show the benefits on your fingers, right hand counting up 1 to 5 while the left hand counts down 5 to 1.","trace":null},{"kind":"sabbath","day":175,"week":25,"title":"Sabbath Rest","v":"Come unto me, all ye that labour and are heavy laden, and I will give you rest.","vr":"Matthew 11:28","hymn":"Sweet By and By","review":[["Nehemiah 2:20","The God of heaven, he will prosper us; therefore we his servants will arise and build."],["Job 19:25","For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth."],["Job 38:7","When the morning stars sang together, and all the sons of God shouted for joy."],["Psalm 1:3","And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season."],["Psalm 91:1","He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty."],["Psalm 103:2","Bless the LORD, O my soul, and forget not all his benefits."]],"story_titles":["Rebuilding the Wall","Job's Double Blessing","When the Morning Stars Sang","A Tree by the River","Under His Shadow","Forget Not His Benefits"]},{"kind":"story","day":176,"week":26,"book":"Psalm","title":"I Will Lift Up Mine Eyes","ref":"Psalm 121","story":"Psalm 121 has eight verses. It says our help comes from the Lord, who made heaven and earth. He never sleeps, and He keeps us day and night.","n":8,"w":"verses in Psalm 121","v":"I will lift up mine eyes unto the hills, from whence cometh my help.","vr":"Psalm 121:1","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 8 times, for the number 8 in today's story.","craft":"Look out a window at the farthest thing you can see: hills, trees, or sky. Or make the tangram mountain.","tg":"mountain","q":"Where does your help come from?","prev":"Forget Not His Benefits","joy":"Teach your helper something you know how to do.","brain":"Eyes to the hills: keep your head still. Look up, then down, then to each corner. Then draw a mountain shape with both hands together.","trace":null},{"kind":"story","day":177,"week":26,"book":"Psalm","title":"Fearfully and Wonderfully Made","ref":"Psalm 139:13-16","story":"God knew us before we were born. He made every part of us with care. David praised God for making him so wonderfully.","n":10,"w":"fingers God gave you","v":"I will praise thee; for I am fearfully and wonderfully made.","vr":"Psalm 139:14","move":"Hand claps: Clap your hands together, nice and steady. Do it 10 times, for the number 10 in today's story.","craft":"Touch each fingertip to your thumb, one by one, on both hands. Thank God for each finger.","tg":null,"q":"What part of your body are you most thankful for?","prev":"I Will Lift Up Mine Eyes","joy":"Hold hands with your helper and pray together.","brain":"Finger puzzle: touch right thumb to right pointer finger AND left thumb to left pinky at the same time. Move both one finger inward, and keep going. Wonderfully made!","trace":null},{"kind":"story","day":178,"week":26,"book":"Psalm","title":"Fruit in Old Age","ref":"Psalm 92","story":"Psalm 92 is a song for the Sabbath day. It says to praise God's lovingkindness in the morning and His faithfulness every night. God's people still bear fruit in old age!","n":2,"w":"times to praise: morning and night","v":"They shall still bring forth fruit in old age; they shall be fat and flourishing.","vr":"Psalm 92:14","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Hold a piece of fruit. Your life is still bearing fruit! Name one good thing you did for someone this week.","tg":"tree","q":"What 'fruit' can you still share with others?","prev":"Fearfully and Wonderfully Made","joy":"Step outside and take 5 deep breaths of fresh air."},{"kind":"story","day":179,"week":26,"book":"Psalm","title":"Until I Have Shown Thy Strength","ref":"Psalm 71:9, 17-18","story":"The writer of Psalm 71 was old and gray. He asked God to stay with him so he could tell the next generation about God's power.","n":null,"w":"","v":"Now also when I am old and greyheaded, O God, forsake me not; until I have shewed thy strength unto this generation.","vr":"Psalm 71:18","move":"Strong arms: make fists and bend your elbows to bring your fists to your shoulders, like showing off strong muscles. 8 times.","craft":"Tell your helper one story of how God helped you. Your helper can record it on a phone or write it down to share with family.","tg":null,"q":"What story of God's goodness do you want your grandchildren to know?","prev":"Fruit in Old Age","joy":"Make a list of people to pray for this week."},{"kind":"story","day":180,"week":26,"book":"Hosea","title":"Cords of Love","ref":"Hosea 3:1-2; 11:1-4","story":"Hosea bought back his wife for fifteen pieces of silver, even after she left him. That is how much God loves His people. He draws us with cords of love.","n":15,"w":"pieces of silver Hosea paid","v":"I drew them with cords of a man, with bands of love.","vr":"Hosea 11:4","move":"Heel raises: Keep your toes on the floor and lift your heels up, then lower them. Do 15 in all: 1 set of 10 with a rest between, then 5 more.","craft":"Tie two pieces of yarn together with a knot, and then a bow. Tying helps fingers stay nimble.","tg":null,"q":"How has God drawn you close to Him?","prev":"Until I Have Shown Thy Strength","joy":"Share a favorite family recipe."},{"kind":"story","day":181,"week":26,"book":"Joel","title":"Old Men Shall Dream Dreams","ref":"Joel 1:4; 2:25-28","story":"Four kinds of locusts ate the land. But God promised to restore the years the locusts ate, and to pour out His Spirit on young and old.","n":4,"w":"kinds of insects that ate the land","v":"Your old men shall dream dreams, your young men shall see visions.","vr":"Joel 2:28","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 4 times, for the number 4 in today's story.","craft":"Draw or describe a dream you have for your family's future.","tg":null,"q":"What dream do you still have?","prev":"Cords of Love","joy":"Tell a funny story and laugh together."},{"kind":"sabbath","day":182,"week":26,"title":"Sabbath Rest","v":"This is the day which the LORD hath made; we will rejoice and be glad in it.","vr":"Psalm 118:24","hymn":"We Have This Hope","review":[["Psalm 121:1","I will lift up mine eyes unto the hills, from whence cometh my help."],["Psalm 139:14","I will praise thee; for I am fearfully and wonderfully made."],["Psalm 92:14","They shall still bring forth fruit in old age; they shall be fat and flourishing."],["Psalm 71:18","Now also when I am old and greyheaded, O God, forsake me not; until I have shewed thy strength unto this generation."],["Hosea 11:4","I drew them with cords of a man, with bands of love."],["Joel 2:28","Your old men shall dream dreams, your young men shall see visions."]],"story_titles":["I Will Lift Up Mine Eyes","Fearfully and Wonderfully Made","Fruit in Old Age","Until I Have Shown Thy Strength","Cords of Love","Old Men Shall Dream Dreams"]},{"kind":"story","day":183,"week":27,"book":"Micah","title":"Do Justly, Love Mercy","ref":"Micah 5:2; 6:8","story":"Micah said the Saviour would be born in little Bethlehem. He also said God asks three things of us: do justly, love mercy, and walk humbly with God.","n":3,"w":"things God requires","v":"And what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","vr":"Micah 6:8","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Take 3 steps with your helper, saying one part of the verse at each step.","tg":null,"q":"Where was Jesus to be born, according to Micah?","prev":"Old Men Shall Dream Dreams","joy":"Say a blessing for a grandchild or young friend.","brain":"Three steps: say 'do justly' while tapping the right knee, 'love mercy' on the left knee, 'walk humbly' with both. Repeat 5 times.","trace":null},{"kind":"story","day":184,"week":27,"book":"Habakkuk","title":"Yet I Will Rejoice","ref":"Habakkuk 3:17-19","story":"Habakkuk said even if the fig tree has no fruit and the fields have no food, he would still rejoice in the Lord. God makes our feet like a deer's feet on high places.","n":2,"w":"feet God makes sure and steady","v":"Yet I will rejoice in the LORD, I will joy in the God of my salvation.","vr":"Habakkuk 3:18","move":"Knock-knock: Knock gently on the table with your knuckles. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Draw a fig tree or any tree. Then draw a big smile beneath it.","tg":null,"q":"What can you rejoice about even on a hard day?","prev":"Do Justly, Love Mercy","joy":"Help with a small job: fold towels or set the table."},{"kind":"story","day":185,"week":27,"book":"Zechariah","title":"Not by Might","ref":"Zechariah 4:1-6","story":"Zechariah saw a golden lampstand with two olive trees beside it, giving it oil. God said His work is done not by might or power, but by His Spirit.","n":2,"w":"olive trees beside the lampstand","v":"Not by might, nor by power, but by my spirit, saith the LORD of hosts.","vr":"Zechariah 4:6","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make the tangram candle. Put 2 green leaves on either side as the olive trees.","tg":"candle","q":"How does God's Spirit help you?","prev":"Yet I Will Rejoice","joy":"Look out the window and name 5 things God made."},{"kind":"story","day":186,"week":27,"book":"Malachi","title":"I Change Not","ref":"Malachi 3:6-10; 4:5","story":"In the last book of the Old Testament, God says He never changes. He asks us to bring the tithe, one tenth, and He will open heaven's windows with blessings.","n":10,"w":"(a tithe is 1 out of every 10)","v":"For I am the LORD, I change not.","vr":"Malachi 3:6","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do it 10 times, for the number 10 in today's story.","craft":"Count 10 coins or buttons. Set 1 aside for God. Thank Him for the other 9.","tg":null,"q":"How has God stayed the same all through your life?","prev":"Not by Might","joy":"Say today's memory verse to someone else."},{"kind":"story","day":187,"week":27,"book":"Luke","title":"An Angel Visits Zacharias","ref":"Luke 1:5-25","story":"Old Zacharias and Elisabeth had no children. An angel told Zacharias they would have a son named John. Elisabeth hid herself for five months, full of joy.","n":5,"w":"months Elisabeth stayed at home","v":"For with God nothing shall be impossible.","vr":"Luke 1:37","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do it 5 times, for the number 5 in today's story.","craft":"Zacharias and Elisabeth were old, but God still had a plan for them! Draw a baby blanket or fold a small cloth.","tg":null,"q":"What surprises has God given you later in life?","prev":"I Change Not","joy":"Hum a hymn while you do today's craft."},{"kind":"story","day":188,"week":27,"book":"Luke","title":"The Angel Comes to Mary","ref":"Luke 1:26-38","story":"In the sixth month, the angel Gabriel came to Mary. He told her she would have a baby, the Son of God, named Jesus. Mary said yes to God.","n":6,"w":"(the sixth month)","v":"Behold the handmaid of the Lord; be it unto me according to thy word.","vr":"Luke 1:38","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 6 times, for the number 6 in today's story.","craft":"Fold your hands and say, 'Yes, Lord.' Draw an angel with big wings, or trace your hands to make wings.","tg":null,"q":"How did Mary answer the angel?","prev":"An Angel Visits Zacharias","joy":"Count your blessings on your fingers."},{"kind":"sabbath","day":189,"week":27,"title":"Sabbath Rest","v":"There remaineth therefore a rest to the people of God.","vr":"Hebrews 4:9","hymn":"Lift Up the Trumpet","review":[["Micah 6:8","And what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?"],["Habakkuk 3:18","Yet I will rejoice in the LORD, I will joy in the God of my salvation."],["Zechariah 4:6","Not by might, nor by power, but by my spirit, saith the LORD of hosts."],["Malachi 3:6","For I am the LORD, I change not."],["Luke 1:37","For with God nothing shall be impossible."],["Luke 1:38","Behold the handmaid of the Lord; be it unto me according to thy word."]],"story_titles":["Do Justly, Love Mercy","Yet I Will Rejoice","Not by Might","I Change Not","An Angel Visits Zacharias","The Angel Comes to Mary"]},{"kind":"story","day":190,"week":28,"book":"Luke","title":"No Room in the Inn","ref":"Luke 2:1-7","story":"Mary and Joseph traveled to Bethlehem. There was no room in the inn, so baby Jesus was born and laid in a manger, where animals eat.","n":2,"w":"travelers to Bethlehem: Mary and Joseph","v":"And laid him in a manger; because there was no room for them in the inn.","vr":"Luke 2:7","move":"Knee pats: Pat your knees with both hands. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make a little manger by gluing popsicle sticks into a box shape. Fill it with dry grass or straw.","tg":null,"q":"Jesus was born in a humble place. What does that tell you about Him?","prev":"The Angel Comes to Mary","joy":"Tell someone, 'I love you.'"},{"kind":"story","day":191,"week":28,"book":"Luke","title":"Angels Sing to Shepherds","ref":"Luke 2:8-20","story":"Shepherds were watching sheep at night. An angel said, 'You will find the baby wrapped in swaddling clothes, lying in a manger.' Then many angels sang praises!","n":2,"w":"signs: wrapped in cloths, lying in a manger","v":"Glory to God in the highest, and on earth peace, good will toward men.","vr":"Luke 2:14","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Sing a Christmas carol together, even if it isn't Christmas! 'Joy to the World' or 'Silent Night.'","tg":null,"q":"What is your favorite Christmas memory?","prev":"No Room in the Inn","joy":"Listen to a psalm read aloud before bed."},{"kind":"story","day":192,"week":28,"book":"Luke","title":"Old Simeon and Anna","ref":"Luke 2:25-38","story":"Old Simeon held baby Jesus in the temple and praised God. Anna, a widow about 84 years old, served God day and night. She thanked God and told everyone about Jesus!","n":null,"w":"","v":"For mine eyes have seen thy salvation.","vr":"Luke 2:30","move":"Anna's 84: clap your hands 8 times, rest, then tap your knees 4 times. Do it once more if you feel good!","craft":"Anna was about 84 and still telling people about Jesus. Call or visit someone and share something good about God.","tg":null,"q":"Anna and Simeon were old and still serving God. How can you serve God today?","prev":"Angels Sing to Shepherds","joy":"Look at a map and talk about places you have lived."},{"kind":"story","day":193,"week":28,"book":"Matthew","title":"The Wise Men's Gifts","ref":"Matthew 2:1-11","story":"Wise men from the east followed a star to find the young King. They bowed down and gave Him three gifts: gold, frankincense and myrrh.","n":3,"w":"gifts the wise men brought","v":"For we have seen his star in the east, and are come to worship him.","vr":"Matthew 2:2","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Wrap 3 small boxes in paper for the 3 gifts. What gift can you give Jesus?","tg":null,"q":"What were the 3 gifts?","prev":"Old Simeon and Anna","joy":"Wave to a neighbor or say hello to someone new.","brain":"Follow the star: trace the two stars at the same time with a finger of each hand, starting at the top dots.","trace":"star"},{"kind":"story","day":194,"week":28,"book":"Matthew","title":"Escape to Egypt","ref":"Matthew 2:13-15, 19-23","story":"An angel warned Joseph in a dream that wicked King Herod wanted to hurt Jesus. Joseph took Mary and Jesus to Egypt by night, until it was safe to come home.","n":3,"w":"people in the family: Joseph, Mary and Jesus","v":"Out of Egypt have I called my son.","vr":"Matthew 2:15","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Draw a simple map with a path from Bethlehem to Egypt. Trace the path with your finger.","tg":null,"q":"God protected Jesus' family. How has God protected yours?","prev":"The Wise Men's Gifts","joy":"Wear a favorite outfit or piece of jewelry today."},{"kind":"story","day":195,"week":28,"book":"Luke","title":"Jesus at Twelve in the Temple","ref":"Luke 2:41-52","story":"When Jesus was twelve, His family went to Jerusalem. After three days of searching, they found Him in the temple, listening and asking questions.","n":12,"w":"years old Jesus was","v":"Wist ye not that I must be about my Father's business?","vr":"Luke 2:49","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do it 12 times, for the number 12 in today's story.","craft":"Make the tangram house as the temple. What questions would you ask the teachers?","tg":"house","q":"What were you like when you were twelve?","prev":"Escape to Egypt","joy":"Name 5 people who helped you in life. Thank God for each one."},{"kind":"sabbath","day":196,"week":28,"title":"Sabbath Rest","v":"And from one sabbath to another, shall all flesh come to worship before me, saith the LORD.","vr":"Isaiah 66:23","hymn":"Redeemed, How I Love to Proclaim It","review":[["Luke 2:7","And laid him in a manger; because there was no room for them in the inn."],["Luke 2:14","Glory to God in the highest, and or 3 rounds (the number 2 from today's story).","craft":"Drink a full glass of water slowly. Thank Jesus for the living water of His love.","tg":null,"q":"Who told her whole town about Jesus?","prev":"Jesus and Nicodemus","joy":"Say the memory verses you remember from this week.","brain":"Draw water: pull an imaginary rope hand over hand, right then left, 10 pulls up from the well.","trace":null},{"kind":"story","day":206,"week":30,"book":"John","title":"Go Thy Way, Thy Son Liveth","ref":"John 4:46-54","story":"A nobleman begged Jesus to heal his dying son. Jesus said, 'Go thy way; thy son liveth.' The boy got well at the seventh hour, the very moment Jesus spoke.","n":7,"w":"(the seventh hour, when the boy was healed)","v":"Go thy way; thy son liveth.","vr":"John 4:50","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 7 times, for the number 7 in today's story.","craft":"Look at a clock together. Point to the numbers 1 through 7. Jesus heals at just the right time.","tg":null,"q":"Have you prayed for someone and seen God answer?","prev":"The Woman at the Well","joy":"Draw or color something just for fun."},{"kind":"story","day":207,"week":30,"book":"John","title":"By the Pool of Bethesda","ref":"John 5:1-9","story":"A man had been sick for 38 years, lying by a pool. On the Sabbath Jesus said, 'Rise, take up thy bed, and walk.' At once the man stood up and walked!","n":null,"w":"","v":"Rise, take up thy bed, and walk.","vr":"John 5:8","move":"Rise and walk: with your helper close by, stand up from a sturdy chair and sit down slowly 3 times. Then lift your heels 8 times (38!).","craft":"Roll up a small towel like the man's mat. Tie it with a string or ribbon.","tg":null,"q":"How long was the man sick?","prev":"Go Thy Way, Thy Son Liveth","joy":"Give away something you no longer need."},{"kind":"story","day":208,"week":30,"book":"Luke","title":"Jesus Reads on the Sabbath","ref":"Luke 4:16-21","story":"Jesus went to church in Nazareth on the Sabbath, as He always did. He stood up and read from Isaiah: 'The Spirit of the Lord is upon me... to heal the brokenhearted.'","n":null,"w":"","v":"And, as his custom was, he went into the synagogue on the sabbath day, and stood up for to read.","vr":"Luke 4:16","move":"Unroll the scroll: hold a towel at both ends and stretch your arms apart as far as is comfortable, then bring them back. 6 times.","craft":"Roll a sheet of paper around two pencils to make a scroll. Unroll it and 'read' a verse you know.","tg":null,"q":"What was Jesus' custom on the Sabbath?","prev":"By the Pool of Bethesda","joy":"Pray for your church and your pastor."},{"kind":"story","day":209,"week":30,"book":"Mark","title":"Peter's Mother-in-Law","ref":"Mark 1:29-31","story":"Peter's mother-in-law was sick with a fever. Jesus took her by the hand and lifted her up. The fever left, and she got up and served everyone!","n":null,"w":"","v":"And immediately the fever left her, and she ministered unto them.","vr":"Mark 1:31","move":"Hand up: hold your helper's hand and gently pull to sit up tall, then relax. 5 times. Then squeeze each other's hands 5 times.","craft":"Help serve a snack today: pour a drink or pass the napkins. Serving others brings joy!","tg":null,"q":"What small way can you serve someone today?","prev":"Jesus Reads on the Sabbath","joy":"Pet an animal or watch the birds for a while."},{"kind":"sabbath","day":210,"week":30,"title":"Sabbath Rest","v":"And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I am the LORD your God.","vr":"Ezekiel 20:20","hymn":"All Hail the Power of Jesus' Name","review":[["John 3:16","For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."],["John 4:14","But whosoever drinketh of the water that I shall give him shall never thirst."],["John 4:50","Go thy way; thy son liveth."],["John 5:8","Rise, take up thy bed, and walk."],["Luke 4:16","And, as his custom was, he went into the synagogue on the sabbath day, and stood up for to read."],["Mark 1:31","And immediately the fever left her, and she ministered unto them."]],"story_titles":["Jesus and Nicodemus","The Woman at the Well","Go Thy Way, Thy Son Liveth","By the Pool of Bethesda","Jesus Reads on the Sabbath","Peter's Mother-in-Law"]},{"kind":"story","day":211,"week":31,"book":"Luke","title":"The Great Catch of Fish","ref":"Luke 5:1-11","story":"Peter had fished all night and caught nothing. Jesus said, 'Let down your nets.' They caught so many fish that their nets broke, and they filled two boats!","n":2,"w":"boats filled with fish","v":"Nevertheless at thy word I will let down the net.","vr":"Luke 5:5","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make the tangram fish. Then cut paper fish and 'catch' them with a spoon or your fingers.","tg":"fish","q":"When has God blessed you after a long night of trying?","prev":"Peter's Mother-in-Law","joy":"Listen to a sermon or Bible reading.","brain":"Pull in the nets: hand over hand, pull a rope (or towel) toward you, alternating hands. 10 pulls.","trace":null,"animal":"a_bigfish"},{"kind":"story","day":212,"week":31,"book":"Matthew","title":"I Will; Be Thou Clean","ref":"Matthew 8:1-4","story":"A man with leprosy knelt before Jesus and said, 'If you will, you can make me clean.' Jesus reached out, touched him, and said, 'I will; be thou clean.'","n":null,"w":"","v":"I will; be thou clean.","vr":"Matthew 8:3","move":"Reach and touch: reach out your right hand and touch your left knee, then your left hand to your right knee. 10 times in all.","craft":"Hold hands with your helper. A gentle touch is a gift. Give someone a hug today.","tg":null,"q":"Why was it special that Jesus touched the man?","prev":"The Great Catch of Fish","joy":"Remember a time God answered prayer, and tell it."},{"kind":"story","day":213,"week":31,"book":"Mark","title":"Through the Roof","ref":"Mark 2:1-12","story":"Four friends carried a man who could not walk. The house was too crowded, so they opened the roof and let him down to Jesus! Jesus forgave him and healed him.","n":4,"w":"friends who carried the man","v":"Son, thy sins be forgiven thee.","vr":"Mark 2:5","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 4 times, for the number 4 in today's story.","craft":"Make a little mat from a paper rectangle. Tie a string to each of the 4 corners and lower it off the table edge.","tg":null,"q":"Who are friends who would carry you to Jesus?","prev":"I Will; Be Thou Clean","joy":"Sort buttons, coins or beans by color."},{"kind":"story","day":214,"week":31,"book":"Mark","title":"Stretch Forth Thine Hand","ref":"Mark 3:1-5; Matthew 12:12","story":"On the Sabbath, Jesus met a man with a withered hand. Jesus said, 'Stretch forth thine hand.' The man stretched it out, and it was healed!","n":null,"w":"","v":"Wherefore it is lawful to do well on the sabbath days.","vr":"Matthew 12:12","move":"Stretch forth: stretch one hand out in front and spread your fingers wide, then make a fist. 8 times. Then the other hand 8 times.","craft":"Trace both of your hands on paper with fingers spread wide. Thank God for your hands.","tg":null,"q":"What good things can we do on the Sabbath?","prev":"Through the Roof","joy":"Rest well tonight: sleep is God's good gift."},{"kind":"story","day":215,"week":31,"book":"Luke","title":"Jesus Chooses Twelve","ref":"Luke 6:12-16","story":"Jesus prayed all night on a mountain. In the morning He chose twelve disciples to be His special helpers.","n":12,"w":"disciples Jesus chose","v":"Ye have not chosen me, but I have chosen you.","vr":"John 15:16","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do it 12 times, for the number 12 in today's story.","craft":"Set out 12 buttons or stones. Your helper reads the 12 names while you point to each one.","tg":null,"q":"How many disciples can you name?","prev":"Stretch Forth Thine Hand","joy":"Call or send a card to someone you love."},{"kind":"story","day":216,"week":31,"book":"Matthew","title":"The Beatitudes","ref":"Matthew 5:1-12","story":"Jesus sat on a mountain and taught the people. Nine times He said 'Blessed are...' the poor in spirit, those who mourn, the meek, the merciful, the pure in heart, and more.","n":9,"w":"times Jesus said 'Blessed'","v":"Blessed are the pure in heart: for they shall see God.","vr":"Matthew 5:8","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 9 times, for the number 9 in today's story.","craft":"Make the tangram mountain. Your helper reads the 9 'Blessed' lines while you raise a finger for each.","tg":"mountain","q":"Which blessing means the most to you?","prev":"Jesus Chooses Twelve","joy":"Name 3 things you are thankful for today."},{"kind":"sabbath","day":217,"week":31,"title":"Sabbath Rest","v":"And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.","vr":"Genesis 2:3","hymn":"Abide with Me","review":[["Luke 5:5","Nevertheless at thy word I will let down the net."],["Matthew 8:3","I will; be thou clean."],["Mark 2:5","Son, thy sins be forgiven thee."],["Matthew 12:12","Wherefore it is lawful to do well on the sabbath days."],["John 15:16","Ye have not chosen me, but I have chosen you."],["Matthew 5:8","Blessed are the pure in heart: for they shall see God."]],"story_titles":["The Great Catch of Fish","I Will; Be Thou Clean","Through the Roof","Stretch Forth Thine Hand","Jesus Chooses Twelve","The Beatitudes"]},{"kind":"story","day":218,"week":32,"book":"Matthew","title":"Seek Ye First","ref":"Matthew 6:25-34","story":"Jesus said not to worry. The birds do not sow, reap or gather into barns, and God feeds them. Look at the lilies! God dresses them more beautifully than King Solomon.","n":3,"w":"things birds do not do: sow, reap, gather","v":"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.","vr":"Matthew 6:33","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Pick a flower or look at a flower picture. Count its petals. God cares for every detail!","tg":null,"q":"What worry can you give to God today?","prev":"The Beatitudes","joy":"Sing your favorite hymn, all the way through.","animal":"a_sparrow"},{"kind":"story","day":219,"week":32,"book":"Matthew","title":"The Lord's Prayer","ref":"Matthew 6:9-13","story":"The disciples asked Jesus to teach them to pray. He taught them the prayer we call the Lord's Prayer, which begins 'Our Father which art in heaven.'","n":null,"w":"","v":"Our Father which art in heaven, Hallowed be thy name.","vr":"Matthew 6:9","move":"Praying hands: press your palms together firmly and count to 5, then relax. 5 times. Then spread your fingers and stretch them.","craft":"Say the whole Lord's Prayer slowly together. Many people remember it from childhood!","tg":null,"q":"Who taught you to pray?","prev":"Seek Ye First","joy":"Look at an old photo and tell the story behind it.","brain":"Prayer taps: say the Lord's Prayer slowly, tapping your right knee and left knee in turn on each line.","trace":null},{"kind":"story","day":220,"week":32,"book":"Matthew","title":"The Golden Rule","ref":"Matthew 7:12-14","story":"Jesus said to treat others the way we want to be treated. He also said there are two ways: a wide road and a narrow road that leads to life.","n":2,"w":"roads: the wide way and the narrow way","v":"Therefore all things whatsoever ye would that men should do to you, do ye even so to them.","vr":"Matthew 7:12","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Draw two roads: a wide one and a narrow one. Put a cross at the end of the narrow road.","tg":null,"q":"How can you treat someone kindly today?","prev":"The Lord's Prayer","joy":"Pray for a neighbor by name."},{"kind":"story","day":221,"week":32,"book":"Matthew","title":"The Wise and Foolish Builders","ref":"Matthew 7:24-27","story":"A wise man built his house on the rock. A foolish man built on the sand. When the rain, floods and wind came, only the house on the rock stood firm.","n":3,"w":"storms that came: rain, floods and wind","v":"The LORD is my rock, and my fortress, and my deliverer.","vr":"Psalm 18:2","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram house on top of a real stone. Then try to balance a paper house on a little pile of sand or sugar.","tg":"house","q":"What is your life built on?","prev":"The Golden Rule","joy":"Water a plant or put out seed for the birds.","brain":"Build on the rock: put your right fist on your left fist, then move the left on top, then the right, climbing upward. 10 'stones.'","trace":null},{"kind":"story","day":222,"week":32,"book":"Matthew","title":"The Centurion's Faith","ref":"Matthew 8:5-13","story":"A Roman captain over a hundred soldiers asked Jesus to heal his servant. He said, 'Just speak the word.' Jesus was amazed at his faith, and the servant was healed.","n":10,"w":"(a centurion led 100 soldiers: count 10 tens)","v":"Speak the word only, and my servant shall be healed.","vr":"Matthew 8:8","move":"Toe taps: Keep your heels on the floor and tap your toes. Do it 10 times, for the number 10 in today's story.","craft":"Line up 10 buttons like soldiers. March your fingers past them.","tg":null,"q":"Why was Jesus amazed at the soldier?","prev":"The Wise and Foolish Builders","joy":"Sit in the sunshine for 10 minutes."},{"kind":"story","day":223,"week":32,"book":"Luke","title":"Young Man, Arise","ref":"Luke 7:11-16","story":"In the town of Nain, a widow was burying her only son. Jesus felt sorry for her. He touched the coffin and said, 'Young man, I say unto thee, Arise.' The son sat up and spoke!","n":1,"w":"only son of the widow","v":"Young man, I say unto thee, Arise.","vr":"Luke 7:14","move":"Arise! With your helper close by, stand up from a sturdy chair and sit down slowly 3 times (or sit up tall and lift your arms 3 times).","craft":"Jesus gives life. Plant a seed in a small cup of dirt and watch it 'arise' in the coming days.","tg":null,"q":"Death is like a sleep for God's people. Who will Jesus wake up when He comes?","prev":"The Centurion's Faith","joy":"Drink a full glass of water, and thank God for it."},{"kind":"sabbath","day":224,"week":32,"title":"Sabbath Rest","v":"Remember the sabbath day, to keep it holy.","vr":"Exodus 20:8","hymn":"Joyful, Joyful, We Adore Thee","review":[["Matthew 6:33","But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."],["Matthew 6:9","Our Father which art in heaven, Hallowed be thy name."],["Matthew 7:12","Therefore all things whatsoever ye would that men should do to you, do ye even so to them."],["Psalm 18:2","The LORD is my rock, and my fortress, and my deliverer."],["Matthew 8:8","Speak the word only, and my servant shall be healed."],["Luke 7:14","Young man, I say unto thee, Arise."]],"story_titles":["Seek Ye First","The Lord's Prayer","The Golden Rule","The Wise and Foolish Builders","The Centurion's Faith","Young Man, Arise"]},{"kind":"story","day":225,"week":33,"book":"Mark","title":"Peace, Be Still","ref":"Mark 4:35-41","story":"Jesus was asleep on a pillow in the boat when a great storm came. The disciples were afraid. Jesus stood up and said to the wind and waves, 'Peace, be still.' All was calm.","n":null,"w":"","v":"Peace, be still.","vr":"Mark 4:39","move":"Row the boat: hold your hands together in front and make a slow rowing motion, pulling back toward your chest. 10 times. Then hold still and breathe.","craft":"Make the tangram boat. Add a popsicle stick for the mast and two cotton swabs (Q-tips) for oars.","tg":"boat","q":"What storm in your life do you need Jesus to calm?","prev":"Young Man, Arise","joy":"Give someone a kind compliment.","brain":"Calm the sea: trace the two waves with a finger of each hand, then slowly trace a flat, still line across the bottom. Breathe out slowly.","trace":"waves"},{"kind":"story","day":226,"week":33,"book":"Mark","title":"Go Home and Tell","ref":"Mark 5:1-20","story":"Jesus freed a man from many evil spirits. The man wanted to go with Jesus, but Jesus said, 'Go home to thy friends and tell them.' He told his story in all ten cities of the Decapolis.","n":10,"w":"cities in the Decapolis","v":"Go home to thy friends, and tell them how great things the Lord hath done for thee.","vr":"Mark 5:19","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 10 times, for the number 10 in today's story.","craft":"Write or record a short 'thank-you' message about what God has done for you, and send it to a friend.","tg":null,"q":"What great thing has the Lord done for you?","prev":"Peace, Be Still","joy":"Tell your helper about a happy day from your childhood."},{"kind":"story","day":227,"week":33,"book":"Mark","title":"Jairus' Daughter","ref":"Mark 5:22-24, 35-43","story":"Jairus' twelve-year-old daughter died. Jesus said, 'Be not afraid, only believe.' He took her hand and said, 'Little girl, arise.' She got up and walked!","n":12,"w":"years old Jairus' daughter was","v":"Be not afraid, only believe.","vr":"Mark 5:36","move":"Hand claps: Clap your hands together, nice and steady. Do it 12 times, for the number 12 in today's story.","craft":"Jesus said she was only sleeping. Lay a doll or stuffed animal down, then gently sit it up.","tg":null,"q":"How old was the girl?","prev":"Go Home and Tell","joy":"Listen to some beautiful music."},{"kind":"story","day":228,"week":33,"book":"Mark","title":"She Touched His Hem","ref":"Mark 5:25-34","story":"A woman had been sick for twelve years. In the crowd she reached out and touched the hem of Jesus' clothes, and she was healed. Jesus called her 'Daughter.'","n":null,"w":"","v":"Daughter, thy faith hath made thee whole; go in peace.","vr":"Mark 5:34","move":"Reach for the hem: sit tall, then slowly reach both hands down toward your shins, then sit back up. 5 times.","craft":"Feel the hem of your shirt or a blanket. Run your fingers along the edge. Reach out to Jesus in prayer.","tg":null,"q":"What did Jesus call the woman?","prev":"Jairus' Daughter","joy":"Smell a flower, a spice, or a piece of fresh fruit."},{"kind":"story","day":229,"week":33,"book":"John","title":"Five Loaves and Two Fish","ref":"John 6:5-13, 35","story":"Five thousand men were hungry. A boy shared his five loaves and two fish. Jesus blessed them, fed everyone, and there were twelve baskets left over!","n":5,"w":"loaves the boy shared (and 2 fish)","v":"I am the bread of life: he that cometh to me shall never hunger.","vr":"John 6:35","move":"5 and 2: lift both arms up 5 times (for the loaves), then clap 2 times (for the fish). Do it twice.","craft":"Make the tangram fish (twice if you can!). Put 5 small crackers or bread pieces beside it.","tg":"fish","q":"How many baskets were left over?","prev":"She Touched His Hem","joy":"Teach your helper something you know how to do.","brain":"5 and 2: show 5 fingers on your right hand and 2 on your left. Now switch: 2 on the right and 5 on the left. Switch 10 times.","trace":null,"animal":"a_fish"},{"kind":"story","day":230,"week":33,"book":"Matthew","title":"Walking on the Water","ref":"Matthew 14:22-33","story":"In the fourth watch of the night, Jesus came walking on the water. He said, 'Be of good cheer; it is I.' Peter walked toward Him, but began to sink when he looked at the waves.","n":4,"w":"(the fourth watch of the night)","v":"Be of good cheer; it is I; be not afraid.","vr":"Matthew 14:27","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 4 times, for the number 4 in today's story.","craft":"Make the tangram boat. Put a stick figure beside it 'walking on the water.'","tg":"boat","q":"What happened when Peter looked at the waves?","prev":"Five Loaves and Two Fish","joy":"Hold hands with your helper and pray together.","brain":"Cross-over walk: touch right hand to left knee, then left hand to right knee, 10 'steps' toward Jesus.","trace":null},{"kind":"sabbath","day":231,"week":33,"title":"Sabbath Rest","v":"The sabbath was made for man, and not man for the sabbath.","vr":"Mark 2:27","hymn":"Crown Him with Many Crowns","review":[["Mark 4:39","Peace, be still."],["Mark 5:19","Go home to thy friends, and tell them how great things the Lord hath done for thee."],["Mark 5:36","Be not afraid, only believe."],["Mark 5:34","Daughter, thy faith hath made thee whole; go in peace."],["John 6:35","I am the bread of life: he that cometh to me shall never hunger."],["Matthew 14:27","Be of good cheer; it is I; be not afraid."]],"story_titles":["Peace, Be Still","Go Home and Tell","Jairus' Daughter","She Touched His Hem","Five Loaves and Two Fish","Walking on the Water"]},{"kind":"story","day":232,"week":34,"book":"Matthew","title":"Seven Loaves","ref":"Matthew 15:32-38","story":"Another time, four thousand people were with Jesus for three days. Jesus had compassion. He fed them with seven loaves and a few fish, and seven baskets were left over.","n":7,"w":"loaves (and 7 baskets left over)","v":"I have compassion on the multitude.","vr":"Matthew 15:32","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do it 7 times, for the number 7 in today's story.","craft":"Line up 7 baskets or bowls. Put a cracker or piece of fruit in each one.","tg":null,"q":"How does Jesus show compassion to you?","prev":"Walking on the Water","joy":"Step outside and take 5 deep breaths of fresh air."},{"kind":"story","day":233,"week":34,"book":"Matthew","title":"Thou Art the Christ","ref":"Matthew 16:13-18","story":"Jesus asked, 'Who do people say I am?' They gave four answers: John the Baptist, Elijah, Jeremiah, or a prophet. Peter said, 'Thou art the Christ, the Son of the living God.'","n":4,"w":"answers people gave","v":"Thou art the Christ, the Son of the living God.","vr":"Matthew 16:16","move":"Knock-knock: Knock gently on the table with your knuckles. Do it 4 times, for the number 4 in today's story.","craft":"Hold a strong rock. Jesus is the Rock our faith stands on.","tg":null,"q":"Who do YOU say Jesus is?","prev":"Seven Loaves","joy":"Make a list of people to pray for this week."},{"kind":"story","day":234,"week":34,"book":"Matthew","title":"On the Mountain of Glory","ref":"Matthew 17:1-8","story":"Jesus took three disciples up a high mountain. His face shone like the sun. Moses (raised from the dead) and Elijah (taken to heaven) talked with Him. Then they saw Jesus only.","n":3,"w":"disciples on the mountain: Peter, James, John","v":"They saw no man, save Jesus only.","vr":"Matthew 17:8","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram mountain. Put a bright yellow paper circle on top for Jesus' shining glory.","tg":"mountain","q":"Moses and Elijah show two groups who will go to heaven. Who are they?","prev":"Thou Art the Christ","joy":"Share a favorite family recipe."},{"kind":"story","day":235,"week":34,"book":"Mark","title":"Jesus Loves the Children","ref":"Mark 10:13-16","story":"Parents brought little children to Jesus. The disciples tried to send them away, but Jesus said, 'Let them come.' He took them up in His arms and blessed them.","n":2,"w":"arms Jesus held the children with","v":"Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God.","vr":"Mark 10:14","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Look at photos of your children or grandchildren. Pray a blessing over each one.","tg":null,"q":"Sing 'Jesus Loves Me' together!","prev":"On the Mountain of Glory","joy":"Tell a funny story and laugh together."},{"kind":"story","day":236,"week":34,"book":"Matthew","title":"Seventy Times Seven","ref":"Matthew 18:21-22","story":"Peter asked, 'Should I forgive my brother seven times?' Jesus said, 'Not seven times, but seventy times seven!' That means always keep forgiving.","n":7,"w":"times Peter thought was enough","v":"I say not unto thee, Until seven times: but, Until seventy times seven.","vr":"Matthew 18:22","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do it 7 times, for the number 7 in today's story.","craft":"Write the name of someone who hurt you on a slip of paper. Pray for them, then tear it up and throw it away.","tg":null,"q":"Why is forgiving good for our own hearts too?","prev":"Jesus Loves the Children","joy":"Say a blessing for a grandchild or young friend."},{"kind":"story","day":237,"week":34,"book":"Luke","title":"The Good Samaritan","ref":"Luke 10:25-37","story":"A man was robbed and left hurt. A priest and a Levite passed by. Then a Samaritan stopped, bandaged him, took him to an inn, and paid two pence for his care.","n":3,"w":"people who came by: priest, Levite, Samaritan","v":"Thou shalt love the Lord thy God with all thy heart... and thy neighbour as thyself.","vr":"Luke 10:27","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Wrap a bandage or strip of cloth around a stuffed animal's leg. Practice gentle wrapping.","tg":null,"q":"Who is your neighbor?","prev":"Seventy Times Seven","joy":"Help with a small job: fold towels or set the table."},{"kind":"sabbath","day":238,"week":34,"title":"Sabbath Rest","v":"Be still, and know that I am God.","vr":"Psalm 46:10","hymn":"Come, Thou Fount of Every Blessing","review":[["Matthew 15:32","I have compassion on the multitude."],["Matthew 16:16","Thou art the Christ, the Son of the living God."],["Matthew 17:8","They saw no man, save Jesus only."],["Mark 10:14","Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God."],["Matthew 18:22","I say not unto thee, Until seven times: but, Until seventy times seven."],["Luke 10:27","Thou shalt love the Lord thy God with all thy heart... and thy neighbour as thyself."]],"story_titles":["Seven Loaves","Thou Art the Christ","On the Mountain of Glory","Jesus Loves the Children","Seventy Times Seven","The Good Samaritan"]},{"kind":"story","day":239,"week":35,"book":"Luke","title":"Mary and Martha","ref":"Luke 10:38-42","story":"Martha was busy in the kitchen. Her sister Mary sat at Jesus' feet and listened. Jesus said Mary had chosen the good part: time with Him.","n":2,"w":"sisters: Mary and Martha","v":"But one thing is needful: and Mary hath chosen that good part.","vr":"Luke 10:42","move":"Knee pats: Pat your knees with both hands. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Sit quietly and listen to your helper read a favorite psalm. Just rest and enjoy it.","tg":null,"q":"Are you more like Mary or Martha?","prev":"The Good Samaritan","joy":"Look out the window and name 5 things God made."},{"kind":"story","day":240,"week":35,"book":"Luke","title":"The Woman Stands Straight","ref":"Luke 13:10-17","story":"On the Sabbath, Jesus saw a woman who had been bent over for eighteen years. He said, 'Woman, thou art loosed,' and she stood up straight and praised God!","n":18,"w":"years the woman was bent over","v":"Woman, thou art loosed from thine infirmity.","vr":"Luke 13:12","move":"Sit up tall: sit straight, pull your shoulders back gently, and lift your chin. Hold for a count of 5 and relax. Do this 3 times, then count to 18 while sitting tall.","craft":"Look in a mirror and sit up as straight and tall as you can. Smile and say 'Praise God!'","tg":null,"q":"How can good posture help us feel better?","prev":"Mary and Martha","joy":"Say today's memory verse to someone else."},{"kind":"story","day":241,"week":35,"book":"Luke","title":"The Lost Sheep","ref":"Luke 15:3-7","story":"A shepherd had a hundred sheep. One was lost! He left the ninety-nine and searched until he found it. He carried it home on his shoulders, rejoicing.","n":10,"w":"cotton-ball sheep to count (the shepherd had 100!)","v":"Rejoice with me; for I have found my sheep which was lost.","vr":"Luke 15:6","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 10 times, for the number 10 in today's story.","craft":"Make 10 cotton-ball sheep. Your helper hides one. Find it and rejoice!","tg":null,"q":"How does Jesus find us when we are lost?","prev":"The Woman Stands Straight","joy":"Hum a hymn while you do today's craft."},{"kind":"story","day":242,"week":35,"book":"Luke","title":"The Lost Coin","ref":"Luke 15:8-10","story":"A woman had ten silver coins and lost one. She lit a candle, swept the house, and searched until she found it. Then she called her friends to celebrate.","n":10,"w":"silver coins the woman had","v":"There is joy in the presence of the angels of God over one sinner that repenteth.","vr":"Luke 15:10","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do it 10 times, for the number 10 in today's story.","craft":"Count out 10 coins. Your helper hides one under a cup. Find it!","tg":null,"q":"What did the woman do when she found it?","prev":"The Lost Sheep","joy":"Count your blessings on your fingers."},{"kind":"story","day":243,"week":35,"book":"Luke","title":"The Prodigal Son","ref":"Luke 15:11-24","story":"A father had two sons. The younger took his money and wasted it far away. When he came home, his father ran to him, hugged him, and gave a big party!","n":2,"w":"sons of the father","v":"But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.","vr":"Luke 15:20","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Draw a road with a small figure far away and a bigger figure running with open arms.","tg":null,"q":"How does it feel to be welcomed home?","prev":"The Lost Coin","joy":"Tell someone, 'I love you.'","brain":"Run and embrace: open your arms wide, then hug yourself with the right arm on top. Open again and hug with the left arm on top. 6 times.","trace":null,"animal":"a_pig"},{"kind":"story","day":244,"week":35,"book":"Matthew","title":"The Sower","ref":"Matthew 13:3-9, 18-23","story":"A farmer scattered seed. Some fell on the path, some on rocks, some among thorns, and some on good ground, where it grew a big harvest.","n":4,"w":"kinds of ground","v":"But other fell into good ground, and brought forth fruit.","vr":"Matthew 13:8","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do it 4 times, for the number 4 in today's story.","craft":"Plant a few seeds (beans work well) in a cup of soil. Water it each day and watch for growth!","tg":null,"q":"What kind of ground do you want your heart to be?","prev":"The Prodigal Son","joy":"Listen to a psalm read aloud before bed."},{"kind":"sabbath","day":245,"week":35,"title":"Sabbath Rest","v":"Come unto me, all ye that labour and are heavy laden, and I will give you rest.","vr":"Matthew 11:28","hymn":"Just As I Am","review":[["Luke 10:42","But one thing is needful: and Mary hath chosen that good part."],["Luke 13:12","Woman, thou art loosed from thine infirmity."],["Luke 15:6","Rejoice with me; for I have found my sheep which was lost."],["Luke 15:10","There is joy in the presence of the angels of God over one sinner that repenteth."],["Luke 15:20","But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."],["Matthew 13:8","But other fell into good ground, and brought forth fruit."]],"story_titles":["Mary and Martha","The Woman Stands Straight","The Lost Sheep","The Lost Coin","The Prodigal Son","The Sower"]},{"kind":"story","day":246,"week":36,"book":"Matthew","title":"The Mustard Seed","ref":"Matthew 13:31-32; 17:20","story":"The mustard seed is tiny, but it grows into a big plant where birds can rest. A little faith in a big God can do great things.","n":null,"w":"","v":"If ye have faith as a grain of mustard seed... nothing shall be impossible unto you.","vr":"Matthew 17:20","move":"Seed to tree: curl up small in your chair, arms hugging yourself, then slowly stretch up tall with arms high like a tree. 5 times.","craft":"Look at a tiny seed (mustard, poppy or sesame). Then make the tangram tree it can become.","tg":"tree","q":"What small thing grew into something big in your life?","prev":"The Sower","joy":"Look at a map and talk about places you have lived."},{"kind":"story","day":247,"week":36,"book":"Matthew","title":"The Hidden Treasure","ref":"Matthew 13:44-46; 6:21","story":"Jesus told two stories: a man found treasure in a field, and a merchant found a pearl of great price. Each sold everything to get it. God's kingdom is worth everything!","n":2,"w":"stories: the hidden treasure and the pearl","v":"For where your treasure is, there will your heart be also.","vr":"Matthew 6:21","move":"Toe taps: Keep your heels on the floor and tap your toes. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Hide a button 'pearl' in a bowl of rice or dry beans. Dig with your fingers to find it.","tg":null,"q":"What is your greatest treasure?","prev":"The Mustard Seed","joy":"Wave to a neighbor or say hello to someone new."},{"kind":"story","day":248,"week":36,"book":"John","title":"The Good Shepherd","ref":"John 10:1-16, 27","story":"Jesus said, 'I am the good shepherd.' He knows each sheep by name, and they know His voice. The good shepherd gives His life for the sheep.","n":null,"w":"","v":"I am the good shepherd: the good shepherd giveth his life for the sheep.","vr":"John 10:11","move":"Shepherd's walk: with your helper beside you, take 8 slow steps (or march 8 times seated), swinging your arms gently.","craft":"Make a shepherd's crook by bending a pipe cleaner. Put it next to your cotton-ball sheep.","tg":null,"q":"Jesus knows your name. How does that make you feel?","prev":"The Hidden Treasure","joy":"Wear a favorite outfit or piece of jewelry today."},{"kind":"story","day":249,"week":36,"book":"John","title":"The Blind Man Sees","ref":"John 9:1-25","story":"Jesus made clay, put it on a blind man's eyes, and told him to wash in the pool of Siloam. It was the Sabbath. He washed and came back seeing!","n":null,"w":"","v":"One thing I know, that, whereas I was blind, now I see.","vr":"John 9:25","move":"Eye care: rub your palms together until warm and gently cup them over your closed eyes. Count to 10. Do this 3 times.","craft":"Mix a little dirt and water into mud, or use play dough. Then wash your hands in a bowl of water.","tg":null,"q":"What has Jesus helped you see more clearly?","prev":"The Good Shepherd","joy":"Name 5 people who helped you in life. Thank God for each one."},{"kind":"story","day":250,"week":36,"book":"Luke","title":"The One Who Came Back","ref":"Luke 17:11-19","story":"Ten lepers cried to Jesus, and He healed them all. But only one came back to say thank you. Jesus asked, 'Where are the nine?'","n":10,"w":"lepers healed (only 1 came back)","v":"Were there not ten cleansed? but where are the nine?","vr":"Luke 17:17","move":"Tap your feet 10 times for the 10 lepers. Then give 1 BIG clap for the one who said thank you!","craft":"Count 10 things you are thankful for on your fingers. Say 'Thank You, Jesus!' after each one.","tg":null,"q":"How many lepers came back to say thank you?","prev":"The Blind Man Sees","joy":"Plan something to look forward to this week.","brain":"10 then 1: tap each finger across both hands, left pinky to right pinky, counting to 10. Then hold up 1 finger and say 'Thank You, Jesus!'","trace":null},{"kind":"story","day":251,"week":36,"book":"Mark","title":"Blind Bartimaeus","ref":"Mark 10:46-52","story":"Blind Bartimaeus sat by the road. He heard Jesus was coming and cried out, 'Jesus, have mercy on me!' Jesus asked what he wanted. 'Lord, that I might receive my sight.'","n":null,"w":"","v":"Lord, that I might receive my sight.","vr":"Mark 10:51","move":"Eye exercise: hold a finger at arm's length. Slowly bring it toward your nose while watching it, then move it back out. 5 times.","craft":"Close your eyes and identify 3 objects by touch: a spoon, a stone, a cotton ball.","tg":null,"q":"What would you ask Jesus for today?","prev":"The One Who Came Back","joy":"Brush your hair and smile in the mirror."},{"kind":"sabbath","day":252,"week":36,"title":"Sabbath Rest","v":"This is the day which the LORD hath made; we will rejoice and be glad in it.","vr":"Psalm 118:24","hymn":"Take My Life and Let It Be","review":[["Matthew 17:20","If ye have faith as a grain of mustard seed... nothing shall be impossible unto you."],["Matthew 6:21","For where your treasure is, there will your heart be also."],["John 10:11","I am the good shepherd: the good shepherd giveth his life for the sheep."],["John 9:25","
