<!doctype html>
<html lang="en">

<title>Walking with God Every Day</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#14202E; --muted:#475667; --line:#C6D1DC;
  --blue:#1F4E79; --blue-soft:#E3ECF5; --gold:#8A6300; --gold-soft:#FFF1CC; --gold-line:#D4A017;
  --green:#2B662E; --green-soft:#E3F1E3; --red:#A8261F; --purple:#6A1B9A;
  --teal:#00695C; --teal-soft:#E3F3F1; --teal-line:#8CC9C0;
  --target:#D9E0E7; --target-line:#7E8C9B; --tray:#E4E9EF;
  --fs:21px;
  --sans:"Atkinson Hyperlegible", "Verdana", "Segoe UI", system-ui, sans-serif;
  --serif:"Libre Baskerville", "Georgia", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151C; --surface:#18212B; --ink:#EEF2F6; --muted:#A8B5C3; --line:#2E3B49;
    --blue:#8FBBE8; --blue-soft:#1C2B3B; --gold:#E9C15A; --gold-soft:#2A2414; --gold-line:#8F6D12;
    --green:#8BCB8E; --green-soft:#1A2A1C; --red:#F29A92; --purple:#D1A0EA;
    --target:#2A3542; --target-line:#8796A6; --tray:#141B23;
    --teal:#7FD3C6; --teal-soft:#142A27; --teal-line:#2F5F58;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151C; --surface:#18212B; --ink:#EEF2F6; --muted:#A8B5C3; --line:#2E3B49;
  --blue:#8FBBE8; --blue-soft:#1C2B3B; --gold:#E9C15A; --gold-soft:#2A2414; --gold-line:#8F6D12;
  --green:#8BCB8E; --green-soft:#1A2A1C; --red:#F29A92; --purple:#D1A0EA;
  --target:#2A3542; --target-line:#8796A6; --tray:#141B23;
    --teal:#7FD3C6; --teal-soft:#142A27; --teal-line:#2F5F58;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.5;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:12px;border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:16px}
.brand{font-family:var(--serif);font-weight:700;color:var(--blue);font-size:1.05em;margin-right:auto;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.62em;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-wrap:wrap;gap:8px}
.nbtn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;min-height:52px;font-weight:700;font-size:.85em}
.nbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.sizer{display:flex;gap:6px}
.sizer button{min-width:52px;min-height:52px;border:2px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700}

/* day */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px}
.eyebrow{font-size:.72em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-size:2em;line-height:1.15;margin:.15em 0 .35em;color:var(--blue);text-wrap:balance}
.sabbath h1{color:var(--gold)}
.stepper{display:flex;gap:10px;margin-left:auto}
.stepper button{min-height:56px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:16px}
.label{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.label b{font-size:.74em;letter-spacing:.12em;text-transform:uppercase}
.lb-brain{color:var(--teal)}
.brainpanel{background:var(--teal-soft);border-color:var(--teal-line)}
.trace{margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px}
.trace svg{display:block;width:100%;height:auto;max-height:58vh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.tracestat{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px;min-height:2em}
.chipbar{display:inline-flex;align-items:center;gap:8px;font-size:.8em}
.chipbar b{color:var(--c)}
.track{display:inline-block;width:110px;height:14px;border-radius:7px;background:var(--bg);border:2px solid var(--line);overflow:hidden;vertical-align:middle}
.track i{display:block;height:100%;background:var(--c);transition:width .15s}
.tmsg{font-weight:700;color:var(--teal)}
.tracehelp{margin:.5em 0 0;color:var(--muted);font-size:.85em}
.trace .tools{margin-top:8px}
.tracegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.lb-read{color:var(--blue)} .lb-move{color:var(--green)} .lb-make{color:var(--purple)} .lb-talk{color:var(--blue)} .lb-joy{color:var(--red)} .lb-verse{color:var(--gold)}
.ref{color:var(--muted);font-style:italic}
.speak{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 16px;min-height:48px;font-weight:700;font-size:.8em}
.speak svg{width:22px;height:22px}
.verse{background:var(--gold-soft);border:3px solid var(--gold-line)}
.vtext{font-family:var(--serif);font-weight:700;font-size:1.45em;line-height:1.55;margin:.2em 0 .4em}
.vtext .w{display:inline-block;margin-right:.28em;border-radius:6px}
.vtext .w.hid{color:transparent;background:repeating-linear-gradient(90deg,var(--gold-line) 0 100%);background-size:100% 3px;background-repeat:no-repeat;background-position:0 85%;cursor:pointer}
.vtext .w.first{color:transparent;position:relative;cursor:pointer}
.vtext .w.first::before{content:attr(data-f);position:absolute;left:0;color:var(--ink)}
.vref{text-align:right;font-weight:700;color:var(--muted)}
.vtools{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.pill{border:2px solid var(--gold-line);background:var(--surface);border-radius:999px;padding:6px 16px;min-height:48px;font-weight:700;font-size:.8em}
.move{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.bignum{background:var(--green-soft);color:var(--green);font-family:var(--serif);font-weight:700;font-size:3.4em;line-height:1;border-radius:16px;min-width:2.2em;padding:.25em .3em;text-align:center}
.what{font-weight:700;margin-bottom:6px}
.counter{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:14px}
.tap{background:var(--green);color:var(--surface);border:0;border-radius:18px;min-height:72px;padding:0 28px;font-size:1.1em;font-weight:700}
.count{font-size:1.6em;font-weight:700;font-variant-numeric:tabular-nums;color:var(--green)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:14px;min-height:52px;padding:0 16px;font-weight:700;font-size:.85em}
.make{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.make .thumb{width:170px;max-width:100%}
.build{margin-top:12px;background:var(--purple);color:var(--surface);border:0;border-radius:16px;min-height:60px;padding:0 22px;font-weight:700}
.checks{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.chk{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:60px;padding:0 18px;font-weight:700}
.chk .bx{width:28px;height:28px;border:3px solid var(--blue);border-radius:6px;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}
.chk[aria-pressed="true"] .bx::after{content:"";width:14px;height:8px;border-left:4px solid var(--blue);border-bottom:4px solid var(--blue);transform:rotate(-45deg) translate(1px,-2px)}
.done-banner{margin-top:16px;padding:14px 18px;border-radius:14px;background:var(--green-soft);color:var(--green);font-weight:700}
.review p{margin:.35em 0}
.review .r{color:var(--blue);font-weight:700}
.cert input{font:inherit;font-size:1.2em;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}

/* calendar */
.weeks{display:grid;gap:10px;margin-top:18px}
.week{display:grid;grid-template-columns:5.2em repeat(7,1fr);gap:6px;align-items:center}
.week .wl{font-size:.7em;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dcell{aspect-ratio:1;max-width:100%;border:2px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:.72em;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.dcell.sab{border-color:var(--gold-line);color:var(--gold)}
.dcell.part{background:var(--blue-soft)}
.dcell.full{background:var(--blue);color:var(--surface);border-color:var(--blue)}
.dcell.cur{outline:3px solid var(--gold-line);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.8em;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:inline-block}

/* studio */
.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.figbtn{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:grid;gap:4px;justify-items:center;font-weight:700;font-size:.85em}
.figbtn svg{width:100%;height:96px}
.figday{font-size:.8em;font-weight:700;color:var(--purple)}
.gridhead{font-family:var(--serif);color:var(--blue);font-size:1.2em;margin:1.1em 0 .1em}
#studio-top{scroll-margin-top:140px}
.animalrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.animalrow svg{width:120px;height:90px}
.figbtn[aria-pressed="true"]{border-color:var(--purple);box-shadow:0 0 0 3px var(--purple) inset}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:18px;margin-top:14px;overflow:hidden;touch-action:none}
.stage svg{display:block;width:100%;height:auto;max-height:72vh;user-select:none;-webkit-user-select:none}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.tool{border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:60px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.tool svg{width:24px;height:24px}
.acctgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.field{display:block;width:100%;font:inherit;font-size:1.1em;padding:10px 12px;margin:.25em 0 .7em;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.field.code{letter-spacing:.2em;font-weight:700;max-width:10em}
.tool.primary{background:var(--purple);color:var(--surface);border-color:var(--purple)}
.tool[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--surface);min-height:56px;padding:0 14px;font-weight:700;font-size:.8em}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
.status{margin-top:12px;font-weight:700;min-height:1.6em}
.status.win{color:var(--green);font-size:1.25em}
.piece{cursor:grab;stroke:#111;stroke-width:.07;stroke-linejoin:round}
.piece.sel{stroke:#000;stroke-width:.16}
.piece.locked{cursor:default}
.slot{stroke:var(--target-line);stroke-width:.05;stroke-dasharray:.18 .12}
.helper h2{font-family:var(--serif);color:var(--blue);font-size:1.3em;margin:.2em 0 .4em}
.helper ul{padding-left:1.1em;margin:.3em 0}
.helper li{margin:.35em 0}
@media (max-width:640px){
  :root{--fs:19px}
  .move{grid-template-columns:1fr}
  .bignum{justify-self:start}
  .make{grid-template-columns:1fr}
  .make .thumb{width:140px}
  .week{grid-template-columns:3.4em repeat(7,1fr);gap:4px}
  .stepper{margin-left:0;width:100%}
  .stepper button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
</style>

</head>
<body>

    <div class="brand">Walking with God<small>365 DAYS · GENESIS TO REVELATION · KJV</small></div>

<script>
const DATA = {"pages":[{"kind":"story","day":1,"week":1,"book":"Genesis","title":"God Makes Light","ref":"Genesis 1:1-5","story":"In the beginning the world was dark and empty. God spoke, and light shone out. God saw the light, and it was good. That was the first day.","n":1,"w":"the first day, when God made light","v":"And God said, Let there be light: and there was light.","vr":"Genesis 1:3","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do 1, rest, and repeat for 3 rounds (the number 1 from today's story).","craft":"Open the curtains and sit in the sunshine for a few minutes. Hold up a flashlight or a candle (unlit) and talk about light.","tg":null,"q":"What did God make on the very first day?","prev":null,"joy":"Call or send a card to someone you love.","brain":"Light and dark: hold both hands up. Open the right hand (light) while the left makes a fist (dark). Now switch. Go slowly at first, then a little faster. 10 switches.","trace":null},{"kind":"story","day":2,"week":1,"book":"Genesis","title":"Sky and Waters","ref":"Genesis 1:6-8","story":"On the second day God made the sky, like a great blue roof, and separated the waters above from the waters below.","n":2,"w":"the second day, when God made the sky","v":"In the beginning God created the heaven and the earth.","vr":"Genesis 1:1","move":"Toe taps: Keep your heels on the floor and tap your toes. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Glue a few cotton balls onto blue paper to make clouds in the sky. Look out the window: are there clouds today?","tg":null,"q":"What color is the sky today?","prev":"God Makes Light","joy":"Name 3 things you are thankful for today.","brain":"Waves on both sides: with a finger of each hand, trace the two wavy lines at the same time, starting at the dots. Then try it in the air with your eyes closed.","trace":"waves"},{"kind":"story","day":3,"week":1,"book":"Genesis","title":"Land, Trees and Flowers","ref":"Genesis 1:9-13","story":"On the third day God gathered the seas together so dry land appeared. Then He filled the land with grass, trees, fruit and flowers.","n":3,"w":"the third day, when God made plants","v":"The earth is the LORD'S, and the fulness thereof.","vr":"Psalm 24:1","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Go outside (or look through a window) and gather 3 different leaves. Feel them, smell them, and lay them in a row. Or make the tangram tree.","tg":"tree","q":"What is your favorite tree or flower?","prev":"Sky and Waters","joy":"Sing your favorite hymn, all the way through."},{"kind":"story","day":4,"week":1,"book":"Genesis","title":"Sun, Moon and Stars","ref":"Genesis 1:14-19","story":"On the fourth day God put the sun in the sky to rule the day, and the moon and the stars to rule the night.","n":4,"w":"the fourth day, when God made the sun, moon and stars","v":"The heavens declare the glory of God; and the firmament sheweth his handywork.","vr":"Psalm 19:1","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do it 4 times, for the number 4 in today's story.","craft":"Cut a big yellow circle for the sun and a white half-moon from paper. Tonight, look out the window at the moon or stars together.","tg":null,"q":"Do you remember a beautiful sunset or starry night from long ago?","prev":"Land, Trees and Flowers","joy":"Look at an old photo and tell the story behind it.","brain":"Sun circles: draw big circles in the air with both hands at once, the right hand going one way and the left hand going the other way. 5 circles, then switch directions.","trace":"circles"},{"kind":"story","day":5,"week":1,"book":"Genesis","title":"Fish and Birds","ref":"Genesis 1:20-23","story":"On the fifth day God filled the seas with fish and the sky with birds. He blessed them and told them to multiply.","n":5,"w":"the fifth day, when God made fish and birds","v":"Let every thing that hath breath praise the LORD.","vr":"Psalm 150:6","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 5 times, for the number 5 in today's story.","craft":"Make the tangram fish. Then sit by a window and count the birds you can see or hear.","tg":"fish","q":"What birds come to your yard or window?","prev":"Sun, Moon and Stars","joy":"Pray for a neighbor by name.","brain":"Double doodle: hold a crayon in each hand and draw two fish at the same time, facing each other like a mirror. They don't need to be perfect!","trace":null,"animal":"a_swan"},{"kind":"story","day":6,"week":1,"book":"Genesis","title":"God Makes Animals and People","ref":"Genesis 1:24-31","story":"On the sixth day God made the animals. Then He made man and woman in His own image. God looked at everything He had made, and it was very good.","n":6,"w":"the sixth day, when God made people","v":"So God created man in his own image, in the image of God created he him; male and female created he them.","vr":"Genesis 1:27","move":"Hand claps: Clap your hands together, nice and steady. Do it 6 times, for the number 6 in today's story.","craft":"Trace around your hand on paper. Count your fingers. God made each one! Color the hand if you like.","tg":null,"q":"What is something wonderful about how God made your body?","prev":"Fish and Birds","joy":"Water a plant or put out seed for the birds.","brain":"Finger walk: touch each thumb to each finger, both hands together, from pointer to pinky and back. Then try the right hand starting at the pointer while the left starts at the pinky.","trace":null,"animal":"a_sittingcat"},{"kind":"sabbath","day":7,"week":1,"title":"Sabbath Rest","v":"And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.","vr":"Genesis 2:3","hymn":"Safely Through Another Week","review":[["Genesi
