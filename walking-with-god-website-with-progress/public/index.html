touch thumb to each finger, starting on the left hand (1-4) then the right (5-8), then the left again (9-12). Say each number.","trace":null},{"kind":"story","day":40,"week":6,"book":"Genesis","title":"Joseph's Colorful Coat","ref":"Genesis 37:1-4","story":"When Joseph was seventeen, his father gave him a beautiful coat of many colors. His brothers became jealous.","n":17,"w":"years old Joseph was","v":"Children, obey your parents in the Lord: for this is right.","vr":"Ephesians 6:1","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do 17 in all: 1 set of 10 with a rest between, then 7 more.","craft":"Glue strips of colored paper or fabric scraps onto a paper coat shape. Name each color as you glue it.","tg":null,"q":"What was a special piece of clothing you had when you were young?","prev":"Jacob's Twelve Sons","joy":"Take a short walk to the mailbox or porch.","brain":"Other-hand sorting: sort colored buttons or paper scraps into piles using the hand you don't usually use.","trace":null},{"kind":"story","day":41,"week":6,"book":"Genesis","title":"Joseph's Dreams","ref":"Genesis 37:5-11","story":"Joseph dreamed that the sun, the moon and eleven stars bowed down to him. His brothers did not like his dreams.","n":11,"w":"stars in Joseph's dream","v":"Trust in the LORD with all thine heart; and lean not unto thine own understanding.","vr":"Proverbs 3:5","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 11 times, for the number 11 in today's story.","craft":"Draw a sun, a moon and 11 stars on paper. Count the stars as you draw them.","tg":null,"q":"How many stars bowed down in Joseph's dream?","prev":"Joseph's Colorful Coat","joy":"Tell your helper what you want to do first in heaven.","brain":"Eye stars: keep your head still. Follow your helper's finger with your eyes as it draws a big X, then a big circle in the air.","trace":null},{"kind":"sabbath","day":42,"week":6,"title":"Sabbath Rest","v":"This is the day which the LORD hath made; we will rejoice and be glad in it.","vr":"Psalm 118:24","hymn":"It Is Well with My Soul","review":[["Genesis 28:16","Surely the LORD is in this place; and I knew it not."],["Genesis 29:20","And Jacob served seven years for Rachel; and they seemed unto him but a few days, for the love he had to her."],["Genesis 32:26","I will not let thee go, except thou bless me."],["Psalm 133:1","Behold, how good and how pleasant it is for brethren to dwell together in unity!"],["Ephesians 6:1","Children, obey your parents in the Lord: for this is right."],["Proverbs 3:5","Trust in the LORD with all thine heart; and lean not unto thine own understanding."]],"story_titles":["Jacob's Ladder","Jacob Works Seven Years","Jacob Holds On","Jacob's Twelve Sons","Joseph's Colorful Coat","Joseph's Dreams"]},{"kind":"story","day":43,"week":7,"book":"Genesis","title":"Joseph Is Sold","ref":"Genesis 37:23-28","story":"The jealous brothers threw Joseph into a pit and then sold him to traders for twenty pieces of silver. Joseph was taken to Egypt, but God was with him.","n":20,"w":"pieces of silver Joseph was sold for","v":"And we know that all things work together for good to them that love God.","vr":"Romans 8:28","move":"Knee pats: Pat your knees with both hands. Do 20 in all: 2 sets of 10 with a rest between.","craft":"Count out 20 coins into a cup, 1 at a time. Then put 10 back. Counting helps keep the mind sharp!","tg":null,"q":"How was God with Joseph even when bad things happened?","prev":"Joseph's Dreams","joy":"Feel something new: tree bark, wool, a smooth stone."},{"kind":"story","day":44,"week":7,"book":"Genesis","title":"Joseph in Prison","ref":"Genesis 40:1-23","story":"In prison Joseph helped the king's butler and baker. The butler dreamed of a vine with three branches. Joseph said, 'In three days you will be free.'","n":3,"w":"branches on the vine in the butler's dream","v":"Do not interpretations belong to God?","vr":"Genesis 40:8","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Find a twig with 3 small branches, or draw a vine with 3 branches and add purple grape circles.","tg":null,"q":"Joseph was kind even in prison. How can we be kind when we feel sad?","prev":"Joseph Is Sold","joy":"Say the memory verses you remember from this week."},{"kind":"story","day":45,"week":7,"book":"Genesis","title":"Pharaoh's Dreams","ref":"Genesis 41:1-40","story":"Pharaoh dreamed of seven fat cows and seven thin cows. Joseph said God was warning of seven good years and seven hungry years. Pharaoh put Joseph in charge of Egypt.","n":7,"w":"fat cows (and 7 thin cows) in Pharaoh's dream","v":"It is not in me: God shall give Pharaoh an answer of peace.","vr":"Genesis 41:16","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 7 times, for the number 7 in today's story.","craft":"Make 7 'fat cows' from cotton balls and 7 'thin cows' from popsicle sticks. Which line is longer?","tg":null,"q":"Joseph saved food for the hungry years. How do you save for later?","prev":"Joseph in Prison","joy":"Draw or color something just for fun."},{"kind":"story","day":46,"week":7,"book":"Genesis","title":"Joseph Forgives","ref":"Genesis 42:3; 45:1-15","story":"Ten brothers came to Egypt to buy food. They did not know Joseph. At last Joseph said, 'I am Joseph!' He hugged them and forgave them.","n":10,"w":"brothers who first came to Egypt","v":"But as for you, ye thought evil against me; but God meant it unto good.","vr":"Genesis 50:20","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do it 10 times, for the number 10 in today's story.","craft":"Give your helper a hug or a warm handshake. Think of someone you could forgive or call.","tg":null,"q":"Why did Joseph forgive his brothers?","prev":"Pharaoh's Dreams","joy":"Give away something you no longer need.","brain":"Butterfly hug: cross your arms over your chest and tap your shoulders, left then right, slowly, 10 times. Think of someone you love.","trace":null},{"kind":"story","day":47,"week":7,"book":"Genesis","title":"Jacob Goes to Egypt","ref":"Genesis 46:1-7, 27","story":"Old Jacob was afraid to move to Egypt, but God said, 'I will go down with thee.' Seventy people from Jacob's family moved to Egypt together.","n":7,"w":"(70 people moved to Egypt: count 7 tens)","v":"I will go down with thee into Egypt.","vr":"Genesis 46:4","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do it 7 times, for the number 7 in today's story.","craft":"Draw a simple wagon or cart. Add 7 stick people in it. God goes with us wherever we go!","tg":null,"q":"God went with Jacob when he was old. How is God with you now?","prev":"Joseph Forgives","joy":"Pray for your church and your pastor."},{"kind":"story","day":48,"week":7,"book":"Genesis","title":"Grandfather's Blessing","ref":"Genesis 48:8-16","story":"Old Jacob blessed Joseph's two sons. He crossed his arms and put his hands on their heads and prayed a blessing over them.","n":2,"w":"grandsons Jacob blessed","v":"The Angel which redeemed me from all evil, bless the lads.","vr":"Genesis 48:16","move":"Crossed arms: cross your arms over your chest like Jacob, then open them wide. Do it 2 times, then 2 times more, then 2 more (6 in all).","craft":"Write or say a short blessing for each of your grandchildren or young people you love. Your helper can write it down to send.","tg":null,"q":"What blessing would you like to give your family?","prev":"Jacob Goes to Egypt","joy":"Pet an animal or watch the birds for a while."},{"kind":"sabbath","day":49,"week":7,"title":"Sabbath Rest","v":"There remaineth therefore a rest to the people of God.","vr":"Hebrews 4:9","hymn":"Great Is Thy Faithfulness","review":[["Romans 8:28","And we know that all things work together for good to them that love God."],["Genesis 40:8","Do not interpretations belong to God?"],["Genesis 41:16","It is not in me: God shall give Pharaoh an answer of peace."],["Genesis 50:20","But as for you, ye thought evil against me; but God meant it unto good."],["Genesis 46:4","I will go down with thee into Egypt."],["Genesis 48:16","The Angel which redeemed me from all evil, bless the lads."]],"story_titles":["Joseph Is Sold","Joseph in Prison","Pharaoh's Dreams","Joseph Forgives","Jacob Goes to Egypt","Grandfather's Blessing"]},{"kind":"story","day":50,"week":8,"book":"Exodus","title":"Baby Moses in a Basket","ref":"Exodus 2:1-10","story":"Moses' mother hid him for three months. Then she put him in a little basket boat in the river. The princess found him and loved him.","n":3,"w":"months Moses was hidden","v":"What time I am afraid, I will trust in thee.","vr":"Psalm 56:3","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Fold a paper boat, or make the tangram boat as Moses' basket. Place a cotton ball 'baby' inside.","tg":"boat","q":"Who took care of you when you were small?","prev":"Grandfather's Blessing","joy":"Listen to a sermon or Bible reading."},{"kind":"story","day":51,"week":8,"book":"Exodus","title":"The Burning Bush","ref":"Exodus 3:1-6","story":"Moses was keeping sheep when he saw a bush on fire that did not burn up. God called, 'Moses! Take off your shoes, for this is holy ground.'","n":2,"w":"shoes Moses took off","v":"Put off thy shoes from off thy feet, for the place whereon thou standest is holy ground.","vr":"Exodus 3:5","move":"Toe taps: Keep your heels on the floor and tap your toes. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Take off your shoes and rub your feet on a soft towel. Wiggle your toes. Thank God for your feet.","tg":null,"q":"Where is a place you feel close to God?","prev":"Baby Moses in a Basket","joy":"Remember a time God answered prayer, and tell it."},{"kind":"story","day":52,"week":8,"book":"Exodus","title":"Moses' Three Signs","ref":"Exodus 4:1-12; 7:7","story":"Moses was 80 years old! He was afraid, but God gave him three signs: a rod that became a snake, a hand made white, and water turned to blood. God said, 'I will be with thy mouth.'","n":3,"w":"signs God gave Moses","v":"Now therefore go, and I will be with thy mouth, and teach thee what thou shalt say.","vr":"Exodus 4:12","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Find a straight stick for Moses' rod. Hold it up high and then lay it down. God uses people of every age!","tg":null,"q":"Moses started his biggest work at 80. What can you still do for God?","prev":"The Burning Bush","joy":"Sort buttons, coins or beans by color."},{"kind":"story","day":53,"week":8,"book":"Exodus","title":"The Ten Plagues","ref":"Exodus 7-11","story":"Pharaoh would not let God's people go. God sent ten plagues: water to blood, frogs, lice, flies, sick cattle, boils, hail, locusts, darkness, and the death of the firstborn.","n":10,"w":"plagues on Egypt","v":"That thou mayest know that there is none like me in all the earth.","vr":"Exodus 9:14","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do it 10 times, for the number 10 in today's story.","craft":"Hold up one finger for each plague as your helper reads them. How many can you remember?","tg":null,"q":"Which plague would have been the hardest?","prev":"Moses' Three Signs","joy":"Rest well tonight: sleep is God's good gift.","brain":"Finger countdown: count the 10 plagues on your fingers starting at your left pinky and going across to your right pinky. Then count back the other way.","trace":null},{"kind":"story","day":54,"week":8,"book":"Exodus","title":"The Passover Lamb","ref":"Exodus 12:1-13","story":"Each family put the blood of a lamb on the two side posts and the top of their door. When God saw the blood, the angel passed over. Jesus is our Passover Lamb.","n":3,"w":"places the blood went: two side posts and the top","v":"When I see the blood, I will pass over you.","vr":"Exodus 12:13","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram house. Put a small red paper strip on each side of the door and one across the top.","tg":"house","q":"How is Jesus like the Passover lamb?","prev":"The Ten Plagues","joy":"Call or send a card to someone you love."},{"kind":"story","day":55,"week":8,"book":"Exodus","title":"Cloud by Day, Fire by Night","ref":"Exodus 13:21-22","story":"God led His people out of Egypt. In the day He went before them in a pillar of cloud, and at night in a pillar of fire to give them light.","n":2,"w":"pillars that led Israel: cloud and fire","v":"And the LORD went before them by day in a pillar of a cloud, to lead them the way.","vr":"Exodus 13:21","move":"Hand claps: Clap your hands together, nice and steady. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Glue cotton balls in a tall column on one side of the paper, and red and orange paper 'flames' on the other side.","tg":null,"q":"How does God lead you today?","prev":"The Passover Lamb","joy":"Name 3 things you are thankful for today."},{"kind":"sabbath","day":56,"week":8,"title":"Sabbath Rest","v":"And from one sabbath to another, shall all flesh come to worship before me, saith the LORD.","vr":"Isaiah 66:23","hymn":"This Is My Father's World","review":[["Psalm 56:3","What time I am afraid, I will trust in thee."],["Exodus 3:5","Put off thy shoes from off thy feet, for the place whereon thou standest is holy ground."],["Exodus 4:12","Now therefore go, and I will be with thy mouth, and teach thee what thou shalt say."],["Exodus 9:14","That thou mayest know that there is none like me in all the earth."],["Exodus 12:13","When I see the blood, I will pass over you."],["Exodus 13:21","And the LORD went before them by day in a pillar of a cloud, to lead them the way."]],"story_titles":["Baby Moses in a Basket","The Burning Bush","Moses' Three Signs","The Ten Plagues","The Passover Lamb","Cloud by Day, Fire by Night"]},{"kind":"story","day":57,"week":9,"book":"Exodus","title":"Crossing the Red Sea","ref":"Exodus 14:13-31","story":"The sea was in front and the army behind. Moses raised his rod, and God opened a dry path with a wall of water on each side. Everyone walked across safely.","n":2,"w":"walls of water","v":"The LORD shall fight for you, and ye shall hold your peace.","vr":"Exodus 14:14","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Tear a piece of blue paper down the middle and pull the two halves apart to make a path. Walk your fingers across.","tg":null,"q":"What would it be like to walk through the sea on dry ground?","prev":"Cloud by Day, Fire by Night","joy":"Sing your favorite hymn, all the way through.","brain":"Part the waters: press your palms together, then sweep them apart. Now trace the two waves at the same time, starting at the outside dots and meeting in the middle, then trace back out.","trace":"waves","animal":"a_crab"},{"kind":"story","day":58,"week":9,"book":"Exodus","title":"Miriam's Song","ref":"Exodus 15:1, 20-21","story":"On the other side of the sea, Moses and the people sang to God. Miriam took a tambourine, and all the women followed her, singing and dancing for joy.","n":null,"w":"","v":"Sing ye to the LORD, for he hath triumphed gloriously.","vr":"Exodus 15:21","move":"Rhythm time: shake your shaker (or clap) to the beat of a hymn for one whole verse. Then tap your feet for one verse.","craft":"Make a shaker: put a few dry beans in a small container with a lid. Shake it while you sing a favorite hymn.","tg":null,"q":"What hymn makes you want to sing out loud?","prev":"Crossing the Red Sea","joy":"Look at an old photo and tell the story behind it.","brain":"Tambourine pattern: clap, pat right knee, clap, pat left knee. Then clap, cross your arms, and pat opposite knees. Repeat to a hymn.","trace":null},{"kind":"story","day":59,"week":9,"book":"Exodus","title":"Wells and Palm Trees","ref":"Exodus 15:22-27","story":"The water at Marah was bitter, but God made it sweet. Then God led them to Elim, where there were twelve wells of water and seventy palm trees.","n":12,"w":"wells of water at Elim","v":"I am the LORD that healeth thee.","vr":"Exodus 15:26","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 12 times, for the number 12 in today's story.","craft":"Put 12 small cups or bottle caps in a circle as wells. Put long leaves or green paper strips beside them as palm trees.","tg":null,"q":"Where is a peaceful place where you like to rest?","prev":"Miriam's Song","joy":"Pray for a neighbor by name."},{"kind":"story","day":60,"week":9,"book":"Exodus","title":"Bread from Heaven","ref":"Exodus 16:14-30","story":"God sent manna every morning. The people gathered it for six days. On the sixth day they gathered twice as much, because there was no manna on the Sabbath.","n":6,"w":"days they gathered manna","v":"Give us this day our daily bread.","vr":"Matthew 6:11","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do it 6 times, for the number 6 in today's story.","craft":"Scatter a few cotton balls or popcorn pieces on a tray. Gather them into a bowl, 'gathering manna.'","tg":null,"q":"Why was there no manna on the seventh day?","prev":"Wells and Palm Trees","joy":"Water a plant or put out seed for the birds.","brain":"Gather across: put cotton balls on your right side and a bowl on your left. Pick each one up with your right hand and drop it in the bowl. Then switch sides and hands.","trace":null},{"kind":"story","day":61,"week":9,"book":"Exodus","title":"Hold Up Your Hands","ref":"Exodus 17:8-13","story":"When Moses held up his hands, Israel won the battle. When his arms grew tired, Aaron and Hur held his hands up, one on each side, until the sun went down.","n":2,"w":"helpers who held up Moses' hands","v":"Bear ye one another's burdens, and so fulfil the law of Christ.","vr":"Galatians 6:2","move":"Knock-knock: Knock gently on the table with your knuckles. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Ask your helper to hold your arms up with you. Think of 2 people who help you, and pray for them.","tg":null,"q":"Who are the Aarons and Hurs in your life?","prev":"Bread from Heaven","joy":"Sit in the sunshine for 10 minutes.","brain":"Moses' hands: hold both arms up for a count of 5 while drawing small circles, the hands turning in opposite directions. Rest, then repeat 3 times.","trace":"circles"},{"kind":"story","day":62,"week":9,"book":"Exodus","title":"The Ten Commandments","ref":"Exodus 20:1-17","story":"On Mount Sinai, God spoke the Ten Commandments and wrote them with His own finger on two tables of stone. His law shows us how to love God and others.","n":10,"w":"commandments","v":"If ye love me, keep my commandments.","vr":"John 14:15","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do it 10 times, for the number 10 in today's story.","craft":"Find 2 flat stones or cut 2 cardboard tablets. Put a small mark on them for each commandment you can remember (4 on one, 6 on the other).","tg":"mountain","q":"Can you name some of the Ten Commandments?","prev":"Hold Up Your Hands","joy":"Drink a full glass of water, and thank God for it.","brain":"Two tables: tap your left knee 4 times (loving God), then your right knee 6 times (loving others), saying the numbers 1 to 10 as you go.","trace":null},{"kind":"sabbath","day":63,"week":9,"title":"Sabbath Rest","v":"Therefore the Son of man is Lord also of the sabbath.","vr":"Mark 2:28","hymn":"Amazing Grace","review":[["Exodus 14:14","The LORD shall fight for you, and ye shall hold your peace."],["Exodus 15:21","Sing ye to the LORD, for he hath triumphed gloriously."],["Exodus 15:26","I am the LORD that healeth thee."],["Matthew 6:11","Give us this day our daily bread."],["Galatians 6:2","Bear ye one another's burdens, and so fulfil the law of Christ."],["John 14:15","If ye love me, keep my commandments."]],"story_titles":["Crossing the Red Sea","Miriam's Song","Wells and Palm Trees","Bread from Heaven","Hold Up Your Hands","The Ten Commandments"]},{"kind":"story","day":64,"week":10,"book":"Exodus","title":"Remember the Sabbath","ref":"Exodus 20:8-11","story":"The fourth commandment says to remember the seventh day, the Sabbath. God rested on the seventh day of creation and made it holy. It is a gift of rest for everyone.","n":7,"w":"the seventh day, God's holy Sabbath","v":"Remember the sabbath day, to keep it holy.","vr":"Exodus 20:8","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do it 7 times, for the number 7 in today's story.","craft":"Make a simple calendar row of 7 squares. Color the 7th square gold or put a star on it.","tg":null,"q":"What do you love most about the Sabbath?","prev":"The Ten Commandments","joy":"Give someone a kind compliment.","brain":"Days of the week: tap alternate knees as you say the days forward, Sunday to Sabbath. Then say them backward from Sabbath.","trace":null},{"kind":"story","day":65,"week":10,"book":"Exodus","title":"The Sanctuary","ref":"Exodus 25:8-9","story":"God asked the people to build a sanctuary so He could live among them. It had a courtyard, a Holy Place and a Most Holy Place. Every part pointed to Jesus.","n":3,"w":"parts of the sanctuary: courtyard, Holy Place, Most Holy Place","v":"And let them make me a sanctuary; that I may dwell among them.","vr":"Exodus 25:8","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram house as the sanctuary tent. Or place 3 paper squares in a row to show the 3 parts.","tg":"house","q":"Jesus is our High Priest in heaven. What does He do for us there?","prev":"Remember the Sabbath","joy":"Tell your helper about a happy day from your childhood."},{"kind":"story","day":66,"week":10,"book":"Exodus","title":"The Golden Lampstand","ref":"Exodus 25:31-37","story":"Inside the Holy Place stood a golden lampstand with seven lamps that burned all the time. Jesus said, 'I am the light of the world.'","n":7,"w":"lamps on the golden lampstand","v":"Thy word is a lamp unto my feet, and a light unto my path.","vr":"Psalm 119:105","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 7 times, for the number 7 in today's story.","craft":"Make the tangram candle. Or line up 7 yellow paper flames in a row.","tg":"candle","q":"How does God's Word give you light?","prev":"The Sanctuary","joy":"Listen to some beautiful music.","brain":"Light 7 lamps: touch your thumb to each finger on your left hand (1-4), then your right (5-7). Then do it again, starting with the right hand.","trace":null},{"kind":"story","day":67,"week":10,"book":"Exodus","title":"The Golden Calf","ref":"Exodus 32:1-20","story":"Moses was on the mountain with God for forty days. The people grew tired of waiting and made a golden calf to worship. Moses was very sad.","n":40,"w":"days Moses was on the mountain","v":"Thou shalt have no other gods before me.","vr":"Exodus 20:3","move":"Knee pats: Pat your knees with both hands. Do 40 in all: 4 sets of 10 with a rest between.","craft":"Look at something shiny. Talk about how God is more precious than gold.","tg":null,"q":"Why is it hard to wait for God sometimes?","prev":"The Golden Lampstand","joy":"Smell a flower, a spice, or a piece of fresh fruit."},{"kind":"story","day":68,"week":10,"book":"Exodus","title":"Moses' Shining Face","ref":"Exodus 34:28-35","story":"Moses came down the mountain with two new tables of stone. His face shone so brightly from being with God that the people were afraid to come near him.","n":2,"w":"tables of stone Moses carried","v":"They looked unto him, and were lightened.","vr":"Psalm 34:5","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Look in a mirror and give your biggest smile. Being with God makes our faces shine with joy!","tg":null,"q":"What makes your face light up?","prev":"The Golden Calf","joy":"Teach your helper something you know how to do."},{"kind":"story","day":69,"week":10,"book":"Exodus","title":"Twelve Stones of the High Priest","ref":"Exodus 28:15-21","story":"The high priest wore a breastplate with twelve precious stones in four rows of three. Each stone had the name of a tribe. He carried God's people over his heart.","n":12,"w":"stones on the breastplate","v":"Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast our profession.","vr":"Hebrews 4:14","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 12 times, for the number 12 in today's story.","craft":"Arrange 12 colorful stones or buttons in 4 rows of 3 on a paper square. Jesus carries your name on His heart!","tg":null,"q":"Whose names do you carry on your heart in prayer?","prev":"Moses' Shining Face","joy":"Hold hands with your helper and pray together."},{"kind":"sabbath","day":70,"week":10,"title":"Sabbath Rest","v":"And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I am the LORD your God.","vr":"Ezekiel 20:20","hymn":"The Old Rugged Cross","review":[["Exodus 20:8","Remember the sabbath day, to keep it holy."],["Exodus 25:8","And let them make me a sanctuary; that I may dwell among them."],["Psalm 119:105","Thy word is a lamp unto my feet, and a light unto my path."],["Exodus 20:3","Thou shalt have no other gods before me."],["Psalm 34:5","They looked unto him, and were lightened."],["Hebrews 4:14","Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast our profession."]],"story_titles":["Remember the Sabbath","The Sanctuary","The Golden Lampstand","The Golden Calf","Moses' Shining Face","Twelve Stones of the High Priest"]},{"kind":"story","day":71,"week":11,"book":"Leviticus","title":"The Day of Atonement","ref":"Leviticus 16:7-10, 30","story":"Once a year the high priest went into the Most Holy Place. Two goats were chosen: one for the Lord and one for Azazel, carried away. God showed how sin would be cleansed away for good.","n":2,"w":"goats chosen on the Day of Atonement","v":"For on that day shall the priest make an atonement for you, to cleanse you, that ye may be clean from all your sins before the LORD.","vr":"Leviticus 16:30","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Wash your hands in a bowl of warm water with soap. Dry them on a soft towel. God makes us clean.","tg":null,"q":"How does it feel to know God forgives and cleans away our sins?","prev":"Twelve Stones of the High Priest","joy":"Step outside and take 5 deep breaths of fresh air."},{"kind":"story","day":72,"week":11,"book":"Numbers","title":"The Priestly Blessing","ref":"Numbers 6:22-27","story":"God gave Aaron a special blessing to say over the people. It has three parts: The LORD bless thee and keep thee; make His face shine upon thee; and give thee peace.","n":3,"w":"parts of the blessing","v":"The LORD bless thee, and keep thee.","vr":"Numbers 6:24","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Say the whole blessing slowly over someone you love, or over your helper. Place your hand on their shoulder.","tg":null,"q":"Who would you like to bless today?","prev":"The Day of Atonement","joy":"Make a list of people to pray for this week."},{"kind":"story","day":73,"week":11,"book":"Numbers","title":"Twelve Spies","ref":"Numbers 13:1-3, 30","story":"Moses sent twelve spies into Canaan. Ten were afraid, but Joshua and Caleb said, 'We are well able to take the land!'","n":12,"w":"spies Moses sent","v":"Let us go up at once, and possess it; for we are well able to overcome it.","vr":"Numbers 13:30","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do it 12 times, for the number 12 in today's story.","craft":"Set 12 stones in a row. Pull 2 forward for brave Joshua and Caleb.","tg":null,"q":"Which 2 spies trusted God?","prev":"The Priestly Blessing","joy":"Share a favorite family recipe."},{"kind":"story","day":74,"week":11,"book":"Numbers","title":"Giant Grapes","ref":"Numbers 13:23-27","story":"The spies found a bunch of grapes so big that two men had to carry it on a pole between them! The land was full of milk and honey.","n":2,"w":"men who carried the grapes","v":"O taste and see that the LORD is good.","vr":"Psalm 34:8","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Eat a few grapes slowly and enjoy them. Or glue purple paper circles into a big bunch of grapes.","tg":null,"q":"What is your favorite fruit?","prev":"Twelve Spies","joy":"Tell a funny story and laugh together."},{"kind":"story","day":75,"week":11,"book":"Numbers","title":"Aaron's Rod Blooms","ref":"Numbers 17:1-10","story":"Twelve leaders each put a rod in the tabernacle. The next morning, Aaron's rod had buds, flowers and ripe almonds! God showed He had chosen Aaron.","n":12,"w":"rods placed in the tabernacle","v":"The rod of Aaron... brought forth buds, and bloomed blossoms, and yielded almonds.","vr":"Numbers 17:8","move":"Toe taps: Keep your heels on the floor and tap your toes. Do it 12 times, for the number 12 in today's story.","craft":"Find a bare stick outside. Tape on a few leaves or paper flowers to make it 'bloom.' Snack on almonds if you can.","tg":null,"q":"God can make dry things bloom again. How has God made your life bloom?","prev":"Giant Grapes","joy":"Say a blessing for a grandchild or young friend."},{"kind":"story","day":76,"week":11,"book":"Numbers","title":"The Bronze Serpent","ref":"Numbers 21:4-9","story":"Snakes bit the people. God told Moses to put a bronze serpent on a pole. Whoever looked at it lived. Jesus said He would be lifted up like that, so we can look to Him and live.","n":null,"w":"","v":"And as Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up.","vr":"John 3:14","move":"Look and live: keep your head still and move only your eyes: look UP, then DOWN, 5 times. Then look LEFT and RIGHT 5 times. Rest your eyes by closing them.","craft":"Twist a pipe cleaner or strip of foil into a snake shape and wrap it around a pencil 'pole.'","tg":null,"q":"What happened when the people looked at the serpent?","prev":"Aaron's Rod Blooms","joy":"Help with a small job: fold towels or set the table."},{"kind":"sabbath","day":77,"week":11,"title":"Sabbath Rest","v":"And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.","vr":"Genesis 2:3","hymn":"In the Garden","review":[["Leviticus 16:30","For on that day shall the priest make an atonement for you, to cleanse you, that ye may be clean from all your sins before the LORD."],["Numbers 6:24","The LORD bless thee, and keep thee."],["Numbers 13:30","Let us go up at once, and possess it; for we are well able to overcome it."],["Psalm 34:8","O taste and see that the LORD is good."],["Numbers 17:8","The rod of Aaron... brought forth buds, and bloomed blossoms, and yielded almonds."],["John 3:14","And as Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up."]],"story_titles":["The Day of Atonement","The Priestly Blessing","Twelve Spies","Giant Grapes","Aaron's Rod Blooms","The Bronze Serpent"]},{"kind":"story","day":78,"week":12,"book":"Numbers","title":"Balaam's Donkey Speaks","ref":"Numbers 22:21-35","story":"Balaam hit his donkey three times because it would not go forward. It had seen an angel in the road! Then God let the donkey speak.","n":3,"w":"times Balaam struck his donkey","v":"God is not a man, that he should lie.","vr":"Numbers 23:19","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Draw a simple donkey face with big ears. Make a donkey 'hee-haw' sound together and laugh.","tg":null,"q":"Why did the donkey stop in the road?","prev":"The Bronze Serpent","joy":"Look out the window and name 5 things God made."},{"kind":"story","day":79,"week":12,"book":"Deuteronomy","title":"Moses Sees the Promised Land","ref":"Deuteronomy 34:1-7","story":"At 120 years old, Moses' eyes were still clear and he was strong. God showed him the Promised Land from a mountain. Moses died, but God later raised him to heaven.","n":12,"w":"(120 years old: count 12 tens)","v":"The eternal God is thy refuge, and underneath are the everlasting arms.","vr":"Deuteronomy 33:27","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 12 times, for the number 12 in today's story.","craft":"Make the tangram mountain. Place a small stick figure on top looking out at the land.","tg":"mountain","q":"Moses was 120 and still strong. What helps you stay strong?","prev":"Balaam's Donkey Speaks","joy":"Say today's memory verse to someone else."},{"kind":"story","day":80,"week":12,"book":"Joshua","title":"Rahab's Red Cord","ref":"Joshua 2:1-21","story":"Rahab hid two spies on her roof. She believed in God. The spies told her to tie a scarlet cord in her window, and her family would be safe.","n":2,"w":"spies Rahab hid","v":"Be strong and of a good courage; be not afraid.","vr":"Joshua 1:9","move":"Hand claps: Clap your hands together, nice and steady. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Tie a piece of red yarn or ribbon to a window handle or doorknob. Practice tying a bow.","tg":null,"q":"How did Rahab show she believed God?","prev":"Moses Sees the Promised Land","joy":"Hum a hymn while you do today's craft."},{"kind":"story","day":81,"week":12,"book":"Joshua","title":"Twelve Memorial Stones","ref":"Joshua 4:1-9","story":"God stopped the Jordan River, and Israel crossed on dry ground. Twelve men each carried a stone from the river to build a memorial, so children would ask, 'What do these stones mean?'","n":12,"w":"stones taken from the Jordan","v":"What mean ye by these stones?","vr":"Joshua 4:6","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do it 12 times, for the number 12 in today's story.","craft":"Gather 12 stones and stack them into a little pile. Each stone can stand for a blessing God has given you. Name them!","tg":null,"q":"What are some 'memorial stones' of God's goodness in your life?","prev":"Rahab's Red Cord","joy":"Count your blessings on your fingers.","brain":"Pass the stone: hold a stone in your right hand, pass it in front of you to your left hand, then back. 12 passes, counting each one.","trace":null},{"kind":"story","day":82,"week":12,"book":"Joshua","title":"The Walls of Jericho","ref":"Joshua 6:1-20","story":"For six days the people marched around Jericho once a day. On the seventh day they marched around seven times. Seven priests blew seven trumpets, the people shouted, and the walls fell down flat!","n":7,"w":"times they marched around Jericho on the seventh day","v":"By faith the walls of Jericho fell down, after they were compassed about seven days.","vr":"Hebrews 11:30","move":"Heel raises: Keep your toes on the floor and lift your heels up, then lower them. Do it 7 times, for the number 7 in today's story.","craft":"Build a wall of blocks or books. Walk your fingers around it 7 times, then shout 'Praise the Lord!' and knock it down.","tg":null,"q":"How many times did they march on the last day?","prev":"Twelve Memorial Stones","joy":"Tell someone, 'I love you.'","brain":"March and clap: march in your chair. Clap on every step for 7 steps, then clap only on every other step for 7 more.","trace":null},{"kind":"story","day":83,"week":12,"book":"Joshua","title":"Caleb at Eighty-Five","ref":"Joshua 14:6-14","story":"Caleb was 85 years old, but he said, 'I am as strong today as when I was 40! Give me this mountain.' God gave Caleb his mountain.","n":null,"w":"","v":"Now therefore give me this mountain.","vr":"Joshua 14:12","move":"Caleb's 85: clap your hands 8 times, rest, then clap 5 more times. Then lift your arms like a strong man 5 times.","craft":"Make the tangram mountain. Name one 'mountain' (a goal) you want to climb with God's help this month.","tg":"mountain","q":"Caleb was 85! What goal do you still have?","prev":"The Walls of Jericho","joy":"Listen to a psalm read aloud before bed."},{"kind":"sabbath","day":84,"week":12,"title":"Sabbath Rest","v":"Remember the sabbath day, to keep it holy.","vr":"Exodus 20:8","hymn":"Standing on the Promises","review":[["Numbers 23:19","God is not a man, that he should lie."],["Deuteronomy 33:27","The eternal God is thy refuge, and underneath are the everlasting arms."],["Joshua 1:9","Be strong and of a good courage; be not afraid."],["Joshua 4:6","What mean ye by these stones?"],["Hebrews 11:30","By faith the walls of Jericho fell down, after they were compassed about seven days."],["Joshua 14:12","Now therefore give me this mountain."]],"story_titles":["Balaam's Donkey Speaks","Moses Sees the Promised Land","Rahab's Red Cord","Twelve Memorial Stones","The Walls of Jericho","Caleb at Eighty-Five"]},{"kind":"story","day":85,"week":13,"book":"Joshua","title":"As for Me and My House","ref":"Joshua 24:14-15, 29","story":"When Joshua was old, he gathered the people. 'Choose you this day whom ye will serve,' he said. 'As for me and my house, we will serve the LORD.' Joshua lived to be 110.","n":11,"w":"(110 years old: count 11 tens)","v":"As for me and my house, we will serve the LORD.","vr":"Joshua 24:15","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do it 11 times, for the number 11 in today's story.","craft":"Make the tangram house. Say the verse and point to the house for 'my house.'","tg":"house","q":"How has your family served the Lord?","prev":"Caleb at Eighty-Five","joy":"Look at a map and talk about places you have lived."},{"kind":"story","day":86,"week":13,"book":"Judges","title":"Deborah Under the Palm Tree","ref":"Judges 4:4-16; 5:3","story":"Deborah judged Israel under a palm tree. God used her and Barak and ten thousand men to win a great victory. Then Deborah sang a song of praise.","n":10,"w":"(10,000 men: count 10)","v":"I will sing praise to the LORD God of Israel.","vr":"Judges 5:3","move":"Knock-knock: Knock gently on the table with your knuckles. Do it 10 times, for the number 10 in today's story.","craft":"Find a long leaf or draw a palm tree. Sit under a tree today if you can, and sing a song.","tg":null,"q":"Who is a wise woman who helped you in your life?","prev":"As for Me and My House","joy":"Wave to a neighbor or say hello to someone new."},{"kind":"story","day":87,"week":13,"book":"Judges","title":"Gideon's Fleece","ref":"Judges 6:12, 36-40","story":"An angel called Gideon 'thou mighty man of valour.' Gideon asked God for a sign with wool: first the wool was wet and the ground dry, then the wool was dry and the ground wet.","n":2,"w":"signs with the wool fleece","v":"The LORD is with thee, thou mighty man of valour.","vr":"Judges 6:12","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Take 2 cotton balls. Dip one in water and leave one dry. Feel the difference. God answered Gideon both times.","tg":null,"q":"God called Gideon brave. What brave thing have you done?","prev":"Deborah Under the Palm Tree","joy":"Wear a favorite outfit or piece of jewelry today."},{"kind":"story","day":88,"week":13,"book":"Judges","title":"Gideon's Lamps and Trumpets","ref":"Judges 7:16-21","story":"Gideon split his 300 men into three groups. Each had a trumpet and a lamp hidden in a jar. They blew the trumpets, broke the jars, and shouted, 'The sword of the LORD, and of Gideon!'","n":3,"w":"groups of Gideon's men","v":"The sword of the LORD, and of Gideon.","vr":"Judges 7:20","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Put a flashlight inside a paper cup. Turn it on and lift the cup to 'let your light shine.' Or make the tangram candle.","tg":"candle","q":"How can you let your light shine?","prev":"Gideon's Fleece","joy":"Name 5 people who helped you in life. Thank God for each one.","brain":"Jar and lamp: one hand makes a fist (the jar) while the other opens wide (the light). Switch 10 times, a little faster each time.","trace":null,"animal":"a_dog"},{"kind":"story","day":89,"week":13,"book":"Judges","title":"Samson's Strength","ref":"Judges 16:13-30","story":"Samson's strength came from God, and his hair had seven locks. When Samson turned from God, he became weak. In the end he prayed, and God made him strong once more.","n":7,"w":"locks of Samson's hair","v":"I can do all things through Christ which strengtheneth me.","vr":"Philippians 4:13","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do it 7 times, for the number 7 in today's story.","craft":"Braid 3 strands of yarn together like a lock of hair. Braiding is great exercise for the fingers!","tg":null,"q":"Where does real strength come from?","prev":"Gideon's Lamps and Trumpets","joy":"Plan something to look forward to this week."},{"kind":"story","day":90,"week":13,"book":"Ruth","title":"Ruth and Naomi","ref":"Ruth 1:1-18","story":"Naomi's husband and sons died. She told her daughter-in-law Ruth to go home, but Ruth said, 'Where you go, I will go. Your God will be my God.'","n":2,"w":"women who traveled together, Ruth and Naomi","v":"Whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God.","vr":"Ruth 1:16","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Hold hands with your helper and walk a few steps together, like Ruth and Naomi.","tg":null,"q":"Who is a loyal friend who stayed by your side?","prev":"Samson's Strength","joy":"Brush your hair and smile in the mirror.","brain":"Mirror me: sit facing your helper. They move their hands slowly; you copy them like a mirror. Then you lead and they follow.","trace":null},{"kind":"sabbath","day":91,"week":13,"title":"Sabbath Rest","v":"The sabbath was made for man, and not man for the sabbath.","vr":"Mark 2:27","hymn":"Rock of Ages","review":[["Joshua 24:15","As for me and my house, we will serve the LORD."],["Judges 5:3","I will sing praise to the LORD God of Israel."],["Judges 6:12","The LORD is with thee, thou mighty man of valour."],["Judges 7:20","The sword of the LORD, and of Gideon."],["Philippians 4:13","I can do all things through Christ which strengtheneth me."],["Ruth 1:16","Whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God."]],"story_titles":["As for Me and My House","Deborah Under the Palm Tree","Gideon's Fleece","Gideon's Lamps and Trumpets","Samson's Strength","Ruth and Naomi"]},{"kind":"story","day":92,"week":14,"book":"Ruth","title":"Ruth Gathers Grain","ref":"Ruth 2; 3:15","story":"Ruth gathered grain in the fields of Boaz. Boaz was kind to her and later gave her six measures of barley to take home to Naomi.","n":6,"w":"measures of barley Boaz gave Ruth","v":"He shall cover thee with his feathers, and under his wings shalt thou trust.","vr":"Psalm 91:4","move":"Knee pats: Pat your knees with both hands. Do it 6 times, for the number 6 in today's story.","craft":"Gather long grass or wheat stems into a bundle and tie it with string. Or scoop 6 spoonfuls of rice or beans into a bowl.","tg":null,"q":"Did you ever work in the fields or at a harvest?","prev":"Ruth and Naomi","joy":"Say the books of the Bible you remember."},{"kind":"story","day":93,"week":14,"book":"1 Samuel","title":"Hannah's Prayer","ref":"1 Samuel 1:9-28; 2:21","story":"Hannah prayed with all her heart for a baby. God gave her Samuel, and she gave him to serve the Lord. Later God blessed her with three more sons and two daughters.","n":5,"w":"more children God gave Hannah after Samuel","v":"For this child I prayed; and the LORD hath given me my petition which I asked of him.","vr":"1 Samuel 1:27","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do it 5 times, for the number 5 in today's story.","craft":"Fold your hands and pray for each child or grandchild by name. Your helper can write the names on a prayer card.","tg":null,"q":"What have you prayed for that God answered?","prev":"Ruth Gathers Grain","joy":"Help prepare a simple meal or snack."},{"kind":"story","day":94,"week":14,"book":"1 Samuel","title":"Samuel Hears God Call","ref":"1 Samuel 3:1-10","story":"Young Samuel heard a voice call his name in the night. He ran to Eli, but it was God calling. The fourth time, Samuel said, 'Speak; for thy servant heareth.'","n":4,"w":"times God called Samuel","v":"Speak, LORD; for thy servant heareth.","vr":"1 Samuel 3:9","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 4 times, for the number 4 in today's story.","craft":"Sit quietly for one minute with eyes closed. Listen. What sounds do you hear? Then whisper the verse.","tg":null,"q":"How does God speak to us today?","prev":"Hannah's Prayer","joy":"Take a short walk to the mailbox or porch.","brain":"Listen and switch: when your helper says 'Samuel,' touch your right ear with your left hand. When they say 'Eli,' touch your left ear with your right hand.","trace":null},{"kind":"story","day":95,"week":14,"book":"1 Samuel","title":"The Ebenezer Stone","ref":"1 Samuel 7:10-12","story":"God helped Israel win a battle. Samuel set up a stone and named it Ebenezer, which means 'the stone of help,' saying, 'Hitherto hath the LORD helped us.'","n":null,"w":"","v":"Hitherto hath the LORD helped us.","vr":"1 Samuel 7:12","move":"Stone lifts: hold your Ebenezer stone in one hand. Lift it up to your shoulder and down 6 times. Switch hands and do 6 more.","craft":"Find a nice stone. With a marker, your helper can write 'Ebenezer' or draw a heart on it. Keep it where you can see it.","tg":null,"q":"What are some ways the Lord has helped you up to now?","prev":"Samuel Hears God Call","joy":"Tell your helper what you want to do first in heaven."},{"kind":"story","day":96,"week":14,"book":"1 Samuel","title":"Saul and the Lost Donkeys","ref":"1 Samuel 9:3-20; 15:22","story":"Tall Saul went looking for his father's donkeys, lost for three days. Samuel told him the donkeys were found, and anointed him king. Later Saul disobeyed, and Samuel said, 'To obey is better than sacrifice.'","n":3,"w":"days the donkeys were lost","v":"Behold, to obey is better than sacrifice.","vr":"1 Samuel 15:22","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Hide 3 small objects around the room (your helper can help) and go looking for them, like Saul looking for the donkeys.","tg":null,"q":"Have you ever lost something special and found it again?","prev":"The Ebenezer Stone","joy":"Feel something new: tree bark, wool, a smooth stone."},{"kind":"story","day":97,"week":14,"book":"1 Samuel","title":"David Is Anointed","ref":"1 Samuel 16:1-13","story":"Samuel went to Jesse's house to anoint a new king. Seven sons passed by, but God said no. Then the youngest, David, the eighth son, came in from the sheep. God chose him!","n":8,"w":"sons of Jesse","v":"For man looketh on the outward appearance, but the LORD looketh on the heart.","vr":"1 Samuel 16:7","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do it 8 times, for the number 8 in today's story.","craft":"Rub a little lotion or oil on your hands, like the anointing oil. Massage each finger slowly.","tg":null,"q":"What does God look at in a person?","prev":"Saul and the Lost Donkeys","joy":"Say the memory verses you remember from this week."},{"kind":"sabbath","day":98,"week":14,"title":"Sabbath Rest","v":"Be still, and know that I am God.","vr":"Psalm 46:10","hymn":"Holy, Holy, Holy","review":[["Psalm 91:4","He shall cover thee with his feathers, and under his wings shalt thou trust."],["1 Samuel 1:27","For this child I prayed; and the LORD hath given me my petition which I asked of him."],["1 Samuel 3:9","Speak, LORD; for thy servant heareth."],["1 Samuel 7:12","Hitherto hath the LORD helped us."],["1 Samuel 15:22","Behold, to obey is better than sacrifice."],["1 Samuel 16:7","For man looketh on the outward appearance, but the LORD looketh on the heart."]],"story_titles":["Ruth Gathers Grain","Hannah's Prayer","Samuel Hears God Call","The Ebenezer Stone","Saul and the Lost Donkeys","David Is Anointed"]},{"kind":"story","day":99,"week":15,"book":"1 Samuel","title":"David the Shepherd","ref":"1 Samuel 17:34-37; Psalm 23","story":"David cared for his father's sheep. When a lion and a bear came to take a lamb, God helped David save it. David wrote, 'The LORD is my shepherd.'","n":2,"w":"wild animals David fought: a lion and a bear","v":"The LORD is my shepherd; I shall not want.","vr":"Psalm 23:1","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make little sheep: glue cotton balls onto paper and draw 4 legs. Say Psalm 23:1 as you work.","tg":null,"q":"How is Jesus like a good shepherd to you?","prev":"David Is Anointed","joy":"Draw or color something just for fun."},{"kind":"story","day":100,"week":15,"book":"1 Samuel","title":"David and Goliath","ref":"1 Samuel 17:38-50","story":"Giant Goliath mocked God. Young David chose five smooth stones from the brook. With his sling and one stone, and God's help, he brought the giant down!","n":5,"w":"smooth stones David chose from the brook","v":"The battle is the LORD'S.","vr":"1 Samuel 17:47","move":"Touch your toes 5 times, one for each stone. Sit tall, then slowly reach down toward your toes (or just to your knees). Your helper stands close by.","craft":"Go outside and find 5 smooth stones, or use 5 from a bowl. Feel how smooth they are. Put them in a small bag like David's.","tg":null,"q":"What 'giant' problem can you give to God today?","prev":"David the Shepherd","joy":"Give away something you no longer need.","brain":"Sling circles: circle your right arm slowly forward while your left arm circles backward. 5 circles, one for each stone. Then switch directions.","trace":null},{"kind":"story","day":101,"week":15,"book":"1 Samuel","title":"David and Jonathan","ref":"1 Samuel 20:17-42","story":"Prince Jonathan loved David like a brother. He shot three arrows as a secret signal to warn David. They promised to always be friends.","n":3,"w":"arrows Jonathan shot","v":"A friend loveth at all times.","vr":"Proverbs 17:17","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make 3 arrows from popsicle sticks or paper. Think of 3 friends and pray for each one.","tg":null,"q":"Tell about your best friend from long ago.","prev":"David and Goliath","joy":"Pray for your church and your pastor."},{"kind":"story","day":102,"week":15,"book":"1 Samuel","title":"David Spares Saul","ref":"1 Samuel 26:7-25","story":"King Saul was chasing David, but David found him asleep. Instead of hurting him, David quietly took Saul's spear and water jug to show he meant no harm.","n":2,"w":"things David took: a spear and a water jug","v":"And be ye kind one to another, tenderhearted, forgiving one another.","vr":"Ephesians 4:32","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Place a pencil (spear) and a cup (water jug) on the table. Tiptoe your fingers over to 'take them' quietly.","tg":null,"q":"Why didn't David hurt King Saul?","prev":"David and Jonathan","joy":"Pet an animal or watch the birds for a while."},{"kind":"story","day":103,"week":15,"book":"1 Samuel","title":"David Plays the Harp","ref":"1 Samuel 16:23; Psalm 33:1-3","story":"David played the harp so beautifully that it calmed King Saul. He wrote many songs to praise God with an instrument of ten strings.","n":10,"w":"strings on David's instrument","v":"Praise the LORD with harp: sing unto him with the psaltery and an instrument of ten strings.","vr":"Psalm 33:2","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 10 times, for the number 10 in today's story.","craft":"Stretch 10 rubber bands around an open box and strum them. Or listen to harp or hymn music together.","tg":null,"q":"What music did you love to sing or play?","prev":"David Spares Saul","joy":"Listen to a sermon or Bible reading.","brain":"Harp fingers: wiggle the fingers of both hands. Then tap on the table: right hand 2 taps, left hand 3 taps. Repeat the pattern 5 times.","trace":null},{"kind":"story","day":104,"week":15,"book":"2 Samuel","title":"David Dances Before the Lord","ref":"2 Samuel 6:12-15","story":"When the ark of God was brought to Jerusalem, the carriers went six paces, and David offered a sacrifice. Then David danced before the Lord with all his might!","n":6,"w":"paces the carriers took before stopping to worship","v":"And David danced before the LORD with all his might.","vr":"2 Samuel 6:14","move":"Take 6 paces: with your helper beside you, take 6 slow steps (or march 6 times in your chair). Stop, lift your hands and say 'Praise the Lord!' Then 6 more.","craft":"Put on a joyful hymn. Tap, sway or clap along to the music.","tg":null,"q":"What makes you so happy you want to dance?","prev":"David Plays the Harp","joy":"Remember a time God answered prayer, and tell it.","brain":"Joyful cross-overs: play a happy hymn. Touch your right hand to your left knee, then your left hand to your right knee, keeping time with the music.","trace":null},{"kind":"sabbath","day":105,"week":15,"title":"Sabbath Rest","v":"Come unto me, all ye that labour and are heavy laden, and I will give you rest.","vr":"Matthew 11:28","hymn":"Shall We Gather at the River","review":[["Psalm 23:1","The LORD is my shepherd; I shall not want."],["1 Samuel 17:47","The battle is the LORD'S."],["Proverbs 17:17","A friend loveth at all times."],["Ephesians 4:32","And be ye kind one to another, tenderhearted, forgiving one another."],["Psalm 33:2","Praise the LORD with harp: sing unto him with the psaltery and an instrument of ten strings."],["2 Samuel 6:14","And David danced before the LORD with all his might."]],"story_titles":["David the Shepherd","David and Goliath","David and Jonathan","David Spares Saul","David Plays the Harp","David Dances Before the Lord"]},{"kind":"story","day":106,"week":16,"book":"2 Samuel","title":"Kindness to Mephibosheth","ref":"2 Samuel 9:1-13","story":"King David looked for someone in Jonathan's family to be kind to. He found Mephibosheth, who was lame in both feet, and gave him a place at the king's table forever.","n":2,"w":"feet that were lame","v":"The LORD is gracious, and full of compassion; slow to anger, and of great mercy.","vr":"Psalm 145:8","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Set a nice place at the table with a plate, cup and napkin. Jesus has a place for you at His table in heaven!","tg":null,"q":"Who has been kind to you when you needed help?","prev":"David Dances Before the Lord","joy":"Sort buttons, coins or beans by color."},{"kind":"story","day":107,"week":16,"book":"2 Samuel","title":"Barzillai, the Faithful Friend","ref":"2 Samuel 19:31-39","story":"Barzillai was 80 years old. He brought food and help to King David when David was in trouble. David loved him and blessed him.","n":8,"w":"(Barzillai was 80: count 8 tens)","v":"The hoary head is a crown of glory, if it be found in the way of righteousness.","vr":"Proverbs 16:31","move":"Heel raises: Keep your toes on the floor and lift your heels up, then lower them. Do it 8 times, for the number 8 in today's story.","craft":"Make the tangram crown. Your gray hair is a crown of glory!","tg":"crown","q":"What can older people share that young people need?","prev":"Kindness to Mephibosheth","joy":"Rest well tonight: sleep is God's good gift."},{"kind":"story","day":108,"week":16,"book":"Psalm","title":"A Clean Heart","ref":"Psalm 51:1-12","story":"David did a very wrong thing. When he saw his sin, he was sorry and prayed, 'Create in me a clean heart, O God.' God forgave him.","n":null,"w":"","v":"Create in me a clean heart, O God; and renew a right spirit within me.","vr":"Psalm 51:10","move":"Deep breaths: breathe in slowly through your nose (count 1-2-3), and out through your lips (count 1-2-3-4). Do this 5 times, praying 'Clean heart' as you breathe.","craft":"Cut out a paper heart. Color it red, then cover it with a white paper heart. God gives us clean new hearts.","tg":null,"q":"What does it feel like to be forgiven?","prev":"Barzillai, the Faithful Friend","joy":"Call or send a card to someone you love."},{"kind":"story","day":109,"week":16,"book":"Psalm","title":"Green Pastures","ref":"Psalm 23","story":"Psalm 23 has six verses. The Good Shepherd leads us to green grass and quiet waters. He stays with us even in the dark valley.","n":6,"w":"verses in Psalm 23","v":"He maketh me to lie down in green pastures: he leadeth me beside the still waters.","vr":"Psalm 23:2","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do it 6 times, for the number 6 in today's story.","craft":"Sit on a porch or by a window with green grass in view. Or place green leaves on paper and a blue strip for still waters.","tg":null,"q":"Can you say all of Psalm 23 with your helper?","prev":"A Clean Heart","joy":"Name 3 things you are thankful for today."},{"kind":"story","day":110,"week":16,"book":"1 Kings","title":"Solomon Asks for Wisdom","ref":"1 Kings 3:5-12; 4:32","story":"God told young King Solomon to ask for anything. Solomon asked for wisdom to rule well. God was pleased. Solomon spoke three thousand proverbs!","n":3,"w":"(3,000 proverbs: count 3)","v":"If any of you lack wisdom, let him ask of God, that giveth to all men liberally.","vr":"James 1:5","move":"Knock-knock: Knock gently on the table with your knuckles. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Share a wise saying you learned from your parents or grandparents. Your helper can write it down to keep.","tg":"crown","q":"What is the wisest advice you ever received?","prev":"Green Pastures","joy":"Sing your favorite hymn, all the way through.","brain":"Wise words backward: name 5 fruits. Now say the same 5 fruits in reverse order.","trace":null},{"kind":"story","day":111,"week":16,"book":"1 Kings","title":"Two Mothers and a Baby","ref":"1 Kings 3:16-28","story":"Two women both said a baby was theirs. Wise Solomon found the true mother, because she loved the baby enough to give him up to save his life.","n":2,"w":"women who came to King Solomon","v":"The fear of the LORD is the beginning of wisdom.","vr":"Psalm 111:10","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Hold a soft doll or rolled towel like a baby. Rock it gently. Talk about how mothers love.","tg":null,"q":"Tell something special about your mother.","prev":"Solomon Asks for Wisdom","joy":"Look at an old photo and tell the story behind it."},{"kind":"sabbath","day":112,"week":16,"title":"Sabbath Rest","v":"This is the day which the LORD hath made; we will rejoice and be glad in it.","vr":"Psalm 118:24","hymn":"When We All Get to Heaven","review":[["Psalm 145:8","The LORD is gracious, and full of compassion; slow to anger, and of great mercy."],["Proverbs 16:31","The hoary head is a crown of glory, if it be found in the way of righteousness."],["Psalm 51:10","Create in me a clean heart, O God; and renew a right spirit within me."],["Psalm 23:2","He maketh me to lie down in green pastures: he leadeth me beside the still waters."],["James 1:5","If any of you lack wisdom, let him ask of God, that giveth to all men liberally."],["Psalm 111:10","The fear of the LORD is the beginning of wisdom."]],"story_titles":["Kindness to Mephibosheth","Barzillai, the Faithful Friend","A Clean Heart","Green Pastures","Solomon Asks for Wisdom","Two Mothers and a Baby"]},{"kind":"story","day":113,"week":17,"book":"1 Kings","title":"Solomon Builds the Temple","ref":"1 Kings 6:37-38; 8:10-11","story":"Solomon built a beautiful temple for God. It took seven years. When it was finished, God's glory filled the house like a cloud.","n":7,"w":"years it took to build the temple","v":"Enter into his gates with thanksgiving, and into his courts with praise.","vr":"Psalm 100:4","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do it 7 times, for the number 7 in today's story.","craft":"Make the tangram house as the temple. Or build a little temple from blocks or boxes.","tg":"house","q":"What was your church like when you were young?","prev":"Two Mothers and a Baby","joy":"Pray for a neighbor by name.","brain":"Other-hand builder: stack 7 blocks (or books) into a tower using only the hand you don't usually use.","trace":null},{"kind":"story","day":114,"week":17,"book":"1 Kings","title":"The Queen of Sheba","ref":"1 Kings 10:1-10","story":"The Queen of Sheba came to see Solomon's wisdom. She brought 120 talents of gold. She said, 'The half was not told me!' Heaven will be even more wonderful.","n":12,"w":"(120 talents of gold: count 12 tens)","v":"Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him.","vr":"1 Corinthians 2:9","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do it 12 times, for the number 12 in today's story.","craft":"Wrap a small box in gold or yellow paper like a gift for the king.","tg":"crown","q":"What do you look forward to seeing in heaven?","prev":"Solomon Builds the Temple","joy":"Water a plant or put out seed for the birds."},{"kind":"story","day":115,"week":17,"book":"Proverbs","title":"A Merry Heart","ref":"Proverbs 6:6-8; 17:22","story":"Solomon wrote many wise sayings. He said to watch the busy ant, which gathers food in summer. He also said a merry heart is like good medicine.","n":6,"w":"legs on an ant","v":"A merry heart doeth good like a medicine.","vr":"Proverbs 17:22","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 6 times, for the number 6 in today's story.","craft":"Look for ants outside, or draw an ant with 6 legs. Then tell a happy memory that makes you smile.","tg":null,"q":"What always cheers you up?","prev":"The Queen of Sheba","joy":"Sit in the sunshine for 10 minutes.","brain":"Nose and ear switch: right hand holds your nose, left hand holds your right ear. Clap, then switch: left hand on nose, right hand on left ear. A merry heart is good medicine!","trace":null,"animal":"a_runningrabbit"},{"kind":"story","day":116,"week":17,"book":"Ecclesiastes","title":"A Time for Everything","ref":"Ecclesiastes 3:1-8","story":"Solomon wrote that there is a season for everything: a time to plant, a time to harvest, a time to laugh, a time to dance.","n":4,"w":"seasons of the year","v":"To every thing there is a season, and a time to every purpose under the heaven.","vr":"Ecclesiastes 3:1","move":"Knee pats: Pat your knees with both hands. Do it 4 times, for the number 4 in today's story.","craft":"Gather items for 4 seasons: a flower (spring), a sun drawing (summer), a leaf (fall), a cotton ball snowflake (winter).","tg":null,"q":"Which season is your favorite, and why?","prev":"A Merry Heart","joy":"Drink a full glass of water, and thank God for it.","brain":"Four seasons in the air: with both hands, draw a flower (spring), a big sun circle (summer), a falling leaf zigzag (fall), and an X snowflake (winter).","trace":null,"animal":"a_stork"},{"kind":"story","day":117,"week":17,"book":"1 Kings","title":"The Kingdom Divides","ref":"1 Kings 11:29-31; 12:16-20","story":"The prophet tore a new coat into twelve pieces and gave ten pieces to Jeroboam. The kingdom split: ten tribes in the north, and Judah in the south.","n":10,"w":"pieces given to Jeroboam","v":"Blessed is the nation whose God is the LORD.","vr":"Psalm 33:12","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do it 10 times, for the number 10 in today's story.","craft":"Tear a sheet of paper into 12 pieces. Count out 10 in one pile and 2 in another.","tg":null,"q":"Why is it sad when families or churches divide?","prev":"A Time for Everything","joy":"Give someone a kind compliment."},{"kind":"story","day":118,"week":17,"book":"1 Kings","title":"Elijah Fed by Ravens","ref":"1 Kings 17:1-6","story":"There was no rain. God sent Elijah to hide by a brook. Ravens brought him bread and meat every morning and every evening.","n":2,"w":"times a day the ravens brought food","v":"But my God shall supply all your need according to his riches in glory by Christ Jesus.","vr":"Philippians 4:19","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make the tangram bird as a raven. Put a small piece of bread near its beak.","tg":"bird","q":"How has God provided food for you?","prev":"The Kingdom Divides","joy":"Tell your helper about a happy day from your childhood.","brain":"Raven wings: flap both arms together 5 times. Then flap them opposite, one up while the other is down, 5 times.","trace":null,"animal":"a_raven"},{"kind":"sabbath","day":119,"week":17,"title":"Sabbath Rest","v":"There remaineth therefore a rest to the people of God.","vr":"Hebrews 4:9","hymn":"Leaning on the Everlasting Arms","review":[["Psalm 100:4","Enter into his gates with thanksgiving, and into his courts with praise."],["1 Corinthians 2:9","Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him."],["Proverbs 17:22","A merry heart doeth good like a medicine."],["Ecclesiastes 3:1","To every thing there is a season, and a time to every purpose under the heaven."],["Psalm 33:12","Blessed is the nation whose God is the LORD."],["Philippians 4:19","But my God shall supply all your need according to his riches in glory by Christ Jesus."]],"story_titles":["Solomon Builds the Temple","The Queen of Sheba","A Merry Heart","A Time for Everything","The Kingdom Divides","Elijah Fed by Ravens"]},{"kind":"story","day":120,"week":18,"book":"1 Kings","title":"The Widow's Flour and Oil","ref":"1 Kings 17:8-16","story":"A poor widow was gathering two sticks to cook her last meal. She shared it with Elijah first, and her flour and oil never ran out!","n":2,"w":"sticks the widow was gathering","v":"The barrel of meal shall not waste, neither shall the cruse of oil fail.","vr":"1 Kings 17:14","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Find 2 sticks outside. Then make a little 'cake' from bread dough or play dough.","tg":null,"q":"When did sharing bring you a blessing?","prev":"Elijah Fed by Ravens","joy":"Listen to some beautiful music."},{"kind":"story","day":121,"week":18,"book":"1 Kings","title":"Obadiah Hides the Prophets","ref":"1 Kings 18:3-4, 12","story":"Obadiah served in the wicked king's palace, but he loved God. He hid one hundred prophets, fifty in each of two caves, and fed them bread and water.","n":2,"w":"caves where Obadiah hid the prophets","v":"But I thy servant fear the LORD from my youth.","vr":"1 Kings 18:12","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make two 'caves' by tenting two paper napkins. Hide a few buttons under each one.","tg":null,"q":"How long have you loved the Lord? Since you were young?","prev":"The Widow's Flour and Oil","joy":"Smell a flower, a spice, or a piece of fresh fruit."},{"kind":"story","day":122,"week":18,"book":"1 Kings","title":"Fire on Mount Carmel","ref":"1 Kings 18:21-39","story":"Elijah built an altar with twelve stones. He poured water over it three times. Then he prayed, and fire fell from heaven! The people cried, 'The LORD, he is the God!'","n":12,"w":"stones in Elijah's altar","v":"How long halt ye between two opinions? if the LORD be God, follow him.","vr":"1 Kings 18:21","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do it 12 times, for the number 12 in today's story.","craft":"Build a small altar from 12 stones. Lay a few twigs on top and red paper for fire.","tg":"mountain","q":"What did the fire from heaven prove?","prev":"Obadiah Hides the Prophets","joy":"Teach your helper something you know how to do."},{"kind":"story","day":123,"week":18,"book":"1 Kings","title":"A Cloud Like a Man's Hand","ref":"1 Kings 18:41-45","story":"Elijah prayed for rain. His servant looked toward the sea seven times. The seventh time he saw a little cloud like a man's hand. Then came a great rain!","n":7,"w":"times the servant looked for rain","v":"The effectual fervent prayer of a righteous man availeth much.","vr":"James 5:16","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do it 7 times, for the number 7 in today's story.","craft":"Trace your hand on blue paper and glue cotton balls inside to make a little hand-shaped cloud.","tg":null,"q":"Keep praying! What are you praying for right now?","prev":"Fire on Mount Carmel","joy":"Hold hands with your helper and pray together."},{"kind":"story","day":124,"week":18,"book":"1 Kings","title":"The Still Small Voice","ref":"1 Kings 19:9-13","story":"Elijah was tired and sad. God sent a wind, an earthquake and a fire, but God was not in them. Then came a still small voice, and God spoke to him gently.","n":4,"w":"things Elijah heard: wind, earthquake, fire, still small voice","v":"And after the fire a still small voice.","vr":"1 Kings 19:12","move":"Toe taps: Keep your heels on the floor and tap your toes. Do it 4 times, for the number 4 in today's story.","craft":"Turn off the TV and radio. Sit together in silence for 2 minutes. Then talk softly about what God might be saying.","tg":null,"q":"God cared for Elijah when he was tired. How does God care for you?","prev":"A Cloud Like a Man's Hand","joy":"Step outside and take 5 deep breaths of fresh air.","brain":"Copy the rhythm: your helper taps a soft pattern on the table. Listen carefully and tap it back with alternating hands.","trace":null},{"kind":"story","day":125,"week":18,"book":"2 Kings","title":"Elijah Goes to Heaven","ref":"2 Kings 2:9-12","story":"Elisha asked for a double portion of Elijah's spirit. Then a chariot of fire came, and Elijah went up to heaven in a whirlwind, without dying.","n":2,"w":"(a double portion: 2 times as much)","v":"And Elijah went up by a whirlwind into heaven.","vr":"2 Kings 2:11","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Draw a chariot with red and orange crayon flames, or twist red tissue paper into a 'whirlwind.'","tg":null,"q":"Elijah never died. Who else will go to heaven without dying when Jesus comes?","prev":"The Still Small Voice","joy":"Make a list of people to pray for this week.","brain":"Whirlwind: trace the two spirals at the same time with a finger of each hand, from the outside in. Then from the inside out.","trace":"spiral"},{"kind":"sabbath","day":126,"week":18,"title":"Sabbath Rest","v":"And from one sabbath to another, shall all flesh co ll},{"kind":"story","day":143,"week":21,"book":"Isaiah","title":"Even to Your Old Age","ref":"Isaiah 46:3-4","story":"God promised His people that He had carried them since they were born, and He would carry them all the way to old age and gray hair.","n":null,"w":"","v":"And even to your old age I am he; and even to hoar hairs will I carry you.","vr":"Isaiah 46:4","move":"Carry and lift: hug a small pillow to your chest. Lift it up toward your chin, then lower it, 8 times. God carries you!","craft":"Look at a baby picture of yourself and a recent picture. God has carried you all these years!","tg":null,"q":"Tell about a time God carried you through.","prev":"Fear Thou Not","joy":"Plan something to look forward to this week."},{"kind":"story","day":144,"week":21,"book":"Isaiah","title":"Wounded for Us","ref":"Isaiah 53:4-7","story":"Isaiah 53 has twelve verses about Jesus, the suffering Servant. We are like sheep who went astray, but Jesus took our punishment so we could be healed.","n":12,"w":"verses in Isaiah 53","v":"But he was wounded for our transgressions, he was bruised for our iniquities... and with his stripes we are healed.","vr":"Isaiah 53:5","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do it 12 times, for the number 12 in today's story.","craft":"Tie 2 popsicle sticks (or twigs) together with string to make a cross. Thank Jesus for taking our sins.","tg":"sticks","q":"How does it feel to know Jesus suffered for you?","prev":"Even to Your Old Age","joy":"Brush your hair and smile in the mirror."},{"kind":"story","day":145,"week":21,"book":"Isaiah","title":"Call the Sabbath a Delight","ref":"Isaiah 58:13-14","story":"God promised a blessing to those who turn from their own busy ways on His holy day and call the Sabbath a delight.","n":7,"w":"the seventh day, the Sabbath","v":"And call the sabbath a delight, the holy of the LORD, honourable.","vr":"Isaiah 58:13","move":"Walking paces: With your helper right b
