 taps: Keep your heels on the floor and tap your toes. Do it 7 times, for the number 7 in today's story.","craft":"Roll 7 small paper trumpets, or 'toot' through your hand 7 times.","tg":null,"q":"Who will reign forever?","prev":"Palms of Victory","joy":"Help with a small job: fold towels or set the table."},{"kind":"story","day":346,"week":50,"book":"Revelation","title":"A Crown of Twelve Stars","ref":"Revelation 12:1-11","story":"John saw a woman clothed with the sun, the moon under her feet, and a crown of twelve stars on her head. She is a picture of God's faithful church.","n":12,"w":"stars on the woman's crown","v":"And they overcame him by the blood of the Lamb, and by the word of their testimony.","vr":"Revelation 12:11","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do it 12 times, for the number 12 in today's story.","craft":"Make the tangram crown. Put 12 star stickers or paper stars around it.","tg":"crown","q":"What is your testimony of God's goodness?","prev":"Seven Trumpets","joy":"Look out the window and name 5 things God made."},{"kind":"story","day":347,"week":50,"book":"Revelation","title":"The Remnant","ref":"Revelation 12:17","story":"Satan is angry with God's people in the last days. But God has a faithful remnant who keep the commandments of God and have the testimony of Jesus.","n":10,"w":"commandments God's remnant keeps","v":"Which keep the commandments of God, and have the testimony of Jesus Christ.","vr":"Revelation 12:17","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do it 10 times, for the number 10 in today's story.","craft":"Point to your 10 fingers and name the commandments with your helper.","tg":null,"q":"How does loving Jesus help us keep His commandments?","prev":"A Crown of Twelve Stars","joy":"Say today's memory verse to someone else."},{"kind":"story","day":348,"week":50,"book":"Revelation","title":"The First Angel's Message","ref":"Revelation 14:6-7","story":"John saw an angel flying with the everlasting gospel for everyone. The angel said: Fear God, give glory to Him, the judgment hour is come. Worship Him who made heaven, earth, sea, and springs of water.","n":4,"w":"things God made: heaven, earth, sea, fountains","v":"Fear God, and give glory to him; for the hour of his judgment is come: and worship him that made heaven, and earth, and the sea, and the fountains of waters.","vr":"Revelation 14:7","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 4 times, for the number 4 in today's story.","craft":"Make 4 little cards: sky (blue), earth (brown), sea (dark blue), fountain (a water drop). Worship the Creator!","tg":null,"q":"How does the Sabbath help us worship our Creator?","prev":"The Remnant","joy":"Hum a hymn while you do today's craft."},{"kind":"story","day":349,"week":50,"book":"Revelation","title":"Three Angels' Messages","ref":"Revelation 14:6-12","story":"Three angels fly through heaven with God's last messages to the world: worship the Creator; Babylon is fallen; and do not receive the mark of the beast. (Later, 3 more angels appear, making 6 in the chapter.)","n":3,"w":"angels with God's last messages","v":"Here is the patience of the saints: here are they that keep the commandments of God, and the faith of Jesus.","vr":"Revelation 14:12","move":"Hand claps: Clap your hands together, nice and steady. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram bird 3 times (or draw 3 flying angels). Say '1st, 2nd, 3rd angel' as you point to each.","tg":"bird","q":"Can you remember what the first angel said?","prev":"The First Angel's Message","joy":"Count your blessings on your fingers."},{"kind":"sabbath","day":350,"week":50,"title":"Sabbath Rest","v":"And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I am the LORD your God.","vr":"Ezekiel 20:20","hymn":"Beneath the Cross of Jesus","review":[["Revelation 7:10","Salvation to our God which sitteth upon the throne, and unto the Lamb."],["Revelation 11:15","The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever."],["Revelation 12:11","And they overcame him by the blood of the Lamb, and by the word of their testimony."],["Revelation 12:17","Which keep the commandments of God, and have the testimony of Jesus Christ."],["Revelation 14:7","Fear God, and give glory to him; for the hour of his judgment is come: and worship him that made heaven, and earth, and the sea, and the fountains of waters."],["Revelation 14:12","Here is the patience of the saints: here are they that keep the commandments of God, and the faith of Jesus."]],"story_titles":["Palms of Victory","Seven Trumpets","A Crown of Twelve Stars","The Remnant","The First Angel's Message","Three Angels' Messages"]},{"kind":"story","day":351,"week":51,"book":"Revelation","title":"The Son of Man on a White Cloud","ref":"Revelation 14:14-16; 1:7","story":"John saw Jesus sitting on a white cloud with a golden crown and a sharp sickle, coming to gather His harvest, His people, home.","n":null,"w":"","v":"Behold, he cometh with clouds; and every eye shall see him.","vr":"Revelation 1:7","move":"Harvest: sweep both arms slowly from one side to the other, like gathering wheat. 8 times each direction.","craft":"Glue cotton balls onto blue paper to make a big white cloud. Put a small yellow paper crown on top.","tg":null,"q":"What will you say to Jesus when you see Him?","prev":"Three Angels' Messages","joy":"Tell someone, 'I love you.'"},{"kind":"story","day":352,"week":51,"book":"Revelation","title":"The Sea of Glass","ref":"Revelation 15:1-4","story":"John saw seven angels with the seven last plagues. Beside God's throne was a sea of glass mixed with fire. God's people stood on it, singing the song of Moses and the Lamb.","n":7,"w":"angels with the last plagues","v":"Great and marvellous are thy works, Lord God Almighty; just and true are thy ways, thou King of saints.","vr":"Revelation 15:3","move":"Heel raises: Keep your toes on the floor and lift your heels up, then lower them. Do it 7 times, for the number 7 in today's story.","craft":"Lay aluminum foil or a mirror flat on the table as the sea of glass. Sing a praise song.","tg":null,"q":"What song do you want to sing in heaven?","prev":"The Son of Man on a White Cloud","joy":"Listen to a psalm read aloud before bed.","brain":"Smooth as glass: trace the infinity sign slowly and smoothly with both hands clasped together. 5 times.","trace":"infinity"},{"kind":"story","day":353,"week":51,"book":"Revelation","title":"Come Out of Her, My People","ref":"Revelation 18:1-8","story":"A mighty angel lit the earth with glory and called, 'Come out of Babylon, my people!' Babylon's plagues come in one day: death, mourning, famine, and fire.","n":4,"w":"plagues on Babylon","v":"Come out of her, my people, that ye be not partakers of her sins.","vr":"Revelation 18:4","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 4 times, for the number 4 in today's story.","craft":"Draw a doorway with a bright light shining through it. God calls His people into the light.","tg":null,"q":"Why does God call His people so lovingly?","prev":"The Sea of Glass","joy":"Look at a map and talk about places you have lived."},{"kind":"story","day":354,"week":51,"book":"Revelation","title":"King of Kings","ref":"Revelation 19:6-16","story":"Heaven opened, and Jesus rode a white horse. On His head were many crowns, and His name is written: KING OF KINGS, AND LORD OF LORDS. There will be a great marriage supper!","n":null,"w":"","v":"Blessed are they which are called unto the marriage supper of the Lamb.","vr":"Revelation 19:9","move":"Ride with the King: 'gallop' by tapping your hands on your knees quickly for a count of 10. Rest. Do it 3 times.","craft":"Make the tangram crown. Set a pretty table for the 'marriage supper' with your best napkin.","tg":"crown","q":"What will the marriage supper of the Lamb be like?","prev":"Come Out of Her, My People","joy":"Wave to a neighbor or say hello to someone new."},{"kind":"story","day":355,"week":51,"book":"Revelation","title":"A Thousand Years","ref":"Revelation 20:1-6","story":"When Jesus comes, the saved go to heaven for a thousand years. Satan is bound on the empty earth. The righteous dead are raised in the first resurrection.","n":10,"w":"(1,000 years = 10 x 10 x 10)","v":"Blessed and holy is he that hath part in the first resurrection.","vr":"Revelation 20:6","move":"Knock-knock: Knock gently on the table with your knuckles. Do it 10 times, for the number 10 in today's story.","craft":"Stack 10 coins, then 10 stacks! Count how tall it gets.","tg":null,"q":"Who will be in the first resurrection?","prev":"King of Kings","joy":"Wear a favorite outfit or piece of jewelry today.","brain":"Count by tens: tap alternate knees and count 10, 20, 30... up to 100. Then back down.","trace":null},{"kind":"story","day":356,"week":51,"book":"Revelation","title":"Sin Will Not Rise Again","ref":"Revelation 20:9-15; Nahum 1:9","story":"After the thousand years, sin, Satan and death are destroyed forever. The prophet Nahum said trouble will not come up a second time. Sin will never return!","n":2,"w":"(sin will never come a second time)","v":"Affliction shall not rise up the second time.","vr":"Nahum 1:9","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Crumple a paper with a sad face on it and throw it away. Draw a big smile on a new paper.","tg":null,"q":"What will it be like to live where sin never comes again?","prev":"A Thousand Years","joy":"Name 5 people who helped you in life. Thank God for each one."},{"kind":"sabbath","day":357,"week":51,"title":"Sabbath Rest","v":"And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.","vr":"Genesis 2:3","hymn":"When He Cometh","review":[["Revelation 1:7","Behold, he cometh with clouds; and every eye shall see him."],["Revelation 15:3","Great and marvellous are thy works, Lord God Almighty; just and true are thy ways, thou King of saints."],["Revelation 18:4","Come out of her, my people, that ye be not partakers of her sins."],["Revelation 19:9","Blessed are they which are called unto the marriage supper of the Lamb."],["Revelation 20:6","Blessed and holy is he that hath part in the first resurrection."],["Nahum 1:9","Affliction shall not rise up the second time."]],"story_titles":["The Son of Man on a White Cloud","The Sea of Glass","Come Out of Her, My People","King of Kings","A Thousand Years","Sin Will Not Rise Again"]},{"kind":"story","day":358,"week":52,"book":"Revelation","title":"All Things New","ref":"Revelation 21:1-5","story":"John saw a new heaven and a new earth. God will live with His people. There will be no more death, sorrow, crying, or pain. God says, 'Behold, I make all things new.'","n":4,"w":"things that will be no more: death, sorrow, crying, pain","v":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain.","vr":"Revelation 21:4","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do it 4 times, for the number 4 in today's story.","craft":"Draw a sunrise over green hills and flowers. Name what you want to see first in the new earth.","tg":null,"q":"What pain will you be glad to leave behind forever?","prev":"Sin Will Not Rise Again","joy":"Plan something to look forward to this week.","brain":"Something new: write your name (or draw a smile) with the hand you don't usually use.","trace":null},{"kind":"story","day":359,"week":52,"book":"Revelation","title":"Twelve Foundations","ref":"Revelation 21:10-14, 19-20","story":"The New Jerusalem has twelve gates with the names of the twelve tribes, and twelve foundations with the names of the twelve apostles, each made of a precious stone.","n":12,"w":"foundations of the New Jerusalem","v":"Behold, I make all things new.","vr":"Revelation 21:5","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do it 12 times, for the number 12 in today's story.","craft":"Arrange 12 colorful stones or buttons in a square as the foundations of the holy city.","tg":null,"q":"How many foundations does the city have?","prev":"All Things New","joy":"Brush your hair and smile in the mirror."},{"kind":"story","day":360,"week":52,"book":"Revelation","title":"Gates of Pearl, Streets of Gold","ref":"Revelation 21:16-27","story":"The city is foursquare, with four equal sides. Each gate is one big pearl, and the street is pure gold, like clear glass. There is no night there!","n":4,"w":"equal sides of the city","v":"And the street of the city was pure gold, as it were transparent glass.","vr":"Revelation 21:21","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 4 times, for the number 4 in today's story.","craft":"Make a square with 4 popsicle sticks. Put a white button 'pearl' on each side and gold paper in the middle.","tg":null,"q":"What do you think it will feel like to walk on streets of gold?","prev":"Twelve Foundations","joy":"Say the books of the Bible you remember."},{"kind":"story","day":361,"week":52,"book":"Revelation","title":"The Tree of Life","ref":"Revelation 22:1-2","story":"A pure river of life flows from God's throne. The tree of life grows on both sides, with twelve kinds of fruit, a new fruit every month!","n":12,"w":"kinds of fruit on the tree of life","v":"And the leaves of the tree were for the healing of the nations.","vr":"Revelat y Shall See His Face","joy":"Tell your helper what you want to do first in heaven.","brain":"Forever with Jesus: trace the infinity sign with your finger, saying 'Even so, come, Lord Jesus.' Then with the other hand.","trace":"infinity"},{"kind":"sabbath","day":364,"week":52,"title":"Sabbath Rest","v":"Remember the sabbath day, to keep it holy.","vr":"Exodus 20:8","hymn":"Onward, Christian Soldiers","review":[["Revelation 21:4","And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain."],["Revelation 21:5","Behold, I make all things new."],["Revelation 21:21","And the street of the city was pure gold, as it were transparent glass."],["Revelation 22:2","And the leaves of the tree were for the healing of the nations."],["Revelation 22:4","And they shall see his face; and his name shall be in their foreheads."],["Revelation 22:20","Surely I come quickly. Amen. Even so, come, Lord Jesus."]],"story_titles":["All Things New","Twelve Foundations","Gates of Pearl, Streets of Gold","The Tree of Life","They Shall See His Face","Surely I Come Quickly"]},{"kind":"final","day":365,"week":53,"title":"Day 365: Well Done!","v":"Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ.","vr":"Philippians 1:6"}],"figs":{"boat":{"name":"Boat","pieces":{"ST1":[[0,2],[2,2],[1,1]],"PA":[[1,1],[3,1],[4,2],[2,2]],"MT":[[2.15,2.15],[4.15,2.15],[2.15,4.15]],"ST2":[[1.85,2.15],[1.85,4.15],[0.85,3.15]]},"extras":[["mast",[2,2],[2,4.9]],["oar",[0.6,1.4],[-0.6,0.4]],["oar",[3.4,1.4],[4.6,0.4]]],"eye":null,"beak":null},"ark":{"name":"Noah's Ark","pieces":{"LT1":[[0,4],[4,4],[2,2]],"LT2":[[4,4],[8,4],[6,2]],"MT":[[2,2],[4,2],[4,4]],"ST1":[[4,2],[6,2],[5,3]],"ST2":[[4,2],[5,3],[4,4]],"SQ":[[3.2929,4.05],[4.7071,4.05],[4.7071,5.4642],[3.2929,5.4642]],"PA":[[2.5,5.5142],[4.5,5.5142],[5.5,6.5142],[3.5,6.5142]]},"extras":[],"eye":null,"beak":n /* ---------- tangram geometry ---------- */
const CANON = { LT: [[0,0],[4,0],[2,2]], MT: [[0,0],[2,0],[0,2]], ST: [[0,0],[2,0],[1,1]], SQ: [[1,0],[2,1],[1,2],[0,1]], PA: [[0,0],[2,0],[3,1],[1,1]] };
const kindOf = id => id.replace(/\d$/, "");
const cen = pts => [pts.reduce((a,p)=>a+p[0],0)/pts.length, pts.reduce((a,p)=>a+p[1],0)/pts.length];
const LOCAL = {}; for (const k in CANON){ const c = cen(CANON[k]); LOCAL[k] = CANON[k].map(p => [p[0]-c[0], p[1]-c[1]]); }
function placed(kind, ang, flip, cx, cy){
  const r = ang * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return LOCAL[kind].map(([x,y]) => { if (flip) x = -x; return [cx + x*c - y*s, cy + x*s + y*c]; });
}
function sameShape(a, b, tol){
  if (a.length !== b.length) return false;
  return a.every(p => b.some(q => Math.hypot(p[0]-q[0], p[1]-q[1]) < tol));
}
// figure data is y-up; flip to screen (y-down) once
const SFIG = {};
for (const k in FIGS){
  const f = FIGS[k], flipY = p => [p[0], -p[1]];
  const slots = Object.entries(f.pieces).map(([id, pts]) => {
    const P = pts.map(flipY), c = cen(P), kind = kindOf(id);
    let rot = null;
    for (const flip of [false, true]) for (let a = 0; a < 360 && !rot; a += 45){
      if (sameShape(placed(kind, a, flip, c[0], c[1]), P, 0.05)) rot = { ang: a, flip };
    }
    return { id, kind, pts: P, c, rot: rot || { ang: 0, flip: false } };
  });
  SFIG[k] = { name: f.name, story: f.story, day: f.day, why: f.why, ref: f.ref, slots, extras: (f.extras||[]).map(([t,a,b]) => [t, flipY(a), flipY(b)]), eye: f.eye ? flipY(f.eye) : null, beak: f.beak ? f.beak.map(flipY) : null };
}
function bbox(ptsList){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  ptsList.forEach(p => { x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); });
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0};
}
function figSVG(key, cls = ""){
  const f = SFIG[key], all = f.slots.flatMap(s => s.pts).concat(f.extras.flatMap(e => [e[1], e[2]])).concat(f.beak || []);
  const b = bbox(all), pad = .3;
  let s = `<svg class="${cls}" viewBox="${b.x0-pad} ${b.y0-pad} ${b.w+2*pad} ${b.h+2*pad}" role="img" aria-label="${esc(f.name)} tangram picture">`;
  f.extras.forEach(([t,a,c]) => s += `<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="${t==="mast"?"#8D6E63":"#BDBDBD"}" stroke-width=".22" stroke-linecap="round"/>`);
  f.slots.forEach(sl => s += `<polygon points="${sl.pts.map(p=>p.join(",")).join(" ")}" fill="${COL[sl.id]}" stroke="#111" stroke-width=".06" stroke-linejoin="round"/>`);
  if (f.beak) s += `<polygon points="${f.beak.map(p=>p.join(",")).join(" ")}" fill="#FFB300" stroke="#111" stroke-width=".04"/>`;
  if (f.eye) s += `<circle cx="${f.eye[0]}" cy="${f.eye[1]}" r=".13" fill="#fff" stroke="#111" stroke-width=".05"/>`;
  return s + "</svg>";
}


/* ---------- tracing guide (watch + touch tracing) ---------- */
const TRACE = DATA.trace;
const LOOP_SHAPES = new Set(["infinity", "circles"]);
function traceBox(sh){
  const pts = TRACE[sh].strokes.flatMap(s => s.pts).concat(TRACE[sh].dots.map(d => [d.x, d.y]));
  const b = bbox(pts), pad = .8; return { x: b.x0 - pad, y: b.y0 - pad, w: b.w + 2*pad, h: b.h + 2*pad };
}
const ptsAttr = P => P.map(p => p.join(",")).join(" ");
function traceWidget(sh, id){
  const T = TRACE[sh], vb = traceBox(sh);
  let s = `<div class="trace" id="tr-${id}"><svg class="tracesvg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" role="img" aria-label="${esc(T.title)}: trace with your fingers">`;
  s += `<rect x="${vb.x}" y="${vb.y}" width="${vb.w}" height="${vb.h}" fill="transparent"/>`;
  if (sh === "rainbow"){
    const cols = ["#E53935","#FB8C00","#FDD835","#43A047","#1E88E5","#5E35B1"];
    cols.forEach((c,k) => { const r = 3 - k*0.25; s += `<path d="M ${-r} 0 A ${r} ${r} 0 0 1 ${r} 0" fill="none" stroke="${c}" stroke-width=".26"/>`; });
  }
  T.strokes.forEach(st => s += `<polyline points="${ptsAttr(st.pts)}" fill="none" stroke="var(--ink)" stroke-opacity=".28" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${ptsAttr(st.pts)}" fill="none" stroke="${st.c}" stroke-width=".07" stroke-dasharray=".2 .14"/>`);
  T.strokes.forEach((st,i) => s += `<polyline class="ink1" data-i="${i}" points="" fill="none" stroke="${st.c}" stroke-opacity=".55" stroke-width=".42" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline class="ink2" data-i="${i}" points="" fill="none" stroke="${st.c}" stroke-width=".42" stroke-linecap="round" stroke-linejoin="round"/>`);
  T.dots.forEach(d => s += `<g><circle cx="${d.x}" cy="${d.y}" r=".32" fill="${d.c}" stroke="#fff" stroke-width=".06"/><text x="${d.x}" y="${d.y + .12}" text-anchor="middle" font-size=".34" font-weight="700" fill="#fff" font-family="sans-serif">${d.l}</text></g>`);
  T.strokes.forEach((st,i) => s += `<circle class="mover" data-i="${i}" r=".3" fill="${st.c}" stroke="#fff" stroke-width=".07" cx="${st.pts[0][0]}" cy="${st.pts[0][1]}" opacity="0"/>`);
  s += `<g class="fingers"></g></svg>
    <div class="tracestat" data-act="stat" aria-live="polite"></div>
    <div class="tools">
      <button class="tool primary" data-act="play">▶ Show me</button>
      <button class="tool" data-act="reset">↺ Start again</button>
      <button class="tool" data-act="slow">Slower</button>
      <button class="tool" data-act="fast">Faster</button>
    </div>
    <p class="tracehelp">Touch the picture and trace the dotted lines with your fingers. Use both hands at once: red <b>L</b> for the left hand, blue <b>R</b> for the right. Your line fills in as you go. Tap “Show me” to watch first.</p></div>`;
  return s;
}
let traceAnim = null;
function wireTrace(id, sh){
  const box = $("#tr-" + id); if (!box) return;
  const T = TRACE[sh], svg = box.querySelector("svg"), movers = [...box.querySelectorAll(".mover")];
  const ink1 = [...box.querySelectorAll(".ink1")], ink2 = [...box.querySelectorAll(".ink2")];
  const fingers = box.querySelector(".fingers"), stat = box.querySelector('[data-act="stat"]');
  const loop = LOOP_SHAPES.has(sh), N = T.strokes.map(st => st.pts.length);
  let speed = 1, playing = false, t0 = 0, animRounds = 0, rounds = 0;
  // ---- tracing state ----
  let prog, phase, doneAt;
  const reset = () => {
    prog = T.strokes.map(() => 0); phase = T.strokes.map(() => 1); doneAt = T.strokes.map(() => 0);
    ink1.forEach(e => e.setAttribute("points", "")); ink2.forEach(e => e.setAttribute("points", ""));
  };
  reset();
  const label = k => T.strokes.length === 1 ? "" : (T.strokes[k].c === "#C62828" ? "L" : "R");
  function showStat(msg){
    const parts = T.strokes.map((st, k) => {
      const n = N[k] - 1; let pct = phase[k] === 1 ? prog[k] / n : 1 + (n - prog[k]) / n;
      pct = Math.round(100 * pct / (loop ? 1 : 2));
      return `<span class="chipbar" style="--c:${st.c}"><b>${label(k) || "Path"}</b><span class="track"><i style="width:${Math.min(100,pct)}%"></i></span></span>`;
    }).join("");
    stat.innerHTML = parts + `<span class="tmsg">${msg || (rounds ? `${rounds} time${rounds === 1 ? "" : "s"} round` : "")}</span>`;
  }
  showStat();
  function drawInk(k){
    const P = T.strokes[k].pts;
    if (phase[k] === 1){ ink1[k].setAttribute("points", ptsAttr(P.slice(0, prog[k] + 1))); ink2[k].setAttribute("points", ""); }
    else { ink1[k].setAttribute("points", ptsAttr(P)); ink2[k].setAttribute("points", ptsAttr(P.slice(prog[k]))); }
  }
  function strokeDone(k){
    const n = N[k] - 1;
    if (phase[k] === 1 && prog[k] >= n){
      if (loop){ doneAt[k] = performance.now(); return true; }
      phase[k] = -1; prog[k] = n; return false;
    }
    if (phase[k] === -1 && prog[k] <= 0){ doneAt[k] = performance.now(); return true; }
    return false;
  }
  function checkRound(){
    if (!doneAt.every(Boolean)) { showStat(); return; }
    rounds++;
    const together = T.strokes.length > 1 && Math.max(...doneAt) - Math.min(...doneAt) < 2000;
    const msg = together ? `Both hands together! ${rounds} time${rounds === 1 ? "" : "s"} round` : `Well done! ${rounds} time${rounds === 1 ? "" : "s"} round`;
    speak(together ? "Both hands together. Well done!" : "Well done!");
    box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
    setTimeout(() => { reset(); showStat(msg); }, 900);
    showStat(msg);
  }
  const toW = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return [r.x, r.y]; };
  const TOL = 0.8, AHEAD = 14;
  const owner = new Map(); // pointerId -> stroke index
  function nearestStroke(x, y){
    let best = -1, bd = 1e9;
    T.strokes.forEach((st, k) => {
      if (doneAt[k]) return;
      const p = st.pts[prog[k]], d = Math.hypot(p[0]-x, p[1]-y);
      const taken = [...owner.values()].includes(k);
      const score = d + (taken ? 3 : 0);
      if (score < bd){ bd = score; best = k; }
    });
    return best;
  }
  function advance(k, x, y){
    if (k < 0 || doneAt[k]) return;
    const P = T.strokes[k].pts, n = N[k] - 1;
    let moved = false;
    if (phase[k] === 1){
      for (let i = Math.min(n, prog[k] + AHEAD); i > prog[k]; i--) if (Math.hypot(P[i][0]-x, P[i][1]-y) < TOL){ prog[k] = i; moved = true; break; }
    } else {
      for (let i = Math.max(0, prog[k] - AHEAD); i < prog[k]; i++) if (Math.hypot(P[i][0]-x, P[i][1]-y) < TOL){ prog[k] = i; moved = true; break; }
    }
    if (moved){ drawInk(k); if (strokeDone(k)) checkRound(); else showStat(); }
  }
  function fingerDot(id, x, y, c){
    let el = fingers.querySelector(`[data-p="${id}"]`);
    if (!el){ el = document.createElementNS("http://www.w3.org/2000/svg", "circle"); el.setAttribute("data-p", id); el.setAttribute("r", ".38"); el.setAttribute("fill-opacity", ".35"); el.setAttribute("stroke-width", ".06"); fingers.appendChild(el); }
    el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("fill", c); el.setAttribute("stroke", c);
  }
  svg.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (playing) stopPlay();
    const [x, y] = toW(e), k = nearestStroke(x, y);
    owner.set(e.pointerId, k);
    try { svg.setPointerCapture(e.pointerId); } catch(_) {}
    fingerDot(e.pointerId, x, y, k >= 0 ? T.strokes[k].c : "#888");
    advance(k, x, y);
  });
  svg.addEventListener("pointermove", e => {
    if (!owner.has(e.pointerId)) return;
    e.preventDefault();
    const [x, y] = toW(e); let k = owner.get(e.pointerId);
    if (k < 0 || doneAt[k]){ k = nearestStroke(x, y); owner.set(e.pointerId, k); }
    fingerDot(e.pointerId, x, y, k >= 0 ? T.strokes[k].c : "#888");
    advance(k, x, y);
  });
  const up = e => { owner.delete(e.pointerId); const el = fingers.querySelector(`[data-p="${e.pointerId}"]`); if (el) el.remove(); };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up); svg.addEventListener("pointerleave", up);

  // ---- "Show me" animation ----
  const lens = T.strokes.map(st => { let L = [0]; for (let i = 1; i < st.pts.length; i++) L.push(L[i-1] + Math.hypot(st.pts[i][0]-st.pts[i-1][0], st.pts[i][1]-st.pts[i-1][1])); return L; });
  const at = (k, f) => { const L = lens[k], tot = L[L.length-1], d = f * tot, P = T.strokes[k].pts; let i = 1; while (i < L.length - 1 && L[i] < d) i++; const u = (d - L[i-1]) / ((L[i] - L[i-1]) || 1); return [P[i-1][0] + (P[i][0]-P[i-1][0])*u, P[i-1][1] + (P[i][1]-P[i-1][1])*u]; };
  const btn = box.querySelector('[data-act="play"]');
  const DUR = 7000;
  function frame(ts){
    if (!playing) return;
    const el = (ts - t0) * speed, cyc = el / DUR, r = Math.floor(cyc), fr = cyc - r;
    const f = loop ? fr : (fr < .5 ? fr * 2 : 2 - fr * 2);
    movers.forEach((m, k) => { const [x, y] = at(k, f); m.setAttribute("cx", x); m.setAttribute("cy", y); });
    if (r !== animRounds){ animRounds = r; showStat(`Watching: ${r} time${r === 1 ? "" : "s"} round`); }
    traceAnim = requestAnimationFrame(frame);
  }
  function stopPlay(){ playing = false; btn.textContent = "▶ Show me"; movers.forEach(m => m.setAttribute("opacity", "0")); showStat("Your turn! Trace with your fingers."); }
  btn.onclick = () => {
    if (playing){ stopPlay(); return; }
    playing = true; btn.textContent = "■ Stop";
    movers.forEach(m => m.setAttribute("opacity", "1"));
    if (traceAnim) cancelAnimationFrame(traceAnim);
    t0 = performance.now(); animRounds = 0; traceAnim = requestAnimationFrame(frame);
  };
  box.querySelector('[data-act="reset"]').onclick = () => { if (playing) stopPlay(); reset(); rounds = 0; showStat("Ready. Start at the dots."); };
  box.querySelector('[data-act="slow"]').onclick = () => { speed = Math.max(.4, speed - .2); };
  box.querySelector('[data-act="fast"]').onclick = () => { speed = Math.min(2, speed + .2); };
}


/* ---------- cloud sync (website version only) ---------- */
const API = "/api/progress";
const sync = { available: false, user: store.get("user", null), status: "", timer: null, busy: false, last: store.get("lastSync", 0) };
async function api(body){
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  let j = {}; try { j = await r.json(); } catch(_) {}
  if (!r.ok || !j.ok) throw Object.assign(new Error(j.error || "Couldn't reach the server. Your progress is still saved on this device."), { status: r.status });
  return j;
}
function summary(){
  return { done: PAGES.filter(p => dayStatus(p) === "full").length, started: PAGES.filter(p => dayStatus(p)).length };
}
function collect(){
  return { prog: state.prog, progT: state.progT, day: state.day, dayT: state.dayT, certname: store.get("certname", ""), summary: summary() };
}
function applyServer(d){
  if (!d) return;
  const prog = Object.assign({}, state.prog), progT = Object.assign({}, state.progT);
  for (const k of Object.keys(d.prog || {})){
    if (((d.progT || {})[k] || 0) >= (progT[k] || 0)){ prog[k] = d.prog[k]; progT[k] = (d.progT || {})[k] || 0; }
  }
  state.prog = prog; state.progT = progT; store.set("prog", prog); store.set("progT", progT);
  if ((d.dayT || 0) > (state.dayT || 0) && d.day){ state.day = d.day; state.dayT = d.dayT; store.set("day", d.day); store.set("dayT", d.dayT); }
  if (d.certname && !store.get("certname", "")) store.set("certname", d.certname);
}
function setSyncStatus(msg){ sync.status = msg; const el = $("#acct-status"); if (el) el.textContent = msg; updateAcctBtn(); }
function updateAcctBtn(){
  const b = $("#nav-acct"); if (!b) return;
  b.hidden = !sync.available;
  b.textContent = sync.user ? sync.user.name + (sync.status.startsWith("Couldn't") ? " · offline" : " · saved") : "Sign in";
}
function scheduleSave(){
  if (!sync.available || !sync.user) return;
  clearTimeout(sync.timer); sync.timer = setTimeout(saveNow, 1500);
}
async function saveNow(){
  if (!sync.available || !sync.user || sync.busy) return;
  sync.busy = true;
  try {
    const j = await api({ action: "save", name: sync.user.name, code: sync.user.code, data: collect() });
    applyServer(j.data); sync.last = Date.now(); store.set("lastSync", sync.last);
    setSyncStatus("All progress saved.");
  } catch(e){ setSyncStatus(e.message); }
  finally { sync.busy = false; }
}
async function pullAndMerge(){
  try {
    const j = await api({ action: "load", name: sync.user.name, code: sync.user.code });
    applyServer(j.data); await saveNow(); render();
  } catch(e){
    if (e.status === 404){ sync.user = null; store.set("user", null); setSyncStatus("Please sign in again."); }
    else setSyncStatus(e.message);
  }
}
async function checkSync(){
  try { await api({ action: "health" }); sync.available = true; } catch(_) { sync.available = false; }
  updateAcctBtn();
  if (sync.available && sync.user) pullAndMerge();
}
window.addEventListener("online", () => scheduleSave());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); else if (sync.user) pullAndMerge(); });

function verseBlock(p, lab){
  const words = p.v.split(/\s+/);
  return `<section class="panel verse" aria-label="${lab}">
    <div class="label"><b class="lb-verse">${lab}</b>${speakBtn("sp-verse", "Hear verse")}</div>
    <div class="vtext" id="vtext">${words.map((w,i) => `<span class="w" data-i="${i}" data-f="${esc(w.replace(/^([^A-Za-z]*[A-Za-z]).*$/, "$1"))}">${esc(w)}</span>`).join("")}</div>
    <div class="vref">— ${esc(p.vr)}</div>
    <div class="vtools">
      <button class="pill" id="v-more">Hide some words</button>
      <button class="pill" id="v-first">First letters only</button>
      <button class="pill" id="v-show">Show all</button>
    </div>
  </section>`;
}
function wireVerse(p){
  const spans = [...document.querySelectorAll("#vtext .w")];
  let level = 0;
  const apply = mode => spans.forEach((s,i) => {
    s.classList.remove("hid","first");
    if (mode === "some" && i % 3 === 1) s.classList.add("hid");
    if (mode === "more" && i % 3 !== 0) s.classList.add("hid");
    if (mode === "first") s.classList.add("first");
  });
  $("#v-more").onclick = () => { level = level === 0 ? 1 : 2; apply(level === 1 ? "some" : "more"); $("#v-more").textContent = "Hide more words"; };
  $("#v-first").onclick = () => { level = 3; apply("first"); };
  $("#v-show").onclick = () => { level = 0; apply("none"); $("#v-more").textContent = "Hide some words"; };
  spans.forEach(s => s.addEventListener("click", () => s.classList.remove("hid","first")));
  const sv = $("#sp-verse"); if (sv) sv.onclick = () => speak(p.v + ". " + p.vr.replace(":", ", verse "));
}
function checksBlock(p){
  const pr = dayProg(p.day);

let S = null; // studio state
function newPuzzle(){
  const key = state.fig, free = key === "free";
  const f = free ? null : SFIG[key];
  const ids = ["LT1","LT2","MT","ST1","ST2","SQ","PA"];
  const slotFor = id => f && f.slots.find(s => s.id === id);
  // target bbox
  let tb;
  if (f){
    const all = f.slots.flatMap(s => s.pts).concat(f.extras.flatMap(e => [e[1],e[2]])).concat(f.beak||[]);
    tb = bbox(all);
  } else tb = { x0: 0, y0: -6, x1: 12, y1: 0, w: 12, h: 6 };
  // pieces used: those in the figure (free/square: all 7)
  const used = f ? f.slots.map(s => s.id) : ids;
  const trayW = Math.max(tb.w, 11);
  const x0 = tb.x0 + tb.w/2 - trayW/2;
  // shelf-pack pieces below target
  let cx = x0, cy = tb.y1 + 1.2, rowH = 0; const pieces = [];
  const order = used.slice().sort((a,b) => "LLMSSP".indexOf(a[0]) - "LLMSSP".indexOf(b[0]));
  order.forEach((id, i) => {
    const kind = kindOf(id);
    let ang = 0, flip = false;
    const sl = slotFor(id);
    if (sl && state.mode === "easy"){ ang = sl.rot.ang; flip = sl.rot.flip; }
    else if (state.mode === "hard"){ ang = 45 * ((i * 3 + 1) % 8); }
    const b = bbox(placed(kind, ang, flip, 0, 0));
    if (cx + b.w > x0 + trayW + .01){ cx = x0; cy += rowH + .6; rowH = 0; }
    pieces.push({ id, kind, ang, flip, x: cx - b.x0, y: cy - b.y0, locked: false });
    cx += b.w + .6; rowH = Math.max(rowH, b.h);
  });
  const trayBottom = cy + rowH + .6;
  const vb = { x: Math.min(tb.x0, x0) - .6, y: tb.y0 - .6, w: Math.max(tb.w, trayW) + 1.2, h: trayBottom - tb.y0 + .6 };
  S = { key, f, pieces, vb, trayTop: tb.y1 + .6, sel: null, filled: {}, won: false };
}

}
const selPiece = () => S.pieces.find(p => p.id === S.sel);
function turnSel(d){ const p = selPiece(); if (p && !p.locked){ p.ang = (p.ang + d + 360) % 360; afterMove(p); } }
function setStatus(msg){
  const st = $("#status"); if (!st) return;
  if (msg){ st.textContent = msg; return; }
  if (!S.f){ st.className = "status"; st.textContent = "Free play: make anything you like. Tap a piece to turn it."; return; }
  const n = Object.keys(S.filled).length, t = S.f.slots.length;
  st.className = "status" + (S.won ? " win pop" : "");
  st.textContent = S.won ? `Wonderful! You built it: ${S.f.name}!` : `${n} of ${t} pieces in place.`;
}
function drawStage(){
  const vb = S.vb, stage = $("#stage");
  let s = `<svg id="svg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" aria-label="Tangram board">`;
  s += `<rect x="${vb.x}" y="${S.trayTop}" width="${vb.w}" height="${vb.y + vb.h - S.trayTop}" style="fill:var(--tray)"/>`;
  if (S.f){
    S.f.extras.forEach(([t,a,c]) => s += `<line x1="${a[0]}" y1="${a[1]}" x2="${c[0]}" y2="${c[1]}" stroke="${t==="mast"?"#8D6E63":"#BDBDBD"}" stroke-width=".22" stroke-linecap="round"/>`);
    S.f.slots.forEach(sl => {
      const style = state.hint === "colors" ? `fill:${COL[sl.id]};fill-opacity:.28` : state.hint === "lines" ? "fill:var(--target)" : "fill:var(--target);stroke:var(--target)";
      s += `<polygon class="slot" points="${sl.pts.map(p=>p.join(",")).join(" ")}" style="${style}"/>`;
    });
    if (S.f.beak) s += `<polygon points="${S.f.beak.map(p=>p.join(",")).join(" ")}" fill="#FFB300" stroke="#111" stroke-width=".04"/>`;
  }
  // pieces: locked first, then others, selected on top
  const order = S.pieces.slice().sort((a,b) => (b.locked - a.locked) || ((a.id===S.sel) - (b.id===S.sel)));
  order.forEach(p => {
    const pts = placed(p.kind, p.ang, p.flip, p.x, p.y);
    s += `<polygon class="piece ${p.locked?"locked":""} ${p.id===S.sel?"sel":""}" data-id="${p.id}" points="${pts.map(q=>q.map(v=>v.toFixed(3)).join(",")).join(" ")}" fill="${COL[p.id]}"/>`;
  });
  if (S.f && S.f.eye && S.won) s += `<circle cx="${S.f.eye[0]}" cy="${S.f.eye[1]}" r=".13" fill="#fff" stroke="#111" stroke-width=".05"/>`;
  s += "</svg>";
  stage.innerHTML = s;
  wireStage();
}
function toWorld(svg, e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return [r.x, r.y];
}
function wireStage(){
  const svg = $("#svg");
  let drag = null;
  svg.querySelectorAll(".piece").forEach(el => {
    el.addEventListener("pointerdown", e => {
      const p = S.pieces.find(q => q.id === el.dataset.id);
      S.sel = p.id;
      if (p.locked){ drawStage(); return; }
      e.preventDefault();
      const [wx, wy] = toWorld(svg, e);
      drag = { p, dx: wx - p.x, dy: wy - p.y, sx: e.clientX, sy: e.clientY, moved: false, el };
      svg.appendChild(el); el.classList.add("sel");
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
    });
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
    const [wx, wy] = toWorld(svg, e);
    const p = drag.p;
    p.x = Math.max(S.vb.x + .3, Math.min(S.vb.x + S.vb.w - .3, wx - drag.dx));
    p.y = Math.max(S.vb.y + .3, Math.min(S.vb.y + S.vb.h - .3, wy - drag.dy));
    drag.el.setAttribute("points", placed(p.kind, p.ang, p.flip, p.x, p.y).map(q => q.map(v=>v.toFixed(3)).join(",")).join(" "));
  });
  const end = () => {
    if (!drag) return;
    const p = drag.p, moved = drag.moved; drag = null;
    if (!moved) p.ang = (p.ang + 45) % 360;
    afterMove(p);
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
}
function afterMove(p){
  if (S.f && !p.locked) trySnap(p);
  drawStage(); setStatus();
}
function trySnap(p){
  const pts0 = placed(p.kind, p.ang, p.flip, 0, 0);
  for (const sl of S.f.slots){
    if (S.filled[sl.id] || sl.kind !== p.kind) continue;
    if (Math.hypot(p.x - sl.c[0], p.y - sl.c[1]) > 1.0) continue;
    const moved = pts0.map(q => [q[0] + sl.c[0], q[1] + sl.c[1]]);
    if (sameShape(moved, sl.pts, 0.12)){
      p.x = sl.c[0]; p.y = sl.c[1]; p.locked = true; S.filled[sl.id] = p.id; S.sel = null;
      if (Object.keys(S.filled).length === S.f.slots.length){ S.won = true; speak("Wonderful! You built the picture: " + S.f.name + "!"); }
      return true;
    }
  }
  return false;
}
function helpOne(){
  if (!S.f || S.won) return;
  const sl = S.f.slots.find(s => !S.filled[s.id]); if (!sl) return;
  const p = S.pieces.find(q => !q.locked && q.id === sl.id) || S.pieces.find(q => !q.locked && q.kind === sl.kind);
  if (!p) return;
  p.ang = sl.rot.ang; p.flip = sl.rot.flip; p.x = sl.c[0]; p.y = sl.c[1];
  trySnap(p); drawStage(); setStatus();
}

/* keyboard: arrows move selected, R turns */
document.addEventListener("keydown", e => {
  if (state.view !== "tan" || !S || !S.sel) return;
  const p = selPiece(); if (!p || p.locked) return;
  const d = { ArrowLeft:[-.25,0], ArrowRight:[.25,0], ArrowUp:[0,-.25], ArrowDown:[0,.25] }[e.key];
  if (d){ e.preventDefault(); p.x += d[0]; p.y += d[1]; afterMove(p); }
  else if (e.key === "r" || e.key === "R"){ turnSel(45); }
});

setView("day");
checkSync();
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
