One thing I know, that, whereas I was blind, now I see."],["Luke 17:17","Were there not ten cleansed? but where are the nine?"],["Mark 10:51","Lord, that I might receive my sight."]],"story_titles":["The Mustard Seed","The Hidden Treasure","The Good Shepherd","The Blind Man Sees","The One Who Came Back","Blind Bartimaeus"]},{"kind":"story","day":253,"week":37,"book":"Luke","title":"Zacchaeus Climbs a Tree","ref":"Luke 19:1-10","story":"Short Zacchaeus climbed a sycamore tree to see Jesus. Jesus called him down and went to his house! Zacchaeus changed and paid back four times what he had taken.","n":4,"w":"times over Zacchaeus paid people back","v":"For the Son of man is come to seek and to save that which was lost.","vr":"Luke 19:10","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do it 4 times, for the number 4 in today's story.","craft":"Make the tangram tree. Place a tiny stick figure in the branches for Zacchaeus.","tg":"tree","q":"How did Zacchaeus change after meeting Jesus?","prev":"Blind Bartimaeus","joy":"Say the books of the Bible you remember.","brain":"Climb the tree: reach up with your right hand, then the left, reaching across to the opposite side each time. 8 reaches up the sycamore tree.","trace":null},{"kind":"story","day":254,"week":37,"book":"Matthew","title":"Workers at the Eleventh Hour","ref":"Matthew 20:1-16","story":"A farmer hired workers all day. At the eleventh hour, near the end of the day, he hired more. He paid them all a full day's wage. It's never too late to work for God!","n":11,"w":"(the eleventh hour)","v":"So the last shall be first, and the first last.","vr":"Matthew 20:16","move":"Heel raises: Keep your toes on the floor and lift your heels up, then lower them. Do it 11 times, for the number 11 in today's story.","craft":"Point to 11 on a clock. Think of one thing you can still do for God today.","tg":null,"q":"Why is it never too late to serve God?","prev":"Zacchaeus Climbs a Tree","joy":"Help prepare a simple meal or snack."},{"kind":"story","day":255,"week":37,"book":"Matthew","title":"The Ten Virgins","ref":"Matthew 25:1-13","story":"Ten young women waited for the bridegroom. Five were wise and brought extra oil for their lamps. Five were foolish. When he came, the wise ones were ready.","n":5,"w":"wise virgins (and 5 foolish)","v":"Watch therefore, for ye know neither the day nor the hour wherein the Son of man cometh.","vr":"Matthew 25:13","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 5 times, for the number 5 in today's story.","craft":"Make the tangram candle. Line up 10 buttons: 5 of one color for wise, 5 of another for foolish.","tg":"candle","q":"How can we be ready for Jesus to come?","prev":"Workers at the Eleventh Hour","joy":"Take a short walk to the mailbox or porch.","brain":"Wise and foolish: open 5 fingers on your right hand. Fold them down one at a time while your left hand opens one at a time.","trace":null},{"kind":"story","day":256,"week":37,"book":"Matthew","title":"The Talents","ref":"Matthew 25:14-30","story":"A master gave his servants five talents, two talents, and one talent. Two servants used their talents and doubled them. The master said, 'Well done, good and faithful servant!'","n":5,"w":"talents given to the first servant","v":"Well done, thou good and faithful servant.","vr":"Matthew 25:21","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do it 5 times, for the number 5 in today's story.","craft":"Make a list with your helper of your talents: cooking, singing, praying, encouraging, knitting, telling stories.","tg":null,"q":"What talent can you still use for God?","prev":"The Ten Virgins","joy":"Tell your helper what you want to do first in heaven.","brain":"Talent fingers: show 5 on the right and 2 on the left, then 2 on the right and 1 on the left, then 1 on the right and 5 on the left.","trace":null},{"kind":"story","day":257,"week":37,"book":"Matthew","title":"The Least of These","ref":"Matthew 25:31-40","story":"Jesus said when we feed the hungry, give drink to the thirsty, welcome strangers, clothe the needy, visit the sick and those in prison, we do it for Him. That is six kind deeds.","n":6,"w":"kind deeds Jesus named","v":"Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.","vr":"Matthew 25:40","move":"Knock-knock: Knock gently on the table with your knuckles. Do it 6 times, for the number 6 in today's story.","craft":"Fold a small card and write a kind note for someone who is sick or lonely. Your helper can mail it.","tg":null,"q":"Who could you send a kind note to?","prev":"The Talents","joy":"Feel something new: tree bark, wool, a smooth stone."},{"kind":"story","day":258,"week":37,"book":"John","title":"Lazarus, Come Forth!","ref":"John 11:1-44","story":"Jesus' friend Lazarus died. Jesus said he was only sleeping. After four days, Jesus called, 'Lazarus, come forth!' and Lazarus walked out alive!","n":4,"w":"days Lazarus was in the tomb","v":"I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live.","vr":"John 11:25","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do it 4 times, for the number 4 in today's story.","craft":"Wrap a clothespin or popsicle stick in a strip of white cloth or toilet paper. Then unwrap it: 'Loose him, and let him go!'","tg":null,"q":"Who do you look forward to seeing on resurrection morning?","prev":"The Least of These","joy":"Say the memory verses you remember from this week.","brain":"Resurrection and life: trace the infinity sign with your finger, round and round, saying 'I am the resurrection, and the life.' Then trace it with the other hand.","trace":"infinity"},{"kind":"sabbath","day":259,"week":37,"title":"Sabbath Rest","v":"There remaineth therefore a rest to the people of God.","vr":"Hebrews 4:9","hymn":"Jesus, Keep Me Near the Cross","review":[["Luke 19:10","For the Son of man is come to seek and to save that which was lost."],["Matthew 20:16","So the last shall be first, and the first last."],["Matthew 25:13","Watch therefore, for ye know neither the day nor the hour wherein the Son of man cometh."],["Matthew 25:21","Well done, thou good and faithful servant."],["Matthew 25:40","Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me."],["John 11:25","I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live."]],"story_titles":["Zacchaeus Climbs a Tree","Workers at the Eleventh Hour","The Ten Virgins","The Talents","The Least of These","Lazarus, Come Forth!"]},{"kind":"story","day":260,"week":38,"book":"John","title":"Jesus Wept","ref":"John 11:32-36","story":"When Jesus saw Mary and her friends crying, He cried too. The shortest verse in the Bible has only two words: 'Jesus wept.' Jesus feels our sorrow.","n":2,"w":"words in the shortest verse","v":"Jesus wept.","vr":"John 11:35","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Hold a soft handkerchief. Jesus cares when we are sad. Share something that has been heavy on your heart.","tg":null,"q":"How does it help to know Jesus understands our tears?","prev":"Lazarus, Come Forth!","joy":"Draw or color something just for fun."},{"kind":"story","day":261,"week":38,"book":"John","title":"Mary's Precious Perfume","ref":"John 12:1-8; Mark 14:8","story":"Mary poured a pound of costly perfume, worth three hundred pence, on Jesus' feet and wiped them with her hair. The house was filled with the sweet smell.","n":3,"w":"(300 pence worth: count 3 hundreds)","v":"She hath done what she could.","vr":"Mark 14:8","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Rub sweet-smelling lotion on your hands and your helper's hands. Smell a flower or some spice.","tg":null,"q":"What can you do for Jesus with what you have?","prev":"Jesus Wept","joy":"Give away something you no longer need."},{"kind":"story","day":262,"week":38,"book":"Matthew","title":"Palm Sunday","ref":"Matthew 21:1-11","story":"Jesus rode into Jerusalem. The disciples brought a donkey and a colt. The people waved palm branches and shouted, 'Hosanna! Blessed is he that cometh in the name of the Lord!'","n":2,"w":"animals brought: a donkey and a colt","v":"Blessed is he that cometh in the name of the Lord.","vr":"Matthew 21:9","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Find a leafy branch or long leaf and wave it while singing 'Hosanna!'","tg":null,"q":"What did the people shout?","prev":"Mary's Precious Perfume","joy":"Pray for your church and your pastor."},{"kind":"story","day":263,"week":38,"book":"Mark","title":"The Widow's Two Mites","ref":"Mark 12:41-44","story":"Rich people put lots of money in the temple box. A poor widow put in two tiny coins. Jesus said she gave more than all of them, because she gave all she had.","n":2,"w":"tiny coins the widow gave","v":"This poor widow hath cast more in, than all they which have cast into the treasury.","vr":"Mark 12:43","move":"Knee pats: Pat your knees with both hands. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Drop 2 pennies into a jar. Every gift given with love matters to God.","tg":null,"q":"Why did Jesus say the widow gave the most?","prev":"Palm Sunday","joy":"Pet an animal or watch the birds for a while."},{"kind":"story","day":264,"week":38,"book":"John","title":"I Will Come Again","ref":"John 14:1-6","story":"Jesus told His sad disciples, 'Don't be troubled. In my Father's house are many mansions. I will come again and take you there.' He is the way, the truth and the life.","n":3,"w":"things Jesus is: the way, the truth, the life","v":"I go to prepare a place for you. And if I go and prepare a place for you, I will come again, and receive you unto myself.","vr":"John 14:2-3","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram house as your heavenly mansion. What would you like it to have?","tg":"house","q":"What do you think your home in heaven will be like?","prev":"The Widow's Two Mites","joy":"Listen to a sermon or Bible reading."},{"kind":"story","day":265,"week":38,"book":"John","title":"Jesus Washes Feet","ref":"John 13:1-17","story":"At the last supper, Jesus took a towel and a basin and washed His twelve disciples' feet. He said, 'You should also wash one another's feet.'","n":12,"w":"disciples' feet Jesus washed","v":"If I then, your Lord and Master, have washed your feet; ye also ought to wash one another's feet.","vr":"John 13:14","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 12 times, for the number 12 in today's story.","craft":"Soak your feet in a basin of warm water. Your helper can gently dry them. Wiggle your toes!","tg":null,"q":"How can we serve each other humbly?","prev":"I Will Come Again","joy":"Remember a time God answered prayer, and tell it.","brain":"Hand to foot: lean forward gently and touch your right hand to your left shin or foot, then your left hand to your right. 6 times, slowly.","trace":null},{"kind":"sabbath","day":266,"week":38,"title":"Sabbath Rest","v":"And from one sabbath to another, shall all flesh come to worship before me, saith the LORD.","vr":"Isaiah 66:23","hymn":"'Tis So Sweet to Trust in Jesus","review":[["John 11:35","Jesus wept."],["Mark 14:8","She hath done what she could."],["Matthew 21:9","Blessed is he that cometh in the name of the Lord."],["Mark 12:43","This poor widow hath cast more in, than all they which have cast into the treasury."],["John 14:2-3","I go to prepare a place for you. And if I go and prepare a place for you, I will come again, and receive you unto myself."],["John 13:14","If I then, your Lord and Master, have washed your feet; ye also ought to wash one another's feet."]],"story_titles":["Jesus Wept","Mary's Precious Perfume","Palm Sunday","The Widow's Two Mites","I Will Come Again","Jesus Washes Feet"]},{"kind":"story","day":267,"week":39,"book":"Luke","title":"The Lord's Supper","ref":"Luke 22:14-20","story":"Jesus took bread and the cup. He said the bread is His body and the cup is His blood, given for us. 'This do in remembrance of me.'","n":2,"w":"symbols: the bread and the cup","v":"This do in remembrance of me.","vr":"Luke 22:19","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Set a small plate with a piece of bread and a small cup of grape juice. Pray and thank Jesus.","tg":null,"q":"What does Jesus want us to remember?","prev":"Jesus Washes Feet","joy":"Sort buttons, coins or beans by color."},{"kind":"story","day":268,"week":39,"book":"John","title":"The Vine and the Branches","ref":"John 15:1-8","story":"Jesus said, 'I am the vine, ye are the branches.' A branch that stays connected to the vine grows fruit. We stay close to Jesus every day.","n":null,"w":"","v":"I am the vine, ye are the branches.","vr":"John 15:5","move":"Branches: stretch both arms out to the sides like branches, then bring them in to hug yourself. 8 times.","craft":"Find a leafy twig or a bunch of grapes on the stem. See how each grape is joined to the vine.","tg":null,"q":"How do you stay connected to Jesus each day?","prev":"The Lord's Supper","joy":"Rest well tonight: sleep is God's good gift.","brain":"Two vines: trace the two wavy lines at the same time with a finger of each hand, like vines growing side by side.","trace":"waves"},{"kind":"story","day":269,"week":39,"book":"Matthew","title":"Jesus Prays in the Garden","ref":"Matthew 26:36-46; Luke 22:42","story":"In Gethsemane, Jesus prayed three times, 'Not my will, but thine, be done.' His three closest disciples fell asleep.","n":3,"w":"times Jesus prayed in the garden","v":"Nevertheless not my will, but thine, be done.","vr":"Luke 22:42","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Sit outside or by a plant. Fold your hands and pray the verse three times.","tg":null,"q":"What does it mean to pray 'Thy will be done'?","prev":"The Vine and the Branches","joy":"Call or send a card to someone you love."},{"kind":"story","day":270,"week":39,"book":"Mark","title":"The Rooster Crows","ref":"Mark 14:66-72; Luke 22:61","story":"Peter said three times, 'I don't know Him.' The rooster crowed twice. Jesus turned and looked at Peter with love, and Peter went out and wept.","n":2,"w":"times the rooster crowed","v":"And the Lord turned, and looked upon Peter.","vr":"Luke 22:61","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Draw a rooster, or make a rooster sound together! Then talk about how Jesus forgave Peter.","tg":null,"q":"Jesus still loved Peter. How does He treat us when we fail?","prev":"Jesus Prays in the Garden","joy":"Name 3 things you are thankful for today."},{"kind":"story","day":271,"week":39,"book":"Luke","title":"I Find No Fault in Him","ref":"Luke 23:13-25; John 19:1-5","story":"Jesus was put on trial. Soldiers put a crown of thorns on His head. Pilate said three times, 'I find no fault in him,' but still gave Him to be crucified.","n":3,"w":"times Pilate said Jesus was not guilty","v":"I find no fault in him.","vr":"John 19:4","move":"Toe taps: Keep your heels on the floor and tap your toes. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Hold a small twig with thorns (carefully!) or a rough stick. Jesus wore a crown of thorns so we could wear a crown of life.","tg":null,"q":"Why did Jesus let Himself be treated this way?","prev":"The Rooster Crows","joy":"Sing your favorite hymn, all the way through."},{"kind":"story","day":272,"week":39,"book":"Luke","title":"Father, Forgive Them","ref":"Luke 23:33-34","story":"Jesus was nailed to a cross between two thieves. Three crosses stood on the hill. Jesus prayed for the soldiers: 'Father, forgive them.'","n":3,"w":"crosses on the hill","v":"Father, forgive them; for they know not what they do.","vr":"Luke 23:34","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Tie 2 popsicle sticks (or twigs) together with string to make a small cross.","tg":"sticks","q":"Who did Jesus forgive from the cross?","prev":"I Find No Fault in Him","joy":"Look at an old photo and tell the story behind it.","brain":"Draw the cross: with your right hand draw a line up and down in the air while your left hand draws a line side to side at the same time. Tricky! Then switch hands.","trace":"cross"},{"kind":"sabbath","day":273,"week":39,"title":"Sabbath Rest","v":"Therefore the Son of man is Lord also of the sabbath.","vr":"Mark 2:28","hymn":"O for a Thousand Tongues to Sing","review":[["Luke 22:19","This do in remembrance of me."],["John 15:5","I am the vine, ye are the branches."],["Luke 22:42","Nevertheless not my will, but thine, be done."],["Luke 22:61","And the Lord turned, and looked upon Peter."],["John 19:4","I find no fault in him."],["Luke 23:34","Father, forgive them; for they know not what they do."]],"story_titles":["The Lord's Supper","The Vine and the Branches","Jesus Prays in the Garden","The Rooster Crows","I Find No Fault in Him","Father, Forgive Them"]},{"kind":"story","day":274,"week":40,"book":"Luke","title":"Lord, Remember Me","ref":"Luke 23:39-43","story":"One of the thieves said, 'Lord, remember me when thou comest into thy kingdom.' Jesus promised he would be with Him in paradise.","n":2,"w":"thieves beside Jesus","v":"Lord, remember me when thou comest into thy kingdom.","vr":"Luke 23:42","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Even when we forget things, Jesus never forgets us! Say today's verse together three times.","tg":null,"q":"What did the thief ask Jesus?","prev":"Father, Forgive Them","joy":"Pray for a neighbor by name."},{"kind":"story","day":275,"week":40,"book":"John","title":"It Is Finished","ref":"John 19:28-30; Matthew 27:45","story":"Darkness covered the land from the sixth to the ninth hour. Jesus spoke seven times from the cross. His last words were, 'It is finished.' He paid for our sins.","n":7,"w":"sayings of Jesus on the cross","v":"It is finished.","vr":"John 19:30","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 7 times, for the number 7 in today's story.","craft":"Make a cross from 2 popsicle sticks. Place a small paper heart beside it.","tg":"sticks","q":"What did Jesus finish on the cross?","prev":"Lord, Remember Me","joy":"Water a plant or put out seed for the birds."},{"kind":"story","day":276,"week":40,"book":"Matthew","title":"The Veil Is Torn","ref":"Matthew 27:50-51; Hebrews 10:19-20","story":"When Jesus died, the thick temple curtain tore in two from top to bottom. The way to God was opened for everyone through Jesus.","n":2,"w":"pieces the veil tore into","v":"Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus.","vr":"Hebrews 10:19","move":"Hand claps: Clap your hands together, nice and steady. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Tear a sheet of paper in two, from top to bottom. Jesus opened the way to God!","tg":null,"q":"Why was the veil torn from top to bottom?","prev":"It Is Finished","joy":"Sit in the sunshine for 10 minutes."},{"kind":"story","day":277,"week":40,"book":"Luke","title":"Resting on the Sabbath","ref":"Luke 23:50-56","story":"Joseph laid Jesus in a new tomb on Friday. On the Sabbath, Jesus rested in the tomb, and His friends rested according to the commandment. On the first day, He rose.","n":3,"w":"days: Friday, Sabbath, Sunday","v":"And they... rested the sabbath day according to the commandment.","vr":"Luke 23:56","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Roll a round stone in front of a paper cup lying on its side, like the stone at the tomb.","tg":null,"q":"Even in death, Jesus kept the Sabbath. What does that tell us?","prev":"The Veil Is Torn","joy":"Drink a full glass of water, and thank God for it."},{"kind":"story","day":278,"week":40,"book":"Matthew","title":"He Is Risen!","ref":"Matthew 28:1-8","story":"Early on the first day of the week, an angel rolled away the stone. He told the women, 'He is not here: for he is risen, as he said.' Jesus is alive!","n":3,"w":"(Jesus rose on the third day)","v":"He is not here: for he is risen, as he said.","vr":"Matthew 28:6","move":"He is risen! Raise both arms high and say 'He is risen!' 3 times. Then clap 3 times.","craft":"Put a flower in a small cup or vase for Resurrection joy. Sing 'He Lives' or another resurrection song.","tg":null,"q":"How does Jesus' resurrection give you hope?","prev":"Resting on the Sabbath","joy":"Give someone a kind compliment.","brain":"Rise up: cross your arms over your chest, then lift them up and open wide, saying 'He is risen!' Change which arm is on top each time. 6 times.","trace":null},{"kind":"story","day":279,"week":40,"book":"John","title":"Jesus Calls Mary by Name","ref":"John 20:11-18; Luke 8:2","story":"Mary Magdalene, whom Jesus had freed from seven devils, wept at the tomb. Jesus said, 'Mary.' She knew His voice right away and ran to tell the disciples.","n":7,"w":"devils Jesus had cast out of Mary","v":"He calleth his own sheep by name, and leadeth them out.","vr":"John 10:3","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 7 times, for the number 7 in today's story.","craft":"Say the names of 7 people you love. Jesus knows every one of their names too.","tg":null,"q":"How did Mary know it was Jesus?","prev":"He Is Risen!","joy":"Tell your helper about a happy day from your childhood."},{"kind":"sabbath","day":280,"week":40,"title":"Sabbath Rest","v":"And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I am the LORD your God.","vr":"Ezekiel 20:20","hymn":"Blest Be the Tie That Binds","review":[["Luke 23:42","Lord, remember me when thou comest into thy kingdom."],["John 19:30","It is finished."],["Hebrews 10:19","Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus."],["Luke 23:56","And they... rested the sabbath day according to the commandment."],["Matthew 28:6","He is not here: for he is risen, as he said."],["John 10:3","He calleth his own sheep by name, and leadeth them out."]],"story_titles":["Lord, Remember Me","It Is Finished","The Veil Is Torn","Resting on the Sabbath","He Is Risen!","Jesus Calls Mary by Name"]},{"kind":"story","day":281,"week":41,"book":"Luke","title":"The Road to Emmaus","ref":"Luke 24:13-35","story":"Two sad disciples walked to Emmaus. Jesus walked with them and explained the Scriptures. At supper, they knew Him when He broke the bread!","n":2,"w":"disciples walking to Emmaus","v":"Did not our heart burn within us, while he talked with us by the way, and while he opened to us the scriptures?","vr":"Luke 24:32","move":"Walk to Emmaus: with your helper, take 2 short walks today of 20 steps each (or march 20 times seated, twice).","craft":"Take a short walk with your helper and talk about a favorite Bible promise.","tg":null,"q":"How did they know it was Jesus?","prev":"Jesus Calls Mary by Name","joy":"Listen to some beautiful music.","brain":"Walk with Jesus: 20 cross-over steps (hand to opposite knee), naming something you remember about Jesus every 5 steps.","trace":null},{"kind":"story","day":282,"week":41,"book":"John","title":"Doubting Thomas","ref":"John 20:24-29","story":"Thomas said he would not believe unless he saw Jesus. Eight days later, Jesus came and showed him His hands. Thomas said, 'My Lord and my God!'","n":8,"w":"days Thomas waited","v":"Blessed are they that have not seen, and yet have believed.","vr":"John 20:29","move":"Knock-knock: Knock gently on the table with your knuckles. Do it 8 times, for the number 8 in today's story.","craft":"Look at your own hands. Jesus' hands still have the nail prints, because He loves us.","tg":null,"q":"What did Thomas say when he saw Jesus?","prev":"The Road to Emmaus","joy":"Smell a flower, a spice, or a piece of fresh fruit."},{"kind":"story","day":283,"week":41,"book":"John","title":"Breakfast by the Sea","ref":"John 21:1-14","story":"The disciples fished all night and caught nothing. Jesus said, 'Cast the net on the right side.' They caught 153 big fish! Jesus made them breakfast on the shore.","n":null,"w":"","v":"Cast the net on the right side of the ship, and ye shall find.","vr":"John 21:6","move":"153 fish: march in your chair while counting to 15, then clap 3 times. (1-5-3!) Do it once more.","craft":"Make the tangram fish or boat. Share a warm breakfast or snack with your helper.","tg":"fish","q":"How many fish did they catch?","prev":"Doubting Thomas","joy":"Teach your helper something you know how to do."},{"kind":"story","day":284,"week":41,"book":"John","title":"Lovest Thou Me?","ref":"John 21:15-17","story":"Jesus asked Peter three times, 'Do you love me?' Peter said, 'Lord, thou knowest that I love thee.' Jesus said, 'Feed my sheep.' Peter was forgiven.","n":3,"w":"times Jesus asked Peter 'Lovest thou me?'","v":"Lord, thou knowest all things; thou knowest that I love thee.","vr":"John 21:17","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make a card that says 'I love You, Jesus.' Decorate it with a heart.","tg":null,"q":"Tell Jesus you love Him in your own words.","prev":"Breakfast by the Sea","joy":"Hold hands with your helper and pray together."},{"kind":"story","day":285,"week":41,"book":"Acts","title":"Jesus Goes Up to Heaven","ref":"Acts 1:3-11","story":"After forty days, Jesus went up to heaven in a cloud. Two men in white said, 'This same Jesus will come again just like you saw Him go.'","n":2,"w":"men in white who gave the promise","v":"This same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven.","vr":"Acts 1:11","move":"Look up: slowly tip your head back to look up at the ceiling, then bring it back down. 2 times, gently. Then lift both arms up 5 times.","craft":"Glue cotton balls on blue paper as the cloud. Draw a small figure going up into it.","tg":null,"q":"How will Jesus come back?","prev":"Lovest Thou Me?","joy":"Step outside and take 5 deep breaths of fresh air.","brain":"Eyes up: keep your head still and follow your helper's finger with your eyes as it goes slowly up, then side to side, then in a big circle.","trace":null},{"kind":"story","day":286,"week":41,"book":"Acts","title":"Ten Days of Prayer","ref":"Acts 1:12-15","story":"After Jesus went to heaven, about 120 believers met in an upper room. For about ten days they prayed together with one heart, waiting for the Holy Spirit.","n":10,"w":"days of prayer before Pentecost","v":"These all continued with one accord in prayer and supplication.","vr":"Acts 1:14","move":"Elbow touches: Put your hands on your shoulders. Bring your elbows together in front, then open them wide. Do it 10 times, for the number 10 in today's story.","craft":"Make a prayer list of 10 people. Pray for one each day for the next 10 days.","tg":null,"q":"Who is on your heart to pray for?","prev":"Jesus Goes Up to Heaven","joy":"Make a list of people to pray for this week."},{"kind":"sabbath","day":287,"week":41,"title":"Sabbath Rest","v":"And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.","vr":"Genesis 2:3","hymn":"He Leadeth Me","review":[["Luke 24:32","Did not our heart burn within us, while he talked with us by the way, and while he opened to us the scriptures?"],["John 20:29","Blessed are they that have not seen, and yet have believed."],["John 21:6","Cast the net on the right side of the ship, and ye shall find."],["John 21:17","Lord, thou knowest all things; thou knowest that I love thee."],["Acts 1:11","This same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven."],["Acts 1:14","These all continued with one accord in prayer and supplication."]],"story_titles":["The Road to Emmaus","Doubting Thomas","Breakfast by the Sea","Lovest Thou Me?","Jesus Goes Up to Heaven","Ten Days of Prayer"]},{"kind":"story","day":288,"week":42,"book":"Acts","title":"The Day of Pentecost","ref":"Acts 2:1-4, 38-41","story":"The Holy Spirit came like a rushing wind and tongues of fire. Peter preached, and three thousand people were baptized that day!","n":3,"w":"(3,000 were baptized: count 3)","v":"Repent, and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Ghost.","vr":"Acts 2:38","move":"Knee pats: Pat your knees with both hands. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram candle for the flame of the Spirit. Or wave a paper fan to feel the 'rushing wind.'","tg":"candle","q":"What does the Holy Spirit do for us?","prev":"Ten Days of Prayer","joy":"Share a favorite family recipe."},{"kind":"story","day":289,"week":42,"book":"Acts","title":"Walking and Leaping","ref":"Acts 3:1-10","story":"At the ninth hour, Peter and John met a lame man begging. Peter said, 'Silver and gold have I none... rise up and walk.' The man went walking, leaping, and praising God!","n":3,"w":"things the man did: walking, leaping, praising","v":"Silver and gold have I none; but such as I have give I thee.","vr":"Acts 3:6","move":"Walking, leaping, praising: march your feet 10 times (walking), lift your heels 5 times (leaping), then clap 5 times (praising).","craft":"Draw a gate. Draw a happy man jumping beside it.","tg":null,"q":"What can you give that is better than silver and gold?","prev":"The Day of Pentecost","joy":"Tell a funny story and laugh together.","brain":"Walk, leap, praise: 4 cross-over marches (walking), 4 heel lifts (leaping), then clap right hand to left knee, left hand to right knee (praising).","trace":null,"animal":"a_kangaroo"},{"kind":"story","day":290,"week":42,"book":"Acts","title":"Stephen Sees Heaven Open","ref":"Acts 6:3-8; 7:55-60","story":"The church chose seven helpers full of the Holy Spirit. One was Stephen. When enemies stoned him, he looked up and saw Jesus standing at God's right hand.","n":7,"w":"helpers the church chose","v":"Behold, I see the heavens opened, and the Son of man standing on the right hand of God.","vr":"Acts 7:56","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 7 times, for the number 7 in today's story.","craft":"Look out the window at the sky. Talk about what heaven might look like.","tg":null,"q":"Stephen forgave the people who hurt him. How did he do that?","prev":"Walking and Leaping","joy":"Say a blessing for a grandchild or young friend."},{"kind":"story","day":291,"week":42,"book":"Acts","title":"Philip and the Chariot","ref":"Acts 8:26-39","story":"An Ethiopian official was reading Isaiah in his chariot. Philip explained it was about Jesus. The man said, 'Here is water!' They both went down into the water, and he was baptized.","n":2,"w":"men who went down into the water","v":"See, here is water; what doth hinder me to be baptized?","vr":"Acts 8:36","move":"Hug and open: Hug yourself, then open your arms wide like you are welcoming a friend. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Float a leaf in a bowl of water. Push it under and let it come up, like baptism: dying to sin and rising to new life.","tg":null,"q":"How did the Ethiopian feel after his baptism?","prev":"Stephen Sees Heaven Open","joy":"Help with a small job: fold towels or set the table.","brain":"Chariot wheels: draw circles in the air with both hands, turning opposite ways like two wheels. 5 circles, then switch.","trace":"circles"},{"kind":"story","day":292,"week":42,"book":"Acts","title":"Saul Meets Jesus","ref":"Acts 9:1-18","story":"Saul was hurting Christians. On the road to Damascus a bright light shone, and Jesus spoke to him. Saul was blind for three days, then God opened his eyes and changed his heart.","n":3,"w":"days Saul could not see","v":"Lord, what wilt thou have me to do?","vr":"Acts 9:6","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Shine a flashlight on the wall. Turn it on and off 3 times.","tg":null,"q":"Ask God: 'What would You have me do today?'","prev":"Philip and the Chariot","joy":"Look out the window and name 5 things God made.","brain":"Eyes opened: cover your eyes with crossed hands, count to 3, then open your hands wide. Then look left, right, up and down. 3 times.","trace":null},{"kind":"story","day":293,"week":42,"book":"Acts","title":"Dorcas Who Sewed","ref":"Acts 9:36-42","story":"Dorcas made coats and clothes for poor widows. When she died, her friends sent two men for Peter. Peter prayed, and God raised her to life!","n":2,"w":"men who went to get Peter","v":"This woman was full of good works and almsdeeds which she did.","vr":"Acts 9:36","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Sew a few big stitches with yarn through holes punched in a paper plate, or fold a small towel neatly.","tg":null,"q":"What useful things have you made with your hands?","prev":"Saul Meets Jesus","joy":"Say today's memory verse to someone else."},{"kind":"sabbath","day":294,"week":42,"title":"Sabbath Rest","v":"Remember the sabbath day, to keep it holy.","vr":"Exodus 20:8","hymn":"All the Way My Saviour Leads Me","review":[["Acts 2:38","Repent, and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Ghost."],["Acts 3:6","Silver and gold have I none; but such as I have give I thee."],["Acts 7:56","Behold, I see the heavens opened, and the Son of man standing on the right hand of God."],["Acts 8:36","See, here is water; what doth hinder me to be baptized?"],["Acts 9:6","Lord, what wilt thou have me to do?"],["Acts 9:36","This woman was full of good works and almsdeeds which she did."]],"story_titles":["The Day of Pentecost","Walking and Leaping","Stephen Sees Heaven Open","Philip and the Chariot","Saul Meets Jesus","Dorcas Who Sewed"]},{"kind":"story","day":295,"week":43,"book":"Acts","title":"Peter's Vision of the Sheet","ref":"Acts 10:9-35","story":"Peter saw a great sheet let down from heaven by four corners. God showed him three times that the gospel is for every nation, not just one.","n":4,"w":"corners of the sheet","v":"Of a truth I perceive that God is no respecter of persons.","vr":"Acts 10:34","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do it 4 times, for the number 4 in today's story.","craft":"Hold a handkerchief by its 4 corners. Lift it up and down 3 times, like the sheet in the vision.","tg":null,"q":"Jesus loves people of every nation. Who do you know from another land?","prev":"Dorcas Who Sewed","joy":"Hum a hymn while you do today's craft."},{"kind":"story","day":296,"week":43,"book":"Acts","title":"An Angel Opens the Prison","ref":"Acts 12:1-17","story":"Peter was in prison, bound with two chains between soldiers. The church prayed for him. An angel woke him, the chains fell off, and the iron gate opened by itself!","n":2,"w":"chains that fell off Peter","v":"But prayer was made without ceasing of the church unto God for him.","vr":"Acts 12:5","move":"Toe taps: Keep your heels on the floor and tap your toes. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make a paper chain with 2 loops. Pull it apart to set Peter free!","tg":null,"q":"Who knocked at the door, and who answered? (Peter, and Rhoda.)","prev":"Peter's Vision of the Sheet","joy":"Count your blessings on your fingers."},{"kind":"story","day":297,"week":43,"book":"Acts","title":"Songs at Midnight","ref":"Acts 16:22-34","story":"Paul and Silas were beaten and put in prison. At midnight, they prayed and sang praises to God. An earthquake opened the doors, and the jailer believed in Jesus!","n":12,"w":"(midnight, 12 o'clock)","v":"And at midnight Paul and Silas prayed, and sang praises unto God.","vr":"Acts 16:25","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do it 12 times, for the number 12 in today's story.","craft":"Sing a favorite hymn together. Singing lifts the spirit even in hard times!","tg":null,"q":"What song do you sing when times are hard?","prev":"An Angel Opens the Prison","joy":"Tell someone, 'I love you.'","brain":"Prison song rhythm: clap twice, pat knees twice, cross arms and pat opposite knees twice. Keep the rhythm going while you sing.","trace":null},{"kind":"story","day":298,"week":43,"book":"Acts","title":"Lydia by the River","ref":"Acts 16:13-15","story":"On the Sabbath, Paul went to a riverside where women met to pray. Lydia, a seller of purple cloth, listened, and the Lord opened her heart. She was baptized.","n":null,"w":"","v":"Whose heart the Lord opened.","vr":"Acts 16:14","move":"Open your heart: bring your hands to your chest, then open your arms wide. 7 times, once for each day of the week.","craft":"Find something purple: a flower, cloth, or crayon. Draw a river and purple flowers beside it.","tg":null,"q":"Where do you like to pray on the Sabbath?","prev":"Songs at Midnight","joy":"Listen to a psalm read aloud before bed."},{"kind":"story","day":299,"week":43,"book":"Acts","title":"The Noble Bereans","ref":"Acts 17:10-12","story":"The people of Berea were noble. They listened to Paul gladly and searched the Scriptures every day to see if what he said was true.","n":7,"w":"days a week to search the Scriptures","v":"They received the word with all readiness of mind, and searched the scriptures daily.","vr":"Acts 17:11","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do it 7 times, for the number 7 in today's story.","craft":"Your helper looks up a verse in the Bible and you help find the book name. Search the Scriptures together!","tg":null,"q":"What is your favorite book of the Bible?","prev":"Lydia by the River","joy":"Look at a map and talk about places you have lived.","brain":"Search with the other hand: turn the pages of your Bible to find Psalm 23 using the hand you don't usually use.","trace":null},{"kind":"story","day":300,"week":43,"book":"Acts","title":"In Him We Live and Move","ref":"Acts 17:22-28","story":"In Athens, Paul saw an altar 'To the Unknown God.' He told them about the true God, who made the world and gives us life and breath.","n":3,"w":"things we do in Him: live, move, have our being","v":"For in him we live, and move, and have our being.","vr":"Acts 17:28","move":"Live, move, be: breathe in deeply (live), wave your arms (move), then sit still with hands on your heart (be). Do this 3 times.","craft":"Take 3 deep breaths. Every breath is a gift from God!","tg":null,"q":"How is God close to each of us?","prev":"The Noble Bereans","joy":"Wave to a neighbor or say hello to someone new.","brain":"Move to music: play a hymn and do cross-overs, right hand to left knee, left hand to right knee, in time with the music.","trace":null},{"kind":"sabbath","day":301,"week":43,"title":"Sabbath Rest","v":"The sabbath was made for man, and not man for the sabbath.","vr":"Mark 2:27","hymn":"Don't Forget the Sabbath","review":[["Acts 10:34","Of a truth I perceive that God is no respecter of persons."],["Acts 12:5","But prayer was made without ceasing of the church unto God for him."],["Acts 16:25","And at midnight Paul and Silas prayed, and sang praises unto God."],["Acts 16:14","Whose heart the Lord opened."],["Acts 17:11","They received the word with all readiness of mind, and searched the scriptures daily."],["Acts 17:28","For in him we live, and move, and have our being."]],"story_titles":["Peter's Vision of the Sheet","An Angel Opens the Prison","Songs at Midnight","Lydia by the River","The Noble Bereans","In Him We Live and Move"]},{"kind":"story","day":302,"week":44,"book":"Acts","title":"Paul the Tentmaker","ref":"Acts 18:1-4","story":"In Corinth, Paul worked making tents with Aquila and Priscilla. Every Sabbath, he went to the synagogue to tell people about Jesus.","n":3,"w":"tentmakers: Paul, Aquila, Priscilla","v":"Whatsoever thy hand findeth to do, do it with thy might.","vr":"Ecclesiastes 9:10","move":"Hand squeezes: Squeeze a soft ball or rolled washcloth tightly, then let go. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make a little tent: lean 2 popsicle sticks together and drape a small cloth or napkin over them.","tg":null,"q":"What work did you enjoy doing with your hands?","prev":"In Him We Live and Move","joy":"Wear a favorite outfit or piece of jewelry today."},{"kind":"story","day":303,"week":44,"book":"Acts","title":"Eutychus Falls Asleep","ref":"Acts 20:7-12","story":"Paul preached until midnight. A young man named Eutychus fell asleep in the window and fell from the third floor! Paul hugged him, and God brought him back to life.","n":3,"w":"(he fell from the third floor)","v":"And they brought the young man alive, and were not a little comforted.","vr":"Acts 20:12","move":"Heel raises: Keep your toes on the floor and lift your heels up, then lower them. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Smile together at this story! Stack 3 blocks for the 3 floors.","tg":null,"q":"Have you ever fallen asleep in church?","prev":"Paul the Tentmaker","joy":"Name 5 people who helped you in life. Thank God for each one."},{"kind":"story","day":304,"week":44,"book":"Acts","title":"Shipwreck!","ref":"Acts 27:20-44","story":"Paul's ship was caught in a terrible storm for many days. The sailors dropped four anchors. An angel told Paul everyone would be safe, and all 276 people reached land.","n":4,"w":"anchors the sailors dropped","v":"Wherefore, sirs, be of good cheer: for I believe God.","vr":"Acts 27:25","move":"Forward reaches: Reach both arms straight out in front of you, then pull them back to your chest. Do it 4 times, for the number 4 in today's story.","craft":"Make the tangram boat. Tie 4 buttons or stones on strings as anchors.","tg":"boat","q":"What is an anchor for your soul?","prev":"Eutychus Falls Asleep","joy":"Plan something to look forward to this week.","brain":"Stormy seas: trace the two waves with both hands at once, fast like the storm, then slow and gentle like a calm sea.","trace":"waves"},{"kind":"story","day":305,"week":44,"book":"Acts","title":"The Snake on Malta","ref":"Acts 28:1-11","story":"On the island of Malta, Paul gathered sticks for a fire. A viper bit his hand, but he shook it off into the fire and was not hurt. They stayed three months and healed many.","n":3,"w":"months they stayed on Malta","v":"For he shall give his angels charge over thee, to keep thee in all thy ways.","vr":"Psalm 91:11","move":"Shake it off: shake out your hands gently for a count of 10, like Paul shaking off the snake. Rest, then do it 2 more times.","craft":"Gather a small bundle of sticks and tie them with string.","tg":null,"q":"How did God protect Paul?","prev":"Shipwreck!","joy":"Brush your hair and smile in the mirror."},{"kind":"story","day":306,"week":44,"book":"Acts","title":"Paul in Rome","ref":"Acts 28:30-31; Romans 1:16","story":"Paul lived two whole years in a rented house in Rome. Though he was a prisoner, he welcomed everyone and told them about Jesus.","n":2,"w":"years Paul lived in Rome","v":"For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth.","vr":"Romans 1:16","move":"Knock-knock: Knock gently on the table with your knuckles. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make the tangram house. Invite someone to visit you this week, like Paul welcomed visitors.","tg":"house","q":"How can you share Jesus from your own home?","prev":"The Snake on Malta","joy":"Say the books of the Bible you remember."},{"kind":"story","day":307,"week":44,"book":"Romans","title":"Nothing Can Separate Us","ref":"Romans 8:35-39","story":"Paul wrote that nothing can separate us from God's love: not death, not life, not angels, not powers, not things now, not things to come, not height, not depth, nothing!","n":10,"w":"things that cannot separate us from God's love","v":"Who shall separate us from the love of Christ?","vr":"Romans 8:35","move":"Shoulder shrugs: Lift your shoulders up toward your ears, then let them drop. Do it 10 times, for the number 10 in today's story.","craft":"Wrap your arms around a pillow and hug it tight. Nothing can take you out of God's arms.","tg":null,"q":"How does it feel to know God's love never lets go?","prev":"Paul in Rome","joy":"Help prepare a simple meal or snack."},{"kind":"sabbath","day":308,"week":44,"title":"Sabbath Rest","v":"Be still, and know that I am God.","vr":"Psalm 46:10","hymn":"Day Is Dying in the West","review":[["Ecclesiastes 9:10","Whatsoever thy hand findeth to do, do it with thy might."],["Acts 20:12","And they brought the young man alive, and were not a little comforted."],["Acts 27:25","Wherefore, sirs, be of good cheer: for I believe God."],["Psalm 91:11","For he shall give his angels charge over thee, to keep thee in all thy ways."],["Romans 1:16","For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth."],["Romans 8:35","Who shall separate us from the love of Christ?"]],"story_titles":["Paul the Tentmaker","Eutychus Falls Asleep","Shipwreck!","The Snake on Malta","Paul in Rome","Nothing Can Separate Us"]},{"kind":"story","day":309,"week":45,"book":"Romans","title":"Rejoicing in Hope","ref":"Romans 12:9-13","story":"Paul told the church three ways to live: be joyful in hope, be patient in trouble, and keep praying.","n":3,"w":"ways to live: rejoice, be patient, pray","v":"Rejoicing in hope; patient in tribulation; continuing instant in prayer.","vr":"Romans 12:12","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Draw 3 boxes: a smile (rejoice), a clock (patient), praying hands (pray).","tg":null,"q":"Which one is hardest for you?","prev":"Nothing Can Separate Us","joy":"Take a short walk to the mailbox or porch.","animal":"a_snail"},{"kind":"story","day":310,"week":45,"book":"1 Corinthians","title":"The Greatest of These","ref":"1 Corinthians 13","story":"Paul wrote the love chapter. Love is patient and kind. Three things last forever: faith, hope, and love. But the greatest is love.","n":3,"w":"things that last: faith, hope, charity (love)","v":"And now abideth faith, hope, charity, these three; but the greatest of these is charity.","vr":"1 Corinthians 13:13","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Cut out 3 paper hearts of different sizes. Label them faith, hope, love, with love the biggest.","tg":null,"q":"Who taught you what love really means?","prev":"Rejoicing in Hope","joy":"Tell your helper what you want to do first in heaven.","brain":"Mirror heart: put a finger of each hand at the top of the heart. Trace down both sides at the same time until your fingers meet at the bottom.","trace":"heart"},{"kind":"story","day":311,"week":45,"book":"1 Corinthians","title":"In the Twinkling of an Eye","ref":"1 Corinthians 15:3-8, 51-55","story":"After Jesus rose, over five hundred people saw Him at once! Paul said that when Jesus comes, the trumpet will sound and the dead in Christ will be raised in the twinkling of an eye.","n":5,"w":"(500 people saw Jesus: count 5 hundreds)","v":"In a moment, in the twinkling of an eye, at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible.","vr":"1 Corinthians 15:52","move":"Twinkle: blink your eyes quickly 5 times, then open them wide. Rest. Do it 5 times in all.","craft":"Roll a paper into a trumpet. 'Toot' it and say 'Jesus is coming!'","tg":null,"q":"What will happen when the trumpet sounds?","prev":"The Greatest of These","joy":"Feel something new: tree bark, wool, a smooth stone.","brain":"Twinkle: blink your right eye, then your left, then both. Repeat 5 times. Then wink at your helper!","trace":null},{"kind":"story","day":312,"week":45,"book":"1 Corinthians","title":"Your Body Is God's Temple","ref":"1 Corinthians 6:19-20; 10:31","story":"Paul said our bodies are temples of the Holy Spirit. God gives 8 natural helps for health: good food, exercise, water, sunlight, temperance, fresh air, rest, and trust in God.","n":8,"w":"health helps: food, exercise, water, sunlight, temperance, air, rest, trust","v":"Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.","vr":"1 Corinthians 10:31","move":"Knee pats: Pat your knees with both hands. Do it 8 times, for the number 8 in today's story.","craft":"Make a simple chart of the 8 health helps. Check off each one you do today (sunshine, water, fresh air...).","tg":null,"q":"Which health habit is easiest for you? Which is hardest?","prev":"In the Twinkling of an Eye","joy":"Say the memory verses you remember from this week."},{"kind":"story","day":313,"week":45,"book":"2 Corinthians","title":"Strength in Weakness","ref":"2 Corinthians 12:7-10","story":"Paul had a painful 'thorn in the flesh.' He prayed three times for God to take it away. God said, 'My grace is enough for you. My strength is best seen in weakness.'","n":3,"w":"times Paul prayed about his thorn","v":"My grace is sufficient for thee: for my strength is made perfect in weakness.","vr":"2 Corinthians 12:9","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Hold a soft flower in one hand and a rough twig in the other. God's grace is enough for every hard thing.","tg":null,"q":"When has God been strong for you when you felt weak?","prev":"Your Body Is God's Temple","joy":"Draw or color something just for fun."},{"kind":"story","day":314,"week":45,"book":"Galatians","title":"The Fruit of the Spirit","ref":"Galatians 5:22-23","story":"Paul listed nine fruits the Holy Spirit grows in us: love, joy, peace, longsuffering, gentleness, goodness, faith, meekness, and temperance.","n":9,"w":"fruits of the Spirit","v":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith.","vr":"Galatians 5:22","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do it 9 times, for the number 9 in today's story.","craft":"Make the tangram tree. Put 9 small paper circles or buttons on it as fruit, naming each one.","tg":"tree","q":"Which fruit of the Spirit do you see growing in your life?","prev":"Strength in Weakness","joy":"Give away something you no longer need.","brain":"Nine fruits: say the 9 fruits, touching thumb to fingers across both hands: love, joy, peace, longsuffering on the left; gentleness, goodness, faith, meekness on the right; temperance with both thumbs together.","trace":null},{"kind":"sabbath","day":315,"week":45,"title":"Sabbath Rest","v":"Come unto me, all ye that labour and are heavy laden, and I will give you rest.","vr":"Matthew 11:28","hymn":"Jesus Is Coming Again","review":[["Romans 12:12","Rejoicing in hope; patient in tribulation; continuing instant in prayer."],["1 Corinthians 13:13","And now abideth faith, hope, charity, these three; but the greatest of these is charity."],["1 Corinthians 15:52","In a moment, in the twinkling of an eye, at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible."],["1 Corinthians 10:31","Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God."],["2 Corinthians 12:9","My grace is sufficient for thee: for my strength is made perfect in weakness."],["Galatians 5:22","But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith."]],"story_titles":["Rejoicing in Hope","The Greatest of These","In the Twinkling of an Eye","Your Body Is God's Temple","Strength in Weakness","The Fruit of the Spirit"]},{"kind":"story","day":316,"week":46,"book":"Ephesians","title":"The Armour of God","ref":"Ephesians 6:10-17","story":"Paul said to put on God's armour: the belt of truth, breastplate of righteousness, shoes of peace, shield of faith, helmet of salvation, and sword of the Spirit.","n":6,"w":"pieces of God's armour","v":"Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.","vr":"Ephesians 6:11","move":"Put on the armour: touch your waist (belt), chest (breastplate), feet (shoes), left arm (shield), head (helmet), and lift your right hand (sword). Do the whole set 3 times.","craft":"Make a paper helmet or shield from a paper plate. Decorate it with a cross.","tg":null,"q":"Which piece of armour do you need most today?","prev":"The Fruit of the Spirit","joy":"Pray for your church and your pastor.","brain":"Armour cross-overs: right hand touches left shoulder (breastplate), left hand touches right hip (belt), both hands on head (helmet). Repeat 5 times.","trace":null},{"kind":"story","day":317,"week":46,"book":"Ephesians","title":"Saved by Grace","ref":"Ephesians 2:4-10","story":"We cannot earn heaven by being good. God saves us by His grace, a free gift, when we believe in Jesus. Then we do good works because we love Him.","n":2,"w":"(saved by grace, through faith)","v":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God.","vr":"Ephesians 2:8","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Wrap a small box as a gift. Write 'Grace' on the tag. God's salvation is a free gift!","tg":null,"q":"What is the best gift you ever received?","prev":"The Armour of God","joy":"Pet an animal or watch the birds for a while."},{"kind":"story","day":318,"week":46,"book":"Philippians","title":"Rejoice Always","ref":"Philippians 4:4-7","story":"Paul wrote this happy letter while in prison! He said 'Rejoice' twice. Don't worry; pray about everything with thanks, and God's peace will guard your heart.","n":2,"w":"times Paul says 'Rejoice' in the verse","v":"Rejoice in the Lord alway: and again I say, Rejoice.","vr":"Philippians 4:4","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Draw a big smiling sun. Write or say one thing that makes you glad today.","tg":null,"q":"How could Paul be happy in prison?","prev":"Saved by Grace","joy":"Listen to a sermon or Bible reading."},{"kind":"story","day":319,"week":46,"book":"Philippians","title":"Think on These Things","ref":"Philippians 4:8","story":"Paul told us to fill our minds with good things: whatever is true, honest, just, pure, lovely, of good report, full of virtue, and praise.","n":8,"w":"good things to think about","v":"Whatsoever things are lovely, whatsoever things are of good report... think on these things.","vr":"Philippians 4:8","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do it 8 times, for the number 8 in today's story.","craft":"Look through a photo album and find 8 lovely memories. Talk about each one.","tg":null,"q":"What is a lovely thing you like to think about?","prev":"Rejoice Always","joy":"Remember a time God answered prayer, and tell it."},{"kind":"story","day":320,"week":46,"book":"Colossians","title":"Set Your Mind on Things Above","ref":"Colossians 3:1-4, 12-14","story":"Paul said to set our hearts on heaven. He told us to 'put on' five kinds of clothes: mercy, kindness, humbleness, meekness, and patience.","n":5,"w":"'clothes' to put on","v":"Set your affection on things above, not on things on the earth.","vr":"Colossians 3:2","move":"Toe taps: Keep your heels on the floor and tap your toes. Do it 5 times, for the number 5 in today's story.","craft":"Button a shirt, zip a jacket, or fold 5 pieces of clothing. Name one kindness for each.","tg":null,"q":"What kindness can you 'wear' today?","prev":"Think on These Things","joy":"Sort buttons, coins or beans by color."},{"kind":"story","day":321,"week":46,"book":"1 Thessalonians","title":"The Lord Himself Shall Descend","ref":"1 Thessalonians 4:13-18","story":"Paul comforted the church: when Jesus comes, there will be a shout, the voice of the archangel, and the trumpet of God. Those who died in Christ will rise first, and we will meet Him in the air!","n":3,"w":"sounds: a shout, the archangel's voice, God's trumpet","v":"For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first.","vr":"1 Thessalonians 4:16","move":"Shoulder rolls: Roll your shoulders slowly backward in a circle. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Glue cotton balls on blue paper for clouds. Draw rays of light coming through. Jesus is coming!","tg":null,"q":"Who are you excited to see again when Jesus comes?","prev":"Set Your Mind on Things Above","joy":"Rest well tonight: sleep is God's good gift.","brain":"Trumpet rhythm: pat knees: right, right, left, then clap. Say 'Jesus is coming!' Repeat 5 times.","trace":null},{"kind":"sabbath","day":322,"week":46,"title":"Sabbath Rest","v":"This is the day which the LORD hath made; we will rejoice and be glad in it.","vr":"Psalm 118:24","hymn":"I Need Thee Every Hour","review":[["Ephesians 6:11","Put on the whole armour of God, that ye may be able to stand against the wiles of the devil."],["Ephesians 2:8","For by grace are ye saved through faith; and that not of yourselves: it is the gift of God."],["Philippians 4:4","Rejoice in the Lord alway: and again I say, Rejoice."],["Philippians 4:8","Whatsoever things are lovely, whatsoever things are of good report... think on these things."],["Colossians 3:2","Set your affection on things above, not on things on the earth."],["1 Thessalonians 4:16","For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first."]],"story_titles":["The Armour of God","Saved by Grace","Rejoice Always","Think on These Things","Set Your Mind on Things Above","The Lord Himself Shall Descend"]},{"kind":"story","day":323,"week":47,"book":"1 Thessalonians","title":"Pray Without Ceasing","ref":"1 Thessalonians 5:16-18","story":"Paul gave three short commands: Rejoice evermore. Pray without ceasing. In every thing give thanks.","n":3,"w":"short commands","v":"Pray without ceasing.","vr":"1 Thessalonians 5:17","move":"Seated marching: Sitting tall, lift one knee, then the other. Each lift counts as one. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make 'breath prayers': breathe in and say 'Jesus,' breathe out and say 'I love You.' Try it all day.","tg":null,"q":"What can you give thanks for right now?","prev":"The Lord Himself Shall Descend","joy":"Call or send a card to someone you love.","brain":"Breath and tap: breathe in as you tap your right knee, breathe out as you tap your left, praying 'Jesus' and 'I love You.' 10 breaths.","trace":null},{"kind":"story","day":324,"week":47,"book":"2 Timothy","title":"Grandmother Lois","ref":"2 Timothy 1:5; 3:14-15","story":"Young Timothy learned about God from his grandmother Lois and his mother Eunice. Their faith was passed down through three generations!","n":3,"w":"generations: Lois, Eunice, Timothy","v":"And that from a child thou hast known the holy scriptures.","vr":"2 Timothy 3:15","move":"Toe touches: Sit tall, then slowly reach down toward your toes (or just to your knees) and sit back up. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Draw a simple family tree with 3 levels: you, your children, your grandchildren. Pray for each level.","tg":null,"q":"Who taught you about God when you were a child?","prev":"Pray Without Ceasing","joy":"Name 3 things you are thankful for today."},{"kind":"story","day":325,"week":47,"book":"2 Timothy","title":"I Have Kept the Faith","ref":"2 Timothy 4:6-8","story":"Near the end of his life, Paul wrote, 'I have fought a good fight, I have finished my course, I have kept the faith.' A crown is waiting for all who love Jesus' appearing.","n":null,"w":"","v":"I have fought a good fight, I have finished my course, I have kept the faith.","vr":"2 Timothy 4:7","move":"Crown yourself: raise both hands up above your head and bring them down gently to rest on top of your head, like putting on a crown. 6 times.","craft":"Make the tangram crown. Jesus has a crown ready for you!","tg":"crown","q":"How have you kept the faith through your long life?","prev":"Grandmother Lois","joy":"Sing your favorite hymn, all the way through."},{"kind":"story","day":326,"week":47,"book":"Titus","title":"That Blessed Hope","ref":"Titus 2:11-14","story":"Paul told Titus that God's grace teaches us to live well while we look for the blessed hope: the glorious appearing of Jesus!","n":null,"w":"","v":"Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ.","vr":"Titus 2:13","move":"Looking up: sit tall and slowly lift your eyes and chin to look up, then back down. 5 times. Then raise both arms high 5 times.","craft":"Look out a window at the eastern sky. Sing 'We Have This Hope' or another Second Coming song.","tg":null,"q":"What does the 'blessed hope' mean to you?","prev":"I Have Kept the Faith","joy":"Look at an old photo and tell the story behind it."},{"kind":"story","day":327,"week":47,"book":"Hebrews","title":"Heroes of Faith","ref":"Hebrews 11","story":"Hebrews 11 is the faith chapter. It names Abel, Enoch, Noah, Abraham, Sarah, Isaac, Jacob, Joseph, Moses, Rahab, Gideon, Samson, David, Samuel and more.","n":null,"w":"","v":"Now faith is the substance of things hoped for, the evidence of things not seen.","vr":"Hebrews 11:1","move":"Hero count: name a faith hero you remember from this book, then raise both arms once. Keep going: how many can you name?","craft":"Look back through this book. Name as many faith heroes as you can remember!","tg":null,"q":"Which Bible hero do you want to meet first in heaven?","prev":"That Blessed Hope","joy":"Pray for a neighbor by name.","brain":"Hero taps: name a faith hero for each tap, alternating knees: Abel, Enoch, Noah, Abraham, Sarah... How many can you name?","trace":null},{"kind":"story","day":328,"week":47,"book":"Hebrews","title":"Run the Race","ref":"Hebrews 12:1-2","story":"A great cloud of witnesses who trusted God is cheering us on. We run our race with patience, looking to Jesus, who started our faith and will finish it.","n":null,"w":"","v":"Looking unto Jesus the author and finisher of our faith.","vr":"Hebrews 12:2","move":"Run the race: march in place (seated is fine) for a count of 20, pumping your arms. Rest, then 20 more if you can.","craft":"Draw a race track with a finish line. Put a cross at the finish line.","tg":null,"q":"What helps you keep going in your race?","prev":"Heroes of Faith","joy":"Water a plant or put out seed for the birds.","brain":"Race march: 20 cross-over steps in your chair, pumping your arms in opposite directions.","trace":null},{"kind":"sabbath","day":329,"week":47,"title":"Sabbath Rest","v":"There remaineth therefore a rest to the people of God.","vr":"Hebrews 4:9","hymn":"Saviour, Like a Shepherd Lead Us","review":[["1 Thessalonians 5:17","Pray without ceasing."],["2 Timothy 3:15","And that from a child thou hast known the holy scriptures."],["2 Timothy 4:7","I have fought a good fight, I have finished my course, I have kept the faith."],["Titus 2:13","Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ."],["Hebrews 11:1","Now faith is the substance of things hoped for, the evidence of things not seen."],["Hebrews 12:2","Looking unto Jesus the author and finisher of our faith."]],"story_titles":["Pray Without Ceasing","Grandmother Lois","I Have Kept the Faith","That Blessed Hope","Heroes of Faith","Run the Race"]},{"kind":"story","day":330,"week":48,"book":"Hebrews","title":"The Same Yesterday, Today, and Forever","ref":"Hebrews 13:5-8","story":"God says, 'I will never leave thee, nor forsake thee.' Jesus Christ never changes: He is the same yesterday, today, and forever.","n":3,"w":"times: yesterday, today, forever","v":"Jesus Christ the same yesterday, and to day, and for ever.","vr":"Hebrews 13:8","move":"Ankle circles: Lift one foot a little and draw a circle with your toes. Switch feet halfway. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Lay out 3 papers: an old photo (yesterday), today's date (today), and a star (forever).","tg":null,"q":"How has Jesus been the same all through your life?","prev":"Run the Race","joy":"Sit in the sunshine for 10 minutes.","brain":"Forever: trace the infinity sign, saying 'yesterday' on the left loop, 'today' in the middle, and 'forever' on the right loop. Use one hand, then the other.","trace":"infinity"},{"kind":"story","day":331,"week":48,"book":"James","title":"Draw Nigh to God","ref":"James 3:3-5; 4:8","story":"James said a small bit steers a big horse, and a small rudder steers a big ship. Our words steer our lives. When we draw near to God, He draws near to us.","n":2,"w":"small things that steer: a bit and a rudder","v":"Draw nigh to God, and he will draw nigh to you.","vr":"James 4:8","move":"Knock-knock: Knock gently on the table with your knuckles. Do 2, rest, and repeat for 3 rounds (the number 2 from today's story).","craft":"Make the tangram boat. Add a small popsicle stick at the back as a rudder.","tg":"boat","q":"What kind words can you say today?","prev":"The Same Yesterday, Today, and Forever","joy":"Drink a full glass of water, and thank God for it."},{"kind":"story","day":332,"week":48,"book":"1 Peter","title":"Cast Your Cares on Him","ref":"1 Peter 5:6-7","story":"Peter said to throw all our worries onto God, because He cares for us.","n":null,"w":"","v":"Casting all your care upon him; for he careth for you.","vr":"1 Peter 5:7","move":"Cast your cares: lift your shoulders up to your ears, hold for 3 counts, then drop them and let the worries go. 7 times.","craft":"Your helper writes down your worries on slips of paper. Fold them and put them in a 'God box.' Let Him carry them.","tg":null,"q":"What worry would you like to give to God?","prev":"Draw Nigh to God","joy":"Give someone a kind compliment."},{"kind":"story","day":333,"week":48,"book":"2 Peter","title":"The Ladder of Growth","ref":"2 Peter 1:5-7; 3:18","story":"Peter listed eight steps to grow: faith, virtue, knowledge, temperance, patience, godliness, brotherly kindness, and charity.","n":8,"w":"steps of growth","v":"But grow in grace, and in the knowledge of our Lord and Saviour Jesus Christ.","vr":"2 Peter 3:18","move":"Leg straightening: Straighten one leg out in front, hold for 2 counts, and lower it. Switch legs each time. Do it 8 times, for the number 8 in today's story.","craft":"Make a ladder with 8 popsicle-stick rungs, or draw one. Name a step on each rung.","tg":null,"q":"How have you grown in God's grace through the years?","prev":"Cast Your Cares on Him","joy":"Tell your helper about a happy day from your childhood.","brain":"Climb 8 steps: reach up hand over hand 8 times, naming a step each time: faith, virtue, knowledge, temperance, patience, godliness, kindness, charity.","trace":null},{"kind":"story","day":334,"week":48,"book":"1 John","title":"God Is Love","ref":"1 John 4:7-11","story":"The apostle John, who lived to be very old, wrote that God is love. Because God loves us, we should love one another.","n":3,"w":"words: 'God is love'","v":"He that loveth not knoweth not God; for God is love.","vr":"1 John 4:8","move":"Finger taps: Touch each fingertip to your thumb, one after another. Each touch counts as one. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Cut out a paper heart and write 'God is love' on it. Give it to someone.","tg":null,"q":"How does God show His love to you every day?","prev":"The Ladder of Growth","joy":"Listen to some beautiful music.","brain":"Heart with both hands: trace the heart with a finger of each hand at the same time, from the top down to the bottom point.","trace":"heart"},{"kind":"story","day":335,"week":48,"book":"Jude","title":"Able to Keep You from Falling","ref":"Jude 24-25","story":"Jude ended his short letter with a beautiful promise: God is able to keep us from falling and to present us faultless before His glory with great joy.","n":null,"w":"","v":"Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy.","vr":"Jude 24","move":"Balance: stand holding the back of a sturdy chair, helper beside you. Stand tall with both feet flat for a count of 10. Rest. Do this 3 times. (If standing is hard, sit tall and lift one foot for a count of 5, then the other.)","craft":"Hold on to your sturdy chair and feel how steady it is. God holds us steady even more!","tg":null,"q":"How does God keep you from falling?","prev":"God Is Love","joy":"Smell a flower, a spice, or a piece of fresh fruit."},{"kind":"sabbath","day":336,"week":48,"title":"Sabbath Rest","v":"And from one sabbath to another, shall all flesh come to worship before me, saith the LORD.","vr":"Isaiah 66:23","hymn":"My Jesus, I Love Thee","review":[["Hebrews 13:8","Jesus Christ the same yesterday, and to day, and for ever."],["James 4:8","Draw nigh to God, and he will draw nigh to you."],["1 Peter 5:7","Casting all your care upon him; for he careth for you."],["2 Peter 3:18","But grow in grace, and in the knowledge of our Lord and Saviour Jesus Christ."],["1 John 4:8","He that loveth not knoweth not God; for God is love."],["Jude 24","Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy."]],"story_titles":["The Same Yesterday, Today, and Forever","Draw Nigh to God","Cast Your Cares on Him","The Ladder of Growth","God Is Love","Able to Keep You from Falling"]},{"kind":"story","day":337,"week":49,"book":"Revelation","title":"John on Patmos","ref":"Revelation 1:1-3, 9-10","story":"Old John was sent to the island of Patmos. On the Lord's day, the Sabbath, Jesus gave him a vision of the future. There is a blessing for all who read and hear it!","n":7,"w":"churches Jesus sent messages to","v":"Blessed is he that readeth, and they that hear the words of this prophecy, and keep those things which are written therein: for the time is at hand.","vr":"Revelation 1:3","move":"Knee pats: Pat your knees with both hands. Do it 7 times, for the number 7 in today's story.","craft":"Draw an island in a blue sea. Put a tiny figure on it for John.","tg":null,"q":"You receive a blessing just by listening! How does that feel?","prev":"Able to Keep You from Falling","joy":"Teach your helper something you know how to do."},{"kind":"story","day":338,"week":49,"book":"Revelation","title":"Jesus Among the Lampstands","ref":"Revelation 1:8, 12-20","story":"John saw Jesus walking among seven golden lampstands, holding seven stars in His right hand. Jesus said, 'I am Alpha and Omega, the beginning and the ending.'","n":7,"w":"golden lampstands (and 7 stars)","v":"I am Alpha and Omega, the beginning and the ending, saith the Lord.","vr":"Revelation 1:8","move":"Gentle punches: Make soft fists and punch slowly forward, one arm and then the other. Do it 7 times, for the number 7 in today's story.","craft":"Make the tangram candle. Line up 7 yellow buttons as the stars.","tg":"candle","q":"Jesus walks among His churches. How is He with your church?","prev":"John on Patmos","joy":"Hold hands with your helper and pray together.","brain":"Alpha and Omega: draw an A in the air with your right hand while drawing an O with your left. Then switch hands.","trace":null},{"kind":"story","day":339,"week":49,"book":"Revelation","title":"Jesus Knocks at the Door","ref":"Revelation 3:14-22","story":"Jesus said to the church of Laodicea, 'Behold, I stand at the door, and knock.' He offers three gifts: gold, white clothes, and eye salve.","n":3,"w":"gifts Jesus offers: gold, white raiment, eyesalve","v":"Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him.","vr":"Revelation 3:20","move":"Wrist circles: Hold your hands up and turn your wrists in slow circles. Do 3, rest, and repeat for 3 rounds (the number 3 from today's story).","craft":"Make the tangram house. Knock on the table and say, 'Come in, Lord Jesus!'","tg":"house","q":"How do we open the door of our hearts to Jesus?","prev":"Jesus Among the Lampstands","joy":"Step outside and take 5 deep breaths of fresh air."},{"kind":"story","day":340,"week":49,"book":"Revelation","title":"The Throne in Heaven","ref":"Revelation 4","story":"John saw God's throne with a rainbow around it. Twenty-four elders sat around it, and they cast their crowns before God, singing 'Holy, holy, holy.'","n":24,"w":"elders around the throne","v":"Holy, holy, holy, Lord God Almighty, which was, and is, and is to come.","vr":"Revelation 4:8","move":"Walking paces: With your helper right beside you, take slow steps across the room (or march in your chair). Do 24 in all: 2 sets of 10 with a rest between, then 4 more.","craft":"Make the tangram crown. 'Cast' it down before an open Bible as a way of saying, 'You are King, Lord.'","tg":"crown","q":"What do you think heaven's worship will sound like?","prev":"Jesus Knocks at the Door","joy":"Make a list of people to pray for this week.","brain":"Rainbow round the throne: trace the rainbow with a finger of each hand, both starting at the top and moving in opposite directions.","trace":"rainbow"},{"kind":"story","day":341,"week":49,"book":"Revelation","title":"Worthy Is the Lamb","ref":"Revelation 5:6-14","story":"Only Jesus, the Lamb, was worthy to open God's book. All heaven sang that He is worthy of seven things: power, riches, wisdom, strength, honour, glory, and blessing.","n":7,"w":"things the Lamb is worthy to receive","v":"Worthy is the Lamb that was slain to receive power, and riches, and wisdom, and strength, and honour, and glory, and blessing.","vr":"Revelation 5:12","move":"Side reaches: Sit tall. Reach your right arm up and over, then your left arm. Each reach counts as one. Do it 7 times, for the number 7 in today's story.","craft":"Make a cotton-ball lamb. Say the 7 words of praise, touching the lamb for each one.","tg":null,"q":"Why is Jesus worthy of our praise?","prev":"The Throne in Heaven","joy":"Share a favorite family recipe."},{"kind":"story","day":342,"week":49,"book":"Revelation","title":"A Great Multitude","ref":"Revelation 7:4-9","story":"John heard of 144,000 sealed from the twelve tribes of Israel. Then he saw a great multitude that no one could count, from every nation, standing before the throne!","n":12,"w":"tribes (12,000 from each tribe)","v":"After this I beheld, and, lo, a great multitude, which no man could number.","vr":"Revelation 7:9","move":"Arm raises: Lift both arms up toward heaven, then lower them slowly. Do it 12 times, for the number 12 in today's story.","craft":"Arrange 12 buttons in a circle. Scatter many more around them: too many to count!","tg":null,"q":"Who do you hope to see in that great crowd?","prev":"Worthy Is the Lamb","joy":"Tell a funny story and laugh together.","animal":"a_seal"},{"kind":"sabbath","day":343,"week":49,"title":"Sabbath Rest","v":"Therefore the Son of man is Lord also of the sabbath.","vr":"Mark 2:28","hymn":"There Is a Fountain","review":[["Revelation 1:3","Blessed is he that readeth, and they that hear the words of this prophecy, and keep those things which are written therein: for the time is at hand."],["Revelation 1:8","I am Alpha and Omega, the beginning and the ending, saith the Lord."],["Revelation 3:20","Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him."],["Revelation 4:8","Holy, holy, holy, Lord God Almighty, which was, and is, and is to come."],["Revelation 5:12","Worthy is the Lamb that was slain to receive power, and riches, and wisdom, and strength, and honour, and glory, and blessing."],["Revelation 7:9","After this I beheld, and, lo, a great multitude, which no man could number."]],"story_titles":["John on Patmos","Jesus Among the Lampstands","Jesus Knocks at the Door","The Throne in Heaven","Worthy Is the Lamb","A Great Multitude"]},{"kind":"story","day":344,"week":50,"book":"Revelation","title":"Palms of Victory","ref":"Revelation 7:9-17","story":"The great multitude wore white robes and held palm branches. They cried, 'Salvation to our God and to the Lamb!' God will wipe away all tears.","n":null,"w":"","v":"Salvation to our God which sitteth upon the throne, and unto the Lamb.","vr":"Revelation 7:10","move":"Wave your palms: hold a leaf (or nothing) in each hand and wave them high over your head 10 times. Then side to side 10 times.","craft":"Find long green leaves or cut green paper palms. Wave them while you sing a praise song.","tg":null,"q":"What will it be like when God wipes away all tears?","prev":"A Great Multitude","joy":"Say a blessing for a grandchild or young friend."},{"kind":"story","day":345,"week":50,"book":"Revelation","title":"Seven Trumpets","ref":"Revelation 8:2; 11:15","story":"John saw seven angels with seven trumpets. When the seventh trumpet sounded, loud voices in heaven said the kingdoms of this world had become the kingdom of Christ.","n":7,"w":"trumpets","v":"The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever.","vr":"Revelation 11:15","move":"Toe
